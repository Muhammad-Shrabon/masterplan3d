        function createStoneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#6a737b';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 400; i++) {
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                const radius = Math.random() * 4 + 2;
                ctx.fillStyle = Math.random() > 0.5 ? '#8c98a3' : '#4d555c';
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            return tex;
        }

        class CartoonRiver {
            constructor(scene, config) {
                this.scene = scene;
                this.points = config.points || [];
                this.width = config.width || 10;
                this.thickness = config.thickness || 0.8;
                this.color = config.color || 0x187C19;

                // New position and rotation configuration
                this.position = config.position || { x: 0, y: 0.2, z: 0 };
                this.rotation = config.rotation || { x: 0, y: 0, z: 0 };

                this.mesh = null;
                this.material = null;

                this.init();
            }

            init() {
                // Create the smooth curve path
                const curve = new THREE.CatmullRomCurve3(this.points);
                curve.curveType = 'catmullrom';
                curve.tension = 0.5;

                // Tube radius is half the width
                const radius = this.width / 2;

                // Create the geometry
                const tubeGeo = new THREE.TubeGeometry(curve, 100, radius, 8, false);

                // Apply thickness by scaling the Y axis
                const yScale = this.thickness / this.width;
                tubeGeo.scale(1, yScale, 1);

                this.material = new THREE.MeshPhongMaterial({
                    color: this.color,
                    transparent: true,
                    opacity: 0.9,
                    shininess: 120
                });

                this.mesh = new THREE.Mesh(tubeGeo, this.material);
                this.mesh.receiveShadow = true;

                // Apply coordinates and rotation
                this.mesh.position.set(this.position.x, this.position.y, this.position.z);
                this.mesh.rotation.set(this.rotation.x, this.rotation.y, this.rotation.z);

                if (this.scene) this.scene.add(this.mesh);
            }

            update(time) {
                if (this.material) {
                    // Gentle pulse effect for water movement
                    this.material.opacity = 0.85 + Math.sin(time * 0.0015) * 0.05;
                }
            }

        // --- Global Optimization System ---
        function optimizeScene() {
            const startTime = performance.now();
            const treeData = { stdTree: [], hqTree: [], wallGTree: [], wallStdTree: [] };

            scene.updateMatrixWorld(true);
            const toRemove = [];
            scene.traverse(node => {
                if (treeData[node.name]) {
                    treeData[node.name].push(node.matrixWorld.clone());
                    toRemove.push(node);
                }
            });

            function getSharedIMesh(key, geo, mat, count) {
                if (!scene.userData.iMeshes) scene.userData.iMeshes = {};
                if (!scene.userData.iMeshes[key]) {
                    const iMesh = new THREE.InstancedMesh(geo, mat, count);
                    iMesh.castShadow = true;
                    iMesh.receiveShadow = true;
                    scene.add(iMesh);
                    scene.userData.iMeshes[key] = iMesh;
                    iMesh.userData.instanceCount = 0;
                }
                return scene.userData.iMeshes[key];
            }

            if (treeData.stdTree.length > 0) {
                const temp = createTree();
                const comps = []; temp.traverse(c => { if (c.isMesh) comps.push({ geo: c.geometry, mat: c.material, pos: c.position, sc: c.scale, rot: c.rotation }); });
                comps.forEach(comp => {
                    const iMesh = getSharedIMesh(`stdTree_${comp.geo.type}_${comp.mat.uuid}`, comp.geo, comp.mat, treeData.stdTree.length);
                    treeData.stdTree.forEach((mWorld, idx) => {
                        const m = new THREE.Matrix4().copy(mWorld);
                        m.multiply(new THREE.Matrix4().compose(comp.pos, new THREE.Quaternion().setFromEuler(comp.rot), comp.sc));
                        iMesh.setMatrixAt(idx, m);
                    });
                });
            }

            if (treeData.hqTree.length > 0) {
                const temp = createHighQualityTree();
                const comps = []; temp.traverse(c => { if (c.isMesh) comps.push({ geo: c.geometry, mat: c.material, pos: c.position, sc: c.scale, rot: c.rotation }); });
                comps.forEach(comp => {
                    const iMesh = getSharedIMesh(`hqTree_${comp.geo.type}_${comp.mat.uuid}`, comp.geo, comp.mat, treeData.hqTree.length);
                    treeData.hqTree.forEach((mWorld, idx) => {
                        const m = new THREE.Matrix4().copy(mWorld);
                        m.multiply(new THREE.Matrix4().compose(comp.pos, new THREE.Quaternion().setFromEuler(comp.rot), comp.sc));
                        iMesh.setMatrixAt(idx, m);
                    });
                });
            }

            ['wallGTree', 'wallStdTree'].forEach(type => {
                if (treeData[type].length > 0) {
                    const temp = type === 'wallGTree' ? createGTree(1.0) : createHighQualityTree();
                    temp.traverse(c => {
                        if (c.isMesh) {
                            const iMesh = getSharedIMesh(`${type}_mesh_${c.id}`, c.geometry, c.material, treeData[type].length);
                            treeData[type].forEach((mWorld, idx) => {
                                const m = new THREE.Matrix4().copy(mWorld);
                                c.updateMatrix(); m.multiply(c.matrix);
                                iMesh.setMatrixAt(idx, m);
                            });
                        }
                    });
                }
            });

            toRemove.forEach(obj => { if (obj.parent) obj.parent.remove(obj); });
            console.log(`Optimization complete in ${(performance.now() - startTime).toFixed(2)}ms. Replaced ${toRemove.length} nodes.`);
        }

        /**
         * Creates a custom road with 3D thickness using THREE.BufferGeometry
         * @param {THREE.Scene} scene - The scene to add the road to
         * @param {Object} options - { points: [], width: 4, thickness: 0.5, segments: 128, style: 'dashed' }
         */

        // Create strait road with depth
        function createCustomRoad(scene, options) {
            const {
                points = [],
                width = 4,
                thickness = 0.01,
                segments = 128,
                style = 'dashed',
                position = { x: 0, y: 0, z: 0 },
                rotation = { x: 0, y: 0, z: 0 },
                color = null // Custom base color
            } = options;

            if (points.length < 2) return null;

            const curve = new THREE.CatmullRomCurve3(points);
            const curvePoints = curve.getPoints(segments);
            const tangent = new THREE.Vector3();

            const vertices = [];
            const indices = [];
            const uvs = [];

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const p = curvePoints[i];

                curve.getTangentAt(t, tangent);
                const normal = new THREE.Vector3(0, 1, 0);
                const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

                // Calculate 4 vertices per segment (Top-Left, Top-Right, Bottom-Left, Bottom-Right)
                const pTL = p.clone().add(binormal.clone().multiplyScalar(width / 2)).add(new THREE.Vector3(0, thickness, 0));
                const pTR = p.clone().add(binormal.clone().multiplyScalar(-width / 2)).add(new THREE.Vector3(0, thickness, 0));
                const pBL = p.clone().add(binormal.clone().multiplyScalar(width / 2));
                const pBR = p.clone().add(binormal.clone().multiplyScalar(-width / 2));

                // Push vertices: Top Face (0, 1), Left Side (2, 3), Right Side (4, 5)
                // We duplicate vertices to have sharp edges (different normals/UVs)

                // Top vertices
                vertices.push(pTL.x, pTL.y, pTL.z); // 0
                vertices.push(pTR.x, pTR.y, pTR.z); // 1
                uvs.push(0, t * (curve.getLength() / width));
                uvs.push(1, t * (curve.getLength() / width));

                // Left side vertices
                vertices.push(pTL.x, pTL.y, pTL.z); // 2
                vertices.push(pBL.x, pBL.y, pBL.z); // 3
                uvs.push(0, t * (curve.getLength() / thickness));
                uvs.push(0.1, t * (curve.getLength() / thickness)); // Using tiny bit of texture space for sides

                // Right side vertices
                vertices.push(pTR.x, pTR.y, pTR.z); // 4
                vertices.push(pBR.x, pBR.y, pBR.z); // 5
                uvs.push(0, t * (curve.getLength() / thickness));
                uvs.push(0.1, t * (curve.getLength() / thickness));

                if (i < segments) {
                    const base = i * 6;
                    // Top Face
                    indices.push(base, base + 6, base + 1);
                    indices.push(base + 1, base + 6, base + 7);
                    // Left Wall
                    indices.push(base + 2, base + 3, base + 8);
                    indices.push(base + 3, base + 9, base + 8);
                    // Right Wall
                    indices.push(base + 4, base + 10, base + 5);
                    indices.push(base + 5, base + 10, base + 11);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();

            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            if (style === 'lake') {
                // Water Base - Deep Ocean Blue
                const grad = ctx.createLinearGradient(0, 0, 0, 512);
                grad.addColorStop(0, '#002b4d');
                grad.addColorStop(0.5, '#005b96');
                grad.addColorStop(1, '#002b4d');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 128, 512);

                // Animated ripples/foam look (texture side)
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1.5;
                for (let i = 0; i < 60; i++) {
                    ctx.beginPath();
                    const x = Math.random() * 128;
                    const y = Math.random() * 512;
                    const w = 5 + Math.random() * 20;
                    ctx.moveTo(x - w, y);
                    ctx.bezierCurveTo(x - w / 2, y + 5, x + w / 2, y - 5, x + w, y);
                    ctx.stroke();
                }
            } else {
                // Asphalt Base
                ctx.fillStyle = color || '#222222';
                ctx.fillRect(0, 0, 128, 512);

                // Sidebar color for side walls (using a small strip of the texture)
                ctx.fillStyle = '#444444';
                ctx.fillRect(0, 0, 15, 512);

                // Noise/Grit for road
                for (let i = 0; i < 2000; i++) {
                    const x = 15 + Math.random() * 113;
                    const y = Math.random() * 512;
                    const gray = 20 + Math.random() * 30;
                    ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            if (style !== 'lake') {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                if (style === 'dashed') {
                    ctx.setLineDash([80, 100]);
                    ctx.beginPath(); ctx.moveTo(71, 0); ctx.lineTo(71, 512); ctx.stroke();
                } else if (style === 'double') {
                    ctx.beginPath();
                    ctx.moveTo(60, 0); ctx.lineTo(60, 512);
                    ctx.moveTo(68, 0); ctx.lineTo(68, 512);
                    ctx.stroke();
                } else if (style === 'solid') {
                    ctx.setLineDash([]);
                    ctx.beginPath(); ctx.moveTo(71, 0); ctx.lineTo(71, 512); ctx.stroke();
                }

                // Side Lines
                ctx.strokeStyle = 'rgba(255,255,255,1)';
                ctx.setLineDash([]);
                ctx.strokeRect(17, -10, 2, 532);
                ctx.strokeRect(124, -10, 2, 532);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;

            const material = (style === 'lake') ?
                new THREE.MeshStandardMaterial({
                    map: texture,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.8,
                    roughness: 0.2,
                    metalness: 0.3
                }) :
                new THREE.MeshBasicMaterial({
                    map: texture,
                    side: THREE.DoubleSide
                });

            const roadMesh = new THREE.Mesh(geometry, material);

            // Apply Position
            if (position) {
                roadMesh.position.set(position.x || 0, position.y || 0, position.z || 0);
            }

            // Apply Rotation
            if (rotation) {
                roadMesh.rotation.set(rotation.x || 0, rotation.y || 0, rotation.z || 0);
            }

            scene.add(roadMesh);
            return roadMesh;
        }

        function animateAgent(agent, time, speedFactor = 1.0) {
            const t = time * 0.001;
            const animSpeed = 4.0 + (speedFactor * 6.0); // Animation frequency scale with speed
            const cycle = Math.sin(t * animSpeed);

            // Movement amplitude adjusts with speed
            const footSwing = 0.3 + (speedFactor * 0.5);
            const armSwing = 0.2 + (speedFactor * 0.4);

            // Walking movement
            agentAnims.legL.rotation.x = cycle * footSwing;
            agentAnims.legR.rotation.x = -cycle * footSwing;
            agentAnims.armL.rotation.x = -cycle * armSwing;
            agentAnims.armR.rotation.x = cycle * armSwing;

            // Natural body bobbing and tilt
            const bobAmount = (walkingConfig.bobbing || 0.05) * (0.8 + speedFactor);
            agent.position.y = 0.5 + Math.abs(cycle) * bobAmount;

            // Dynamic body lean (forward based on speed)
            agentAnims.upperBody.rotation.x = 0.05 + (speedFactor * 0.15);
            agentAnims.upperBody.rotation.y = cycle * 0.08; // Shoulder swing
        }

        function resetAgentAnimation(time) {
            const t = time * 0.001;
            // Smoothly return to neutral
            agentAnims.legL.rotation.x *= 0.85;
            agentAnims.legR.rotation.x *= 0.85;
            agentAnims.armL.rotation.x *= 0.85;
            agentAnims.armR.rotation.x *= 0.85;
            agentAnims.upperBody.rotation.y *= 0.85;
            agentAnims.upperBody.rotation.x *= 0.85;

            // Subtle idle breathing & weight shift
            const breathe = Math.sin(t * 1.5) * 0.015;
            const sway = Math.cos(t * 0.8) * 0.01;

            agentAnims.upperBody.position.y = 0.95 + breathe; // Breathing height shift
            agentAnims.upperBody.rotation.z = sway; // Subtle sway

            agent.position.y += (0.5 - agent.position.y) * 0.2;
        }


        function sceneRender(time) {
            requestAnimationFrame(sceneRender);
            const t = time * 0.001;

            // Animate leaves
            animatedLeaves.forEach(leaf => {
                const wave = Math.sin(t * leaf.userData.speed + leaf.userData.phase) * 0.12;
                leaf.rotation.x = leaf.userData.originalRotation.x + wave;
            });

            // Only update controls if damping is enabled (performance)
            if (controls.enableDamping && !isWalkingMode) {
                controls.update();
                // Limit panning/movement area to city bounds
                controls.target.x = THREE.MathUtils.clamp(controls.target.x, CITY_BOUNDS.minX, CITY_BOUNDS.maxX);
                controls.target.z = THREE.MathUtils.clamp(controls.target.z, CITY_BOUNDS.minZ, CITY_BOUNDS.maxZ);
            }

            flagObj.animateFlag(time);

            // --- Fog Reveal Animation ---
            if (!fogRevealComplete) {
                const currentTime = time;

                if (fogRevealStartTime === null) {
                    fogRevealStartTime = currentTime;
                    // fogRevealStartTime = currentTime - 5000; // Start 5 seconds earlier for testing
                    initialCameraY = camera.position.y; // Store initial Y position
                }

                const elapsed = currentTime - fogRevealStartTime;
                const progress = Math.min(elapsed / fogRevealDuration, 1.0);

                // Improved easing function for ultra-smooth transition (ease-in-out-cubic)
                const easedProgress = progress < 0.5
                    ? 4 * progress * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2; // unchanged but clarified

                // Interpolate fog density with smooth curve
                // const currentDensity = initialFogDensity - (initialFogDensity - finalFogDensity) * (easedProgress + 0.020) ;
                const currentDensity = initialFogDensity - (initialFogDensity - finalFogDensity) * easedProgress;
                scene.fog.density = currentDensity; // Slight offset to avoid zero density

                // Cinematic Drone Descent: Start high and gracefully drop to ground level
                // Camera movement disabled during fog reveal as per user request
                // const finalCameraY = 30;
                // const descentProgress = Math.pow(easedProgress, 1.2); // Slower start, faster middle for impact
                // camera.position.y = initialCameraY - (initialCameraY - finalCameraY) * descentProgress;

                // Subtle camera X/Z drift during descent for realism
                camera.position.z = 500 - (400 * easedProgress);
                camera.position.x = 10 + Math.sin(easedProgress * Math.PI) * 20;

                if (progress >= 1.0) {
                    fogRevealComplete = true;
                    // Fog reveal complete
                    // Update shadows once after fog reveal (performance)
                    renderer.shadowMap.needsUpdate = true;
                }
            }

            // Update River animation

            // --- Lake Water Animation ---
            if (lakeObj) {
                // 1. Flowing Texture (optimized - only update offset)
                if (lakeObj.material.map) {
                    lakeObj.material.map.offset.y = -t * 0.08;
                    lakeObj.material.map.offset.x = Math.sin(t * 0.5) * 0.02;
                }

                // 2. Vertex Wave Effect (expensive - consider reducing frequency)
                const pos = lakeObj.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const mod6 = i % 6;
                    // Indices 0, 1, 2, 4 are top vertices
                    if (mod6 !== 3 && mod6 !== 5) {
                        const px = pos.getX(i);
                        const pz = pos.getZ(i);
                        // Multi-octave wave simulation
                        const wave = Math.sin(px * 0.04 + t * 2.0) * 1.5 +
                            Math.cos(pz * 0.04 + t * 1.5) * 1.5 +
                            Math.sin((px + pz) * 0.02 + t * 0.8) * 2.0;
                        pos.setY(i, 0.8 + wave); // 0.8 is baseline thickness
                    }
                }
                pos.needsUpdate = true;
                // Optional: compute normals for better lighting on waves
                // lakeObj.geometry.computeVertexNormals(); 
            }

            // Update River animation
            if (river) river.update(time);

            // --- Pool Water Animation ---
            poolWaterGeometries.forEach(geo => {
                if (geo.attributes.position && geo.attributes.normal) {
                    const pos = geo.attributes.position;
                    const norm = geo.attributes.normal;
                    for (let v = 0; v < pos.count; v++) {
                        if (norm.getY(v) > 0.5) {
                            const px = pos.getX(v);
                            const pz = pos.getZ(v);
                            const wave = Math.sin(px * 0.05 + t * 2.5) * 0.4 + Math.cos(pz * 0.05 + t * 2.0) * 0.4;
                            pos.setY(v, 4 + wave);
                        }
                    }
                    pos.needsUpdate = true;
                }
            });

            // Animate Sky
            if (isNight && stars) {
                stars.rotation.y += 0.0001; // Slow rotation of starfield
                stars.rotation.x += 0.00005;
                if (stars.material.uniforms) {
                    stars.material.uniforms.uTime.value = time * 0.001;
                }
                if (stars.userData.cloudGroup) {
                    stars.userData.cloudGroup.rotation.y += 0.00005;
                }
            }

            // Small river texture animation (optimized)
            if (sr_waterTexture) {
                sr_waterTexture.offset.y -= 0.00278; // 6-second flow cycle
            }

            // --- Enhanced Gaming Walking Mode Logic ---
            if (isWalkingMode && agent) {
                const isSprinting = keys.Shift;
                const targetSpeed = isSprinting ? walkingConfig.runSpeed : walkingConfig.baseSpeed;

                const inputDirection = new THREE.Vector3();
                const frontVector = new THREE.Vector3();
                const sideVector = new THREE.Vector3();

                camera.getWorldDirection(frontVector);
                frontVector.y = 0;
                frontVector.normalize();
                sideVector.copy(frontVector).applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2);

                const up = keys.w || keys.ArrowUp;
                const down = keys.s || keys.ArrowDown;
                const left = keys.a || keys.ArrowLeft;
                const right = keys.d || keys.ArrowRight;

                if (up) inputDirection.add(frontVector);
                if (down) inputDirection.sub(frontVector);
                if (left) inputDirection.add(sideVector);
                if (right) inputDirection.sub(sideVector);

                // --- Auto-detect View Mode based on Mouse Rotation ---
                if (cameraSystemConfig.autoSwitch && controls) {
                    // Check azimuthal angle to see if camera is in front or behind agent
                    // OrbitControls angle 0 is usually 'behind' if agent starts facing forward
                    const az = controls.getAzimuthalAngle();
                    const isFrontAngle = Math.abs(az) < Math.PI / 2; // Simple heuristic for front viewing

                    if (isFrontAngle && cameraSystemConfig.frontView) {
                        walkingCameraMode = 'front';
                    } else if (!isFrontAngle && cameraSystemConfig.behindView) {
                        walkingCameraMode = 'behind';
                    }
                }

                if (inputDirection.length() > 0) {
                    inputDirection.normalize();

                    // Character Rotation Smoothness
                    let targetRotation = Math.atan2(inputDirection.x, inputDirection.z);
                    if (walkingCameraMode === 'front') targetRotation += Math.PI;

                    let diff = targetRotation - agent.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;

                    // High interpolation for buttery smooth rotation
                    agent.rotation.y += diff * 0.12;

                    // Acceleration with smoothing
                    currentWalkingSpeed += (targetSpeed - currentWalkingSpeed) * 0.08;
                } else {
                    // Friction/Braking
                    currentWalkingSpeed *= (1 - (walkingConfig.friction || 0.1));
                    if (currentWalkingSpeed < 0.01) currentWalkingSpeed = 0;
                }

                // Apply velocity
                if (currentWalkingSpeed > 0) {
                    // Character always moves according to input, but faces mirror direction in front mode
                    const moveDir = inputDirection.clone();
                    agent.position.addScaledVector(moveDir, currentWalkingSpeed);

                    // Animation intensity
                    const speedRatio = currentWalkingSpeed / (walkingConfig.runSpeed || 1.2);
                    animateAgent(agent, time, speedRatio);
                } else {
                    resetAgentAnimation(time);
                }

                // Boundary clamping
                agent.position.x = THREE.MathUtils.clamp(agent.position.x, CITY_BOUNDS.minX, CITY_BOUNDS.maxX);
                agent.position.z = THREE.MathUtils.clamp(agent.position.z, CITY_BOUNDS.minZ, CITY_BOUNDS.maxZ);

                // --- Game Standard Camera Follow (Exact Speed Sync) ---
                const cameraOffset = new THREE.Vector3(0, 1.8, 0);
                const targetFocus = agent.position.clone().add(cameraOffset);
                const frameOffset = targetFocus.clone().sub(controls.target);

                camera.position.add(frameOffset);
                controls.target.copy(targetFocus);

                controls.update();
                agent.visible = true;
            }

            // --- Final Safety Check ---
            if (camera.position.y < 2.0) camera.position.y = 2.0;
            if (controls.target.y < 0) controls.target.y = 0;

            // --- Optimized Breathing Animation (No scene.traverse) ---
            for (let i = 0, l = breathingObjects.length; i < l; i++) {
                const child = breathingObjects[i];
                if (child.userData && child.userData.originalPos) {
                    child.position.x = child.userData.originalPos.x + Math.sin(t + child.id) * 0.15;
                    child.position.y = child.userData.originalPos.y + Math.cos(t * 0.8 + child.id) * 0.15;
                }
            }

            renderer.render(scene, camera)
        }

        // Center Flag
        function createFlag(scene, position = { x: 0, y: 0, z: 0 }) {
            const group = new THREE.Group();

            /* =========================
               Flag Pole
            ========================= */
            const poleGeometry = new THREE.CylinderGeometry(0.1, 0.1, 10, 16);
            const poleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const pole = new THREE.Mesh(poleGeometry, poleMaterial);

            pole.position.set(0, 5, 0);
            group.add(pole);

            /* =========================
               Create Text Canvas
            ========================= */
            const canvas = document.createElement("canvas");
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext("2d");

            // Background
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Logo from assets/images/bbl.png
            const logo = new Image();
            logo.src = 'assets/images/bbl.png';
            logo.onload = () => {
                const logoSize = 200;
                ctx.drawImage(logo, (canvas.width - logoSize) / 2, (canvas.height / 2) - logoSize + 20, logoSize, logoSize);

            // Text

            ctx.textAlign = "center";

            ctx.fillText("Bangla Bosoti Square", canvas.width / 2, canvas.height / 2 + 100);

            const flagMaterial = new THREE.MeshBasicMaterial({

               Wave Animation

                const pos = flag.geometry.attributes.position;

                for (let i = 0; i < pos.count; i++) {

                    pos.setZ(i, Math.sin(x * 2 + time * 0.005) * 0.2);
                }

                pos.needsUpdate = true;
            }

            return { group, animateFlag };
        }


        function createRoadGeometry(curve, width, segments) {
            const points = curve.getSpacedPoints(segments);
            const vertices = [];
            const uvs = [];
            const indices = [];

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const p = points[i];
                const tangent = curve.getTangentAt(t).normalize();
                const binormal = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 1, 0)).normalize();

                const pL = p.clone().add(binormal.clone().multiplyScalar(width / 2));
                const pR = p.clone().add(binormal.clone().multiplyScalar(-width / 2));

                vertices.push(pL.x, 0, pL.z, pR.x, 0, pR.z);

                const dist = t * curve.getLength();
                uvs.push(0, dist / 20, 1, dist / 20);

                if (i < segments) {
                    const idx = i * 2;
                    indices.push(idx, idx + 2, idx + 1, idx + 1, idx + 2, idx + 3);
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        function createMarkingsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 512, 1024);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 12;
            ctx.setLineDash([60, 60]);
            ctx.beginPath(); ctx.moveTo(256, 0); ctx.lineTo(256, 1024); ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 8;
            ctx.strokeRect(15, -10, 2, 1044);
            ctx.strokeRect(495, -10, 2, 1044);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.anisotropy = 4; // Reduced from 16 for better performance
            return texture;
        }

        /**
         * Creates a procedurally generated animated tree from tree2.html
         */
        function createAnimatedTree(position, rotation) {
            const treeGroup = new THREE.Group();
            treeGroup.position.copy(position);
            treeGroup.rotation.copy(rotation);
            // Normalized: height ~27.5. Scale to reach 0.3 world units (0.3 / 27.5 = 0.011)
            // (0.3 world units = 20 plot units when house scale is 0.015)
            treeGroup.scale.set(0.011, 0.011, 0.011);
            scene.add(treeGroup);

            // Reusing shared geometry and material cache for performance
            const barkMat = getSharedMaterial('animatedTreeBark', () => new THREE.MeshStandardMaterial({
                color: 0x2b1d0e,
                roughness: 0.9,
                metalness: 0.1
            }));

            const leafShape = new THREE.Shape();
            leafShape.moveTo(0, 0);
            leafShape.quadraticCurveTo(0.5, 0.5, 0, 1.2);
            leafShape.quadraticCurveTo(-0.5, 0.5, 0, 0);
            const leafGeo = getSharedGeometry('animatedTreeLeafGeo', () => new THREE.ShapeGeometry(leafShape));

            const leafColors = [0x2d4c1e, 0x3a5a2a, 0x4b6e32, 0x1e3a12];
            const leafMats = leafColors.map((c, i) => getSharedMaterial(`animatedTreeLeafMat${i}`, () => new THREE.MeshStandardMaterial({
                color: c,
                side: THREE.DoubleSide,
                roughness: 0.8
            })));

            // Recursive growth scoped to this tree instance
            function growBranch(startPos, direction, length, thickness, depth) {
                if (depth > 5) return; // Reduced depth from 7 to 5 for better performance

                const endPos = new THREE.Vector3().addVectors(startPos, direction.clone().multiplyScalar(length));
                const midpoint = new THREE.Vector3().addVectors(startPos, endPos).multiplyScalar(0.5);

                const branchGeo = getSharedGeometry('animatedTreeBranch', () => new THREE.CylinderGeometry(0.7, 1.0, 1, 5));
                const branch = new THREE.Mesh(branchGeo, barkMat);

                branch.position.copy(midpoint);
                branch.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
                branch.scale.set(thickness, length, thickness);
                branch.castShadow = true;
                branch.receiveShadow = true;
                treeGroup.add(branch);

                // Add leaves much earlier in the tree and in huge quantities
                if (depth > 2) {
                    const leafCount = Math.floor(Math.random() * 4) + 3; // Spawn 3 to 6 leaves per branch
                    for (let i = 0; i < leafCount; i++) {
                        const leafMat = leafMats[Math.floor(Math.random() * leafMats.length)];
                        const leaf = new THREE.Mesh(leafGeo, leafMat);

                        // Spread them out more so they look like a full canopy
                        const spreadX = (Math.random() - 0.5) * (length * 1.5);
                        const spreadY = (Math.random() - 0.5) * (length * 1.5);
                        const spreadZ = (Math.random() - 0.5) * (length * 1.5);

                        leaf.position.copy(endPos).add(new THREE.Vector3(spreadX, spreadY, spreadZ));

                        const s = 0.5 + Math.random() * 0.5; // Larger leaves for more fullness
                        leaf.scale.set(s, s, s);
                        leaf.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                        leaf.castShadow = true;

                        // Wind metadata
                        leaf.userData.phase = Math.random() * Math.PI * 2;
                        leaf.userData.speed = 0.8 + Math.random() * 1.2;
                        leaf.userData.originalRotation = leaf.rotation.clone();

                        treeGroup.add(leaf);
                        animatedLeaves.push(leaf);
                    }
                }

                const numBranches = (depth === 0) ? 1 : (Math.random() > 0.8 ? 3 : 2);
                for (let i = 0; i < numBranches; i++) {
                    const nextDir = direction.clone();
                    const angle = 0.3 + Math.random() * 0.4;
                    const randomAxis = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
                    nextDir.applyAxisAngle(randomAxis, angle);

                    growBranch(
                        endPos,
                        nextDir,
                        length * (0.7 + Math.random() * 0.2),
                        thickness * 0.7,
                        depth + 1
                    );
                }
            }

            // Start growth
            growBranch(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1, 0), 5.5, 0.9, 0);
        }

        function createGTree(scale = 1.0) {
            const treeGroup = new THREE.Group();
            treeGroup.name = 'gtree';
            // Internal height for depth 2: Seg(10) + Child(7.5) + GChild(5.625) = 23.125
            // Normalize to 1.0: 1 / 23.125 = 0.043
            const internalScale = 0.043;
            treeGroup.scale.set(scale * internalScale, scale * internalScale, scale * internalScale);

            const barkMaterial = getSharedMaterial('gtreeBark', () => new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.9 }));
            const leafMaterial = getSharedMaterial('gtreeLeaf', () => new THREE.MeshStandardMaterial({
                color: 0x22c55e,
                emissive: 0x064e3b,
                transparent: true,
                opacity: 0.85
            }));

            function createFoliageBunch(radius) {
                const bunchGroup = new THREE.Group();
                // Match gtree.html proportions: radius-based sub-branches
                const subBranchGeo = getSharedGeometry(`gtreeSubBranch_${radius.toFixed(2)}`, () => new THREE.CylinderGeometry(radius * 0.5, radius * 0.8, radius * 8, 6));
                const subBranch = new THREE.Mesh(subBranchGeo, barkMaterial);
                subBranch.position.y = radius * 4;
                bunchGroup.add(subBranch);

                const leafDensity = 1;
                for (let i = 0; i < leafDensity; i++) {
                    const leafSize = radius * (10 + Math.random() * 5); // Slimmer bushy look
                    const leafGeo = getSharedGeometry('gtreeLeafSphere', () => new THREE.SphereGeometry(1, 7, 7));
                    const leaf = new THREE.Mesh(leafGeo, leafMaterial);
                    leaf.scale.setScalar(leafSize);

                    // _-- GTREE LEAF SET Y POSITION __
                    leaf.position.set(
                        (Math.random() - 0.5) * radius * 12,
                        10,
                        (Math.random() - 0.5) * radius * 12
                    );

                    // Store for animation
                    leaf.userData.originalPos = leaf.position.clone();
                    breathingObjects.push(leaf);
                    bunchGroup.add(leaf);
                }
                return bunchGroup;
            }

            function buildMainStructure(parentGroup, height, radius, depth) {
                const geometry = getSharedGeometry(`gtreeBranchSeg_${depth}`, () => new THREE.CylinderGeometry(0.7, 1.0, 10, 6)); // 6 instead of 8
                const segment = new THREE.Mesh(geometry, barkMaterial);
                segment.scale.set(radius, 1, radius);
                segment.castShadow = true;
                segment.position.y = height / 2;
                parentGroup.add(segment);

                if (depth === 0) {
                    const bunch = createFoliageBunch(radius);
                    bunch.position.y = height;
                    parentGroup.add(bunch);
                } else {
                    const numChildren = 3; // Fuller tree
                    for (let i = 0; i < numChildren; i++) {
                        const nextGroup = new THREE.Group();
                        nextGroup.position.y = height;
                        const spread = 0.8;
                        nextGroup.rotation.x = (Math.random() - 0.5) * spread;
                        nextGroup.rotation.z = (Math.random() - 0.5) * spread;
                        nextGroup.rotation.y = (Math.random() * Math.PI * 2);
                        parentGroup.add(nextGroup);
                        buildMainStructure(nextGroup, height * 0.75, radius * 0.7, depth - 1);
                    }
                }
            }

            function buildRoots(baseRadius, treeGroup) {
                const numRoots = 3; // Reduced from 4
                const rootGeo = getSharedGeometry('gtreeRootSeg', () => new THREE.CylinderGeometry(0.5, 0.8, 10, 5));
                for (let i = 0; i < numRoots; i++) {
                    const rootAngle = (i / numRoots) * Math.PI * 2;
                    const rootPart = new THREE.Mesh(rootGeo, barkMaterial);
                    rootPart.scale.set(baseRadius, 0.4, baseRadius); // Short stubby roots

                    const nextX = Math.cos(rootAngle) * 4;
                    const nextZ = Math.sin(rootAngle) * 4;
                    const nextY = -1;

                    rootPart.position.set(nextX / 2, 0, nextZ / 2);
                    rootPart.lookAt(nextX, nextY, nextZ);
                    rootPart.rotateX(Math.PI / 2);
                    treeGroup.add(rootPart);
                }
            }

            buildMainStructure(treeGroup, 10, 0.7, 2); // Depth 2 for performance & shorter look
            buildRoots(0.7, treeGroup);

            return treeGroup;
        }

            mesh.rotation.set(rx, ry, rz);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            parent.add(mesh);
            return mesh;
        }

        function srv2_createWindow(parent, config) {
            const { w = 1.5, h = 1.5, borderT = 0.1 } = config;

            const glass = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.5 }));
            group.add(glass);
            const borderMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const createPart = (bw, bh, px, py) => {
                const p = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 0.15), borderMat);
                p.position.set(px, py, 0);
                group.add(p);
            };
            createPart(w + borderT * 2, borderT, 0, h / 2 + borderT / 2);
            createPart(w + borderT * 2, borderT, 0, -h / 2 - borderT / 2);
            createPart(borderT, h, -w / 2 - borderT / 2, 0);
            createPart(borderT, h, w / 2 + borderT / 2, 0);

            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createDoor(parent, config) {
            const { w = 1.2, h = 2.2, borderT = 0.15, isOpen = false } = config;
            const group = new THREE.Group();
            const doorGroup = new THREE.Group();
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x4d2a1a });
            const doorBody = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.1), doorMat);
            doorBody.position.set(w / 2, h / 2, 0);
            doorGroup.add(doorBody);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
            const handle = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), handleMat);
            handle.position.set(w - 0.2, h / 2, 0.1);
            doorGroup.add(handle);
            
            const handleBack = handle.clone();
            handleBack.position.z = -0.1;
            doorGroup.add(handleBack);

            doorGroup.position.x = -w / 2;
            if (isOpen) doorGroup.rotation.y = -Math.PI / 5.5;
            group.add(doorGroup);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const createFrame = (fw, fh, px, py) => {
                const f = new THREE.Mesh(new THREE.BoxGeometry(fw, fh, 0.2), frameMat);
                f.position.set(px, py, 0);
                group.add(f);
            };
            createFrame(w + borderT * 2, borderT, 0, h + borderT / 2);
            createFrame(borderT, h + borderT, -w / 2 - borderT / 2, h / 2);
            createFrame(borderT, h + borderT, w / 2 + borderT / 2, h / 2);
            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createBeamSet(parent, config) {
            const { w = 0.3, h = 4, dist = 5, isCircle = false, count = 4 } = config;
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
            let positions = [];
            if (count === 4) {
                positions = [{ px: -dist / 2, pz: -dist / 2 }, { px: dist / 2, pz: -dist / 2 }, { px: -dist / 2, pz: dist / 2 }, { px: dist / 2, pz: dist / 2 }];
            } else {
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    positions.push({ px: Math.cos(angle) * (dist / 2), pz: Math.sin(angle) * (dist / 2) });
                }
            }
            positions.forEach(pos => {
                const geo = isCircle ? new THREE.CylinderGeometry(w / 2, w / 2, h, 16) : new THREE.BoxGeometry(w, h, w);
                const beam = new THREE.Mesh(geo, mat);
                beam.position.set(pos.px, h / 2, pos.pz);
                beam.castShadow = true;
                group.add(beam);
            });
            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createBalcony(parent, config) {
            const { w = 4, d = 1.5, hasLeftRail = true, hasRightRail = true } = config;

            const woodMat = new THREE.MeshStandardMaterial({ color: 0x5d4037 });

                bar.position.set((-w / 2) + (i * w / frontBarCount), 0.5, d / 2);

            const rail = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, 0.08), woodMat);
            rail.position.set(0, 1, d / 2);
            group.add(rail);
            if (hasLeftRail) {
                const sideBarCount = Math.ceil(d * 3);
                for (let i = 0; i <= sideBarCount; i++) {
                    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.05), woodMat);
                    bar.position.set(-w / 2, 0.5, (-d / 2) + (i * d / sideBarCount));
                    group.add(bar);

                const sideRail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, d), woodMat);
                sideRail.position.set(-w / 2, 1, 0);
                group.add(sideRail);

            if (hasRightRail) {
                const sideBarCount = Math.ceil(d * 3);
                for (let i = 0; i <= sideBarCount; i++) {
                    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.05), woodMat);
                    bar.position.set(w / 2, 0.5, (-d / 2) + (i * d / sideBarCount));
                    group.add(bar);
                }
                const sideRail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, d), woodMat);
                sideRail.position.set(w / 2, 1, 0);
                group.add(sideRail);

        function srv2_createRoof(parent, config) {

            if (style === 'pitched') {
                const createS = (rz, ox) => {
                    const s = new THREE.Group();
                    const b = new THREE.Mesh(new THREE.BoxGeometry(w / 2 + 0.5, 0.1, d), s2RoofMat);
                    s.add(b);
                    for (let i = 0; i < 20; i++) {
                        const r = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, d), s2RoofMat);
                        r.position.set((-w / 4) + (i * w / 38), 0.05, 0);
                        s.add(r);
                    }
                    s.rotation.z = rz;
                    s.position.x = ox;
                    return s;
                };
                group.add(createS(Math.PI / 6, -w / 4));
                group.add(createS(-Math.PI / 6, w / 4));
            } else {
                group.add(new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, d), s2RoofMat));
            }
            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createGable(parent, config) {
            const { w = 6, h = 1.5, t = 0.2, color = 0xeee8aa } = config;
            const group = new THREE.Group();
            const shape = new THREE.Shape();
            shape.moveTo(-w / 2, 0);
            shape.lineTo(w / 2, 0);
            shape.lineTo(0, h);
            shape.lineTo(-w / 2, 0);
            const geometry = new THREE.ExtrudeGeometry(shape, { depth: t, bevelEnabled: false });
            const material = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.geometry.translate(0, 0, -t / 2);
            group.add(mesh);
            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createStairs(parent, config) {
            const { steps = 3, w = 1.5, stepH = 0.17, stepD = 0.4, color = 0xeeeeee } = config;
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const railMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.1 });

            for (let i = 0; i < steps; i++) {
                const step = new THREE.Mesh(new THREE.BoxGeometry(w, stepH, stepD), mat);
                step.position.set(0, (i * stepH) + stepH / 2, i * stepD);
                step.castShadow = true;
                step.receiveShadow = true;
                group.add(step);
            }

            // Modern Rail Handles (Both Sides)
            const railHeight = 0.8;
            const railT = 0.03;

            [-1, 1].forEach(side => {
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3((w / 2 - 0.05) * side, railHeight, -stepD / 2),
                    new THREE.Vector3((w / 2 - 0.05) * side, (steps - 1) * stepH + railHeight, (steps - 1) * stepD + stepD / 2)
                ]);
                const railGeo = new THREE.TubeGeometry(curve, 20, railT, 8, false);
                const rail = new THREE.Mesh(railGeo, railMat);
                group.add(rail);

                // Posts
                for (let i = 0; i < steps; i += 2) {
                    const h = railHeight + (i * stepH);
                    const post = new THREE.Mesh(new THREE.CylinderGeometry(railT, railT, h), railMat);
                    post.position.set((w / 2 - 0.05) * side, h / 2, i * stepD);
                    group.add(post);
                }
            });

            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createWallVine(parent, config) {
            const { h = 2, w = 1.5, depth = 0.3, leafColor = 0x2d5a27, stemColor = 0x4d2a1a } = config;
            const group = new THREE.Group();
            
            const leafMat = new THREE.MeshStandardMaterial({ color: leafColor, roughness: 0.8 });
            const stemMat = new THREE.MeshStandardMaterial({ color: stemColor, roughness: 0.9 });

            const vineCount = 6;
            for (let i = 0; i < vineCount; i++) {
                const startX = (Math.random() - 0.5) * w;
                const startZ = (Math.random() - 0.5) * depth;
                
                const points = [];
                const segments = 8;
                for (let j = 0; j <= segments; j++) {
                    const ratio = j / segments;
                    points.push(new THREE.Vector3(
                        startX + Math.sin(ratio * Math.PI * 2 + i) * 0.2,
                        -(ratio * h),
                        startZ + Math.cos(ratio * Math.PI * 2 + i) * 0.2
                    ));
                }
                
                const curve = new THREE.CatmullRomCurve3(points);
                const stemGeo = new THREE.TubeGeometry(curve, 20, 0.02, 8, false);
                const stem = new THREE.Mesh(stemGeo, stemMat);
                group.add(stem);

                const leafDensity = 15;
                for (let k = 0; k < leafDensity; k++) {
                    const t = k / (leafDensity - 1);
                    const pos = curve.getPoint(t);
                    const tangent = curve.getTangent(t);
                    
                    const leafSize = 0.15 + Math.random() * 0.1;
                    const leafThickness = 0.02;
                    const leafGeo = new THREE.CylinderGeometry(leafSize, leafSize, leafThickness, 3);
                    const leaf = new THREE.Mesh(leafGeo, leafMat);
                    
                    leaf.position.copy(pos);
                    leaf.lookAt(pos.clone().add(tangent));
                    leaf.rotateX(Math.PI / 2);
                    leaf.rotateZ(Math.random() * Math.PI);
                    
                    group.add(leaf);
                }
            }

            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createWoodGril(parent, config) {
            const { w = 4, h = 1.1, spacing = 0.15, thickness = 0.04, slatW = 0.04, color = 0x5d4037, startPost = true, midPost = false, endPost = false } = config;
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6, metalness: 0.3 });
            const railH = 0.05;
            const postW = 0.18;
            const railGeo = new THREE.BoxGeometry(w, railH, thickness * 1.5);
            const topRail = new THREE.Mesh(railGeo, mat);
            topRail.position.y = h - railH / 2;
            group.add(topRail);
            const bottomRail = new THREE.Mesh(railGeo, mat);
            bottomRail.position.y = railH / 2 + 0.05;
            group.add(bottomRail);
            const picketH = h - railH * 2 - 0.05;
            const count = Math.floor(w / (slatW + spacing));
            const startX = -w / 2 + (w - (count * (slatW + spacing))) / 2 + slatW / 2;
            for (let i = 0; i < count; i++) {
                const px = startX + i * (slatW + spacing);
                if (midPost && Math.abs(px) < postW / 2) continue;
                const picket = new THREE.Mesh(new THREE.BoxGeometry(slatW, picketH, thickness), mat);
                picket.position.set(px, h / 2 + 0.025, 0);
                group.add(picket);
            }
            const addPost = (px) => {
                const postH = h + 0.1;
                const postRect = new THREE.Mesh(new THREE.BoxGeometry(postW, postH, postW), mat);
                postRect.position.set(px, postH / 2, 0);
                group.add(postRect);
                const cap = new THREE.Mesh(new THREE.BoxGeometry(postW * 1.3, 0.05, postW * 1.3), mat);
                cap.position.set(px, postH + 0.02, 0);
                group.add(cap);
                const base = new THREE.Mesh(new THREE.BoxGeometry(postW * 1.3, 0.08, postW * 1.3), mat);
                base.position.set(px, 0.04, 0);
                group.add(base);
            };
            if (startPost) addPost(-w / 2 - postW / 2);
            if (midPost) addPost(0);
            if (endPost) addPost(w / 2 + postW / 2);
            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createBed(parent, config) {
            const { w = 2, d = 2.5, h = 0.6 } = config;
            const group = new THREE.Group();
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, d), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
            frame.position.y = 0.2;
            group.add(frame);
            const mattress = new THREE.Mesh(new THREE.BoxGeometry(w - 0.1, 0.3, d - 0.1), new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
            mattress.position.y = 0.45;
            group.add(mattress);
            const pillowGeo = new THREE.BoxGeometry(w / 2.5, 0.1, 0.6);
            const pillowMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const p1 = new THREE.Mesh(pillowGeo, pillowMat);
            p1.position.set(-w / 4, 0.6, -d / 2 + 0.5);
            group.add(p1);
            const p2 = p1.clone();
            p2.position.x = w / 4;
            group.add(p2);
            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createTable(parent, config) {
            const { w = 1.2, d = 0.8, h = 0.75 } = config;
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x4d2a1a });
            const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, d), mat);
            top.position.y = h;
            group.add(top);
            const legGeo = new THREE.BoxGeometry(0.08, h, 0.08);
            const createLeg = (lx, lz) => {
                const leg = new THREE.Mesh(legGeo, mat);
                leg.position.set(lx, h / 2, lz);
                group.add(leg);
            };
            createLeg(-w / 2 + 0.1, -d / 2 + 0.1);
            createLeg(w / 2 - 0.1, -d / 2 + 0.1);
            createLeg(-w / 2 + 0.1, d / 2 - 0.1);
            createLeg(w / 2 - 0.1, d / 2 - 0.1);
            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createChair(parent, config) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x4d2a1a });
            const seat = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.5), mat);
            seat.position.y = 0.45;
            group.add(seat);
            const back = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.05), mat);
            back.position.set(0, 0.75, -0.22);
            group.add(back);
            const legGeo = new THREE.BoxGeometry(0.05, 0.45, 0.05);
            for (let x = -1; x <= 1; x += 2) {
                for (let z = -1; z <= 1; z += 2) {
                    const leg = new THREE.Mesh(legGeo, mat);
                    leg.position.set(x * 0.2, 0.225, z * 0.2);
                    group.add(leg);
                }
            }
            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createTV(parent, config) {
            const { w = 1.2, h = 0.7 } = config;
            const group = new THREE.Group();
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            group.add(frame);
            const screen = new THREE.Mesh(new THREE.BoxGeometry(w * 0.95, h * 0.9, 0.01), new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0x112233, roughness: 0 }));
            screen.position.z = 0.03;
            group.add(screen);
            const stand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.3), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            stand.position.y = -h / 2 - 0.05;
            group.add(stand);
            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createLight(parent, config) {
            const group = new THREE.Group();
            const bulbGeo = new THREE.SphereGeometry(0.1, 16, 16);
            const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffaa });
            const bulb = new THREE.Mesh(bulbGeo, bulbMat);
            group.add(bulb);
            const pLight = new THREE.PointLight(0xffffaa, 1.2, 10);
            pLight.position.set(0, -0.2, 0);
            pLight.castShadow = true;
            group.add(pLight);
            return srv2_finalizeMesh(group, parent, config);
        }

        function srv2_createPergola(parent, config) {
            const { w = 4, d = 4, spacing = 0.25, slatW = 0.08, thickness = 0.04, color = 0x5d4037 } = config;
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color });

            // Main Slats (Top)
            const count = Math.floor(d / (slatW + spacing));
            for (let i = 0; i <= count; i++) {
                const slat = new THREE.Mesh(new THREE.BoxGeometry(w, thickness, slatW), mat);
                slat.position.z = -d / 2 + i * (slatW + spacing);
                group.add(slat);
            }

            // Supporting Cross Beams (Bottom)
            const beamCount = 3;
            for (let i = 0; i < beamCount; i++) {
                const beam = new THREE.Mesh(new THREE.BoxGeometry(slatW * 1.5, thickness * 2, d), mat);
                beam.position.x = -w / 2 + (i * w / (beamCount - 1));
                beam.position.y = -thickness;
                group.add(beam);
            }

            return srv2_finalizeMesh(group, parent, config);
        }

        function createFancyBuilding(parent, hScale = 1) {
            const bGrp = new THREE.Group();
            const finalScale = 13 * hScale;
            bGrp.scale.set(finalScale, finalScale, finalScale);
            bGrp.position.y = 0.1;
            parent.add(bGrp);

            const mergeRegistry = new Map();
            const collect = (mesh) => {
                if (!mesh.isMesh) return;
                const mat = mesh.material;
                // Unique key for material to group geometries
                const mKey = mat.uuid;
                if (!mergeRegistry.has(mKey)) mergeRegistry.set(mKey, { mat: mat, geos: [] });
                
                const g = mesh.geometry.clone();
                // CRITICAL: Use matrixWorld to get correct transform for nested group parts
                g.applyMatrix4(mesh.matrixWorld);
                mergeRegistry.get(mKey).geos.push(g);
            };

            // Use a temporary group to build the structure, then merge parts
            const tempParent = new THREE.Group();
            
            srv2_createBeamSet(tempParent, { dist: 6, h: 8, w: 0.4 });
            srv2_createBeamSet(tempParent, { x: -1.5, y: 0, z: -7.2, dist: 3, h: 8, w: 0.4, count: 2 });
            srv2_createBeamSet(tempParent, { x: 0, y: 0, z: -7.2, dist: 6, h: 4, w: 0.4, count: 1, isCircle: false });
            
            srv2_createFloor(tempParent, { x: 0, z: -2, y: 0, w: 11, d: 6.5, color: 0xfcf286, ry: Math.PI / 2 });
            srv2_createWall(tempParent, { x: 3, z: 0, w: 6, h: 4, ry: Math.PI / 2, color: 0xeee8aa });
            srv2_createWall(tempParent, { x: 0, y: 0, z: -3, w: 6, h: 4, color: 0xeee8aa });
            srv2_createWall(tempParent, { x: -3, z: 0, w: 6, h: 4, ry: Math.PI / 2, color: 0xeee8aa });
            srv2_createWall(tempParent, { x: 0, z: 3, w: 6, h: 4, color: 0xeee8aa });
            srv2_createDoor(tempParent, { x: 3.2, y: .5, z: 0, w: 1.2, h: 2.2, ry: Math.PI / 2, isOpen: false });

            srv2_createWall(tempParent, { x: 3, z: 0, y: 4, w: 6, h: 4, ry: Math.PI / 2, color: 0xeee8aa });
            srv2_createWall(tempParent, { x: 0, y: 4, z: -3, w: 6, h: 4, color: 0xeee8aa });
            srv2_createWall(tempParent, { x: -3, z: -2, y: 4, w: 10, h: 4, ry: Math.PI / 2, color: 0xeee8aa });
            srv2_createWall(tempParent, { x: 0, z: 3, y: 4, w: 6, h: 4, color: 0xeee8aa });
            srv2_createWall(tempParent, { x: -1.5, z: -7.2, y: 4, w: 3, h: 4, color: 0xeee8aa });
            srv2_createWall(tempParent, { x: 0, z: -5.2, y: 4, w: 4.5, h: 4, ry: Math.PI / 2, color: 0xeee8aa });
            srv2_createFloor(tempParent, { x: 0, y: 4, z: -2, w: 11, d: 6.5, color: 0xfcf286, ry: Math.PI / 2 });
            srv2_createDoor(tempParent, { x: 3.2, y: 4.3, z: 0, w: 1.2, h: 2.2, ry: Math.PI / 2, isOpen: true });
            srv2_createDoor(tempParent, { x: 0.2, y: 4.3, z: -5.2, w: 1.2, h: 2.2, ry: Math.PI / 2, isOpen: false });

            // Furniture
            srv2_createBed(tempParent, { x: -1.5, y: 4, z: -1.5, w: 2, d: 2.5 });
            srv2_createTable(tempParent, { x: 1.5, y: 4, z: -6.5, w: 1, d: 0.8 });
            srv2_createChair(tempParent, { x: 1.5, y: 4, z: -6.0, ry: Math.PI });
            srv2_createTV(tempParent, { x: -1.5, y: 4.8, z: 2, ry: Math.PI });
            srv2_createLight(tempParent, { x: 0, y: 7.8, z: 0 });

            srv2_createFloor(tempParent, { x: 0, y: 8, z: 0, w: 6, d: 6.5, color: 0xfcf286, ry: Math.PI / 2 });
            srv2_createFloor(tempParent, { x: -1.5, y: 8, z: -5.2, w: 4.5, d: 3.5, color: 0xfcf286, ry: Math.PI / 2 });
            
            srv2_createStairs(tempParent, { x: 4.2, z: 0, y: 0, ry: -Math.PI / 2, w: 1.8, steps: 3 });
            srv2_createWindow(tempParent, { x: 1.0, y: 6, z: 3.3, w: 2, h: 1.5 });
            srv2_createWindow(tempParent, { x: 1.0, y: 2, z: 3.3, w: 2, h: 1.5 });
            srv2_createBalcony(tempParent, { x: 3.4, y: 4.2, z: 0, w: 3.5, ry: Math.PI / 2 });
            srv2_createRoof(tempParent, { x: -0, z: 0, y: 9, w: 6.4, d: 7.2, ry: Math.PI / 2, style: 'pitched' });
            srv2_createGable(tempParent, { x: 3.3, y: 8.1, z: 0, w: 6, h: 1.7, ry: Math.PI / 2 });
            srv2_createGable(tempParent, { x: -3.3, y: 8.1, z: 0, w: 6, h: 1.7, ry: Math.PI / 2 });

            srv2_createRoof(tempParent, { x: -1.5, z: -4.3, y: 8.7, w: 3.6, d: 6.2, ry: Math.PI / 1, style: 'pitched' });
            srv2_createGable(tempParent, { x: -1.5, y: 8.15, z: -1.5, w: 3.1, h: 0.9 });
            srv2_createGable(tempParent, { x: -1.5, y: 8.15, z: -7.2, w: 3.1, h: 0.9 });

            srv2_createWallVine(tempParent, { x: 3.5, y: 8.5, z: 2.4, h: 7, w: 1.0, ry: Math.PI / 2 });
            srv2_createWoodGril(tempParent, { x: 3.1, y: 4.15, z: -5.4, w: 3.7, h: 1.2, ry: -Math.PI / 2, startPost: true, midPost: true, endPost: true });
            srv2_createWoodGril(tempParent, { x: 1.9, y: 4.15, z: -7.35, w: 2.6, h: 1.2, startPost: true, midPost: true, endPost: false });
            srv2_createPergola(tempParent, { x: 1.5, y: 7.5, z: -5.2, w: 2.6, d: 4, color: 0x5d4037 });

            // Final optimization: Traverse and merge geometries by material
            tempParent.updateMatrixWorld(true);
            tempParent.traverse(collect);

            mergeRegistry.forEach(group => {
                if (group.geos.length > 0) {
                    const mergedGeo = THREE.BufferGeometryUtils.mergeBufferGeometries(group.geos);
                    const mesh = new THREE.Mesh(mergedGeo, group.mat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.matrixAutoUpdate = false;
                    bGrp.add(mesh);
                }
            });
        }

        function createHouse(id, plotW = 500, plotD = 600, skipWall = null, hasPool = false, carCount = 0, hasPlayground = false, hDepth = 280, hWidth = 220, hasWing = true, hFloorH = 100, houseOX = 0, houseOZ = 0, poolOX = 0, poolOZ = 0, carOX = 0, carOZ = 0, playOX = 0, playOZ = 0, carW = 80, carL = 160, innerGapScale = 1, isTerrace = false, hasCarParking = true, houseDesign = 'standard', hScale = 1, hRotate = 0) {
            const house = new THREE.Group();
            house.name = 'house';
            const igScaleRaw = innerGapScale;
            const igx = (typeof igScaleRaw === 'object') ? (igScaleRaw.x !== undefined ? igScaleRaw.x : 1) : igScaleRaw;
            const igy = (typeof igScaleRaw === 'object') ? (igScaleRaw.y !== undefined ? igScaleRaw.y : 1) : igScaleRaw;

            const CONFIG = { houseWidth: hWidth, houseDepth: hDepth, wingLen: Math.max(260, hWidth * 0.8), floorH: hFloorH, wingW: Math.max(100, hWidth * 0.45), roofH: 80 };
            const { houseWidth, houseDepth, wingLen, floorH, wingW, roofH } = CONFIG;
            const wallH = 95; const wallT = 10; const gateW = 160;

            const bodyMat = getSharedMaterial('houseBody', () => new THREE.MeshStandardMaterial({ color: 0xe8e4d9, roughness: 0.8 }));
            const hRoofMat = getSharedMaterial('houseRoof', () => new THREE.MeshStandardMaterial({ color: 0xC47460, roughness: 0.7 }));
            const winMat = getSharedMaterial('houseWin', () => new THREE.MeshStandardMaterial({ color: 0xadd8e6, emissive: 0x111111 }));
            const wallMat = getSharedMaterial('houseWall', () => new THREE.MeshBasicMaterial({ color: 0xeeeeee }));
            const gateMat = getSharedMaterial('houseGate', () => new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.3 }));
            const glassMat = getSharedMaterial('houseGlass', () => new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.5 }));
            const beamMat = getSharedMaterial('houseBeam', () => new THREE.MeshStandardMaterial({ color: 0xFAF9F6, roughness: 0.5 }));

            // --- Merged Geometries ---
            const wallGeos = [];
            const gateGeos = [];

            // Walls
            const bwG = new THREE.BoxGeometry(plotW, wallH, wallT); bwG.translate(0, wallH / 2, plotD / 2 - wallT / 2); wallGeos.push(bwG);
            const sideWallG = new THREE.BoxGeometry(wallT, wallH, plotD);
            if (skipWall !== 'left') { const lw = sideWallG.clone(); lw.translate(-plotW / 2 + wallT / 2, wallH / 2, 0); wallGeos.push(lw); }
            if (skipWall !== 'right') { const rw = sideWallG.clone(); rw.translate(plotW / 2 - wallT / 2, wallH / 2, 0); wallGeos.push(rw); }

            const frontSegW = (plotW - gateW) / 2;
            const frontWallG = new THREE.BoxGeometry(frontSegW, wallH, wallT);
            const fwL = frontWallG.clone(); fwL.translate(-plotW / 2 + frontSegW / 2, wallH / 2, -plotD / 2 + wallT / 2); wallGeos.push(fwL);
            const fwR = frontWallG.clone(); fwR.translate(plotW / 2 - frontSegW / 2, wallH / 2, -plotD / 2 + wallT / 2); wallGeos.push(fwR);

            // Concrete/Beam elements (Pillars and Top Beams) - Off-white
            const concreteGeos = [];

            // Gate Pillars
            const pillarG = new THREE.BoxGeometry(28, wallH + 30, 28);
            const pL = pillarG.clone(); pL.translate(-gateW / 2, (wallH + 30) / 2, -plotD / 2 + wallT / 2); concreteGeos.push(pL);
            const pR = pillarG.clone(); pR.translate(gateW / 2, (wallH + 30) / 2, -plotD / 2 + wallT / 2); concreteGeos.push(pR);

            // Horizontal Gate Beam (Top)
            const gBeamG = new THREE.BoxGeometry(gateW + 40, 12, 32);
            gBeamG.translate(0, wallH + 30 + 6, -plotD / 2 + wallT / 2);
            concreteGeos.push(gBeamG);

            // Stylish Pillar Globes (Top of pillars)
            const capG = new THREE.SphereGeometry(16, 16, 16);
            const cL = capG.clone(); cL.translate(-gateW / 2, wallH + 30 + 12 + 10, -plotD / 2 + wallT / 2); concreteGeos.push(cL);
            const cR = capG.clone(); cR.translate(gateW / 2, wallH + 30 + 12 + 10, -plotD / 2 + wallT / 2); concreteGeos.push(cR);

            // Vertical Gate Iron Bars - Arched top with spearheads
            for (let ax = -gateW / 2 + 12; ax <= gateW / 2 - 12; ax += 12) {
                const xNorm = ax / (gateW / 2 - 12);
                const archH = 20 * (1 - xNorm * xNorm); // Parabolic arch

        // Helper function to dispose of geometries and materials
        function disposeObject(obj) {
            if (obj.geometry) {
                obj.geometry.dispose();
            }
            if (obj.material) {
                if (Array.isArray(obj.material)) {
                    obj.material.forEach(material => material.dispose());
                } else {
                    obj.material.dispose();
                }
            }
            if (obj.children) {
                obj.children.forEach(child => disposeObject(child));
            }
        }

        // --- Small River (Lake) Helper Functions ---
        // Create a procedural sandstone brick texture for the banks
        function createBrickTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            // Mortar / Sand gap color
            ctx.fillStyle = '#8d7b56';
            ctx.fillRect(0, 0, 128, 128);

            // Brick colors based on user request #d6ae64
            const brickColors = ['#d6ae64', '#e2bf7a', '#c89f50', '#caab6d', '#bf9c56'];

            const w = 60, h = 2, g = 4;
            for (let y = 0; y < 128; y += h + g) {
                const off = (Math.floor(y / (h + g)) % 2 === 0) ? 0 : w / 2;
                for (let x = -w; x < 128; x += w + g) {
                    ctx.fillStyle = brickColors[Math.floor(Math.random() * brickColors.length)];
                    ctx.fillRect(x + off + g / 2, y + g / 2, w, h);

                    // Subtle sun-bleached highlight
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.strokeRect(x + off + g / 2, y + g / 2, w, h);
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // Create a procedural texture for water movement (optimized)
        function sr_createWaterTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;  // Reduced from 512 for better performance
            canvas.height = 256;
            const ctx = canvas.getContext('2d', { alpha: false }); // Disable alpha for performance

            ctx.fillStyle = '#0077be';
            ctx.fillRect(0, 0, 256, 256);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 30; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * 256, Math.random() * 256);
                ctx.lineTo(Math.random() * 256, Math.random() * 256);
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 6);
            texture.generateMipmaps = true; // Enable mipmaps for better performance at distance
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            return texture;
        }

        // Helper to create a simple tree for the small river (optimized with shared geometries)
        function sr_createTree() {

            group.scale.set(0.1, 0.1, 0.1);

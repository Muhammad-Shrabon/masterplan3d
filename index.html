        function sr_createRiverAndBanks(config) {
            const sr_group = new THREE.Group();
            scene.add(sr_group);

            // Generate curve from the config's points array
            const curve = new THREE.CatmullRomCurve3(config.points);

            // Calculate river length from the curve
            const riverLength = curve.getLength();

            // Create geometries based on curve length
            const riverGeo = new THREE.PlaneBufferGeometry(config.width, riverLength, 40, config.segments);
            const bankGeo = new THREE.PlaneBufferGeometry(config.width + 13, riverLength, 40, config.segments);

            const transformGeo = (geo, yOffset) => {
                const posAttr = geo.attributes.position;
                const tmpVec = new THREE.Vector3();

                for (let i = 0; i < posAttr.count; i++) {
                    const x = posAttr.getX(i);
                    const y = posAttr.getY(i);
                    const t = (y / riverLength) + 0.5;
                    const point = curve.getPointAt(Math.max(0, Math.min(1, t)));
                    const tangent = curve.getTangentAt(Math.max(0, Math.min(1, t)));
                    const up = new THREE.Vector3(0, 1, 0);
                    const side = new THREE.Vector3().crossVectors(tangent, up).normalize();

                    tmpVec.copy(point).addScaledVector(side, x);
                    posAttr.setXYZ(i, tmpVec.x, tmpVec.y + yOffset, tmpVec.z);
                }
                posAttr.needsUpdate = true;
                geo.computeVertexNormals();
            };

            // Geometry for vertical side walls
            const wallHeight = 2;
            const wallGeo = new THREE.BufferGeometry();
            const wallVertices = [];
            const wallUvs = [];
            const wallIndices = [];

            const riverHalfW = config.width / 2;
            const bankY = 2; // Height of the bank
            const riverY = 2.8; // Height of the river water

            for (let i = 0; i <= config.segments; i++) {
                const t = i / config.segments;
                const point = curve.getPointAt(t);
                const tangent = curve.getTangentAt(t);
                const up = new THREE.Vector3(0, 1, 0);
                const side = new THREE.Vector3().crossVectors(tangent, up).normalize();

                // Points for the wall at this segment
                // Left Side Wall
                const pLTop = point.clone().addScaledVector(side, -riverHalfW).add(new THREE.Vector3(0, bankY, 0));
                const pLBottom = point.clone().addScaledVector(side, -riverHalfW).add(new THREE.Vector3(0, riverY, 0));
                // Right Side Wall
                const pRTop = point.clone().addScaledVector(side, riverHalfW).add(new THREE.Vector3(0, bankY, 0));
                const pRBottom = point.clone().addScaledVector(side, riverHalfW).add(new THREE.Vector3(0, riverY, 0));

                wallVertices.push(pLTop.x, pLTop.y, pLTop.z);    // 0 + i*4
                wallVertices.push(pLBottom.x, pLBottom.y, pLBottom.z); // 1 + i*4
                wallVertices.push(pRTop.x, pRTop.y, pRTop.z);    // 2 + i*4
                wallVertices.push(pRBottom.x, pRBottom.y, pRBottom.z); // 3 + i*4

                const uvDist = t * (riverLength / 20);
                wallUvs.push(0, uvDist);
                wallUvs.push(1, uvDist);
                wallUvs.push(0, uvDist);
                wallUvs.push(1, uvDist);

                if (i < config.segments) {
                    const base = i * 4;
                    // Left Wall Faces
                    wallIndices.push(base, base + 1, base + 5);
                    wallIndices.push(base, base + 5, base + 4);
                    // Right Wall Faces
                    wallIndices.push(base + 2, base + 7, base + 3);
                    wallIndices.push(base + 2, base + 6, base + 7);
                }
            }

            wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(wallVertices, 3));
            wallGeo.setAttribute('uv', new THREE.Float32BufferAttribute(wallUvs, 2));
            wallGeo.setIndex(wallIndices);
            wallGeo.computeVertexNormals();

            transformGeo(riverGeo, riverY);
            transformGeo(bankGeo, bankY);

            const WATER_COLOR = 0xc8ffff;
            const brickTex = createBrickTexture();
            brickTex.repeat.set(5, riverLength / 25);

            const riverMat = new THREE.MeshStandardMaterial({
                color: WATER_COLOR,
                map: sr_waterTexture,
                roughness: 0.1,
                metalness: 0.5,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide,
                depthWrite: true,
                polygonOffset: true,
                polygonOffsetFactor: -2,
                polygonOffsetUnits: -2,
                emissive: 0x336688,
                emissiveIntensity: 0.3
            });

            const bankMat = new THREE.MeshStandardMaterial({
                map: brickTex,
                roughness: 0.8,
                side: THREE.BackSide, // Changed to back side for bank if it is a ground plane
                polygonOffset: true,
                polygonOffsetFactor: -1,
                polygonOffsetUnits: -1
            });
            // Actually, DoubleSide is safer
            bankMat.side = THREE.DoubleSide;

            const wallMat = new THREE.MeshStandardMaterial({
                map: brickTex,
                roughness: 0.8,
                side: THREE.DoubleSide
            });

            sr_riverMesh = new THREE.Mesh(riverGeo, riverMat);
            sr_bankMesh = new THREE.Mesh(bankGeo, bankMat);
            const sr_wallMesh = new THREE.Mesh(wallGeo, wallMat);

            sr_group.add(sr_riverMesh);
            sr_group.add(sr_bankMesh);
            sr_group.add(sr_wallMesh);

            // Removed tree placement along river banks

            sr_group.position.set(config.position.x || 0, config.position.y || 0, config.position.z || 0);
            sr_group.rotation.set(config.rotation.x || 0, config.rotation.y || 0, config.rotation.z || 0);
        }

        /**
         * Creates a curved cluster of houses along a provided path.

        /**
         * Creates a curved cluster of houses along a provided path.
         */
        function createCurveHouseBunch(parent, config, options = {}) {
            const { points, position, rotation } = config;
            const {
                houseSpacing = 40,
                offsetDistance = 16,
                landWidth = 40,
                startId = 500,
                houseCount: customHouseCount,
                separateRows = false,
                isTerrace = false,
                innerGapScale = 1,
                outerGapScale = 1,
                basePlotW = 1200,
                basePlotD = 1500,
                hWidth = 220,
                hDepth = 280,
                houseRotation = options.hRotate || options.houseRotation || 0,
                flipped = false,
                hasPool = true,
                carCount = 2,
                hasCarParking = false,
                hasPlayground = false,
                hFloorH = 100,
                houseOX = 0, houseOZ = 0,
                poolOX = 0, poolOZ = 0,
                carOX = 0, carOZ = 0,
                playOX = 0, playOZ = 0,
                carW = 80, carL = 160,
                totalHouses = null,
                houseDesign = 'standard',
                hScale = 1
            } = options;

            const igx = (typeof innerGapScale === 'object') ? (innerGapScale.x !== undefined ? innerGapScale.x : 1) : innerGapScale;
            const igy = (typeof innerGapScale === 'object') ? (innerGapScale.y !== undefined ? innerGapScale.y : 1) : innerGapScale;
            const ogx = (typeof outerGapScale === 'object') ? (outerGapScale.x !== undefined ? outerGapScale.x : 1) : outerGapScale;
            const ogy = (typeof outerGapScale === 'object') ? (outerGapScale.y !== undefined ? outerGapScale.y : 1) : outerGapScale;

            // Decouple building scale from area scale for custom designs
            const areaHScale = (houseDesign === 'custom') ? 1 : hScale;

            // Calculate plot dimensions using innerGapScale (consistent with createHouseCluster)
            const plotWidth = (hWidth * areaHScale) + Math.max(0, (basePlotW * areaHScale - (hWidth * areaHScale))) * igx;
            const plotDepth = (hDepth * areaHScale) + Math.max(0, (basePlotD * areaHScale - (hDepth * areaHScale))) * igy;

            const curve = new THREE.CatmullRomCurve3(points);
            const totalLen = curve.getLength();

            // Calculate margin to avoid land overflow (half of plot width in world units)
            // ogy (from outerGapScale) affects the longitudinal margin
            const houseWorldWidth = plotWidth * 0.015;
            const margin = (houseWorldWidth / 2) * ogy;
            const tMargin = totalLen > (margin * 2) ? margin / totalLen : 0;
            const tStart = tMargin;
            const tEnd = 1 - tMargin;
            const activeLen = totalLen * (tEnd - tStart);

            // Determine loopCount (number of positions along the curve)
            let loopCount = customHouseCount;
            if (loopCount === undefined) {
                loopCount = Math.floor(activeLen / houseSpacing) + 1;
            }
            if (loopCount < 1) loopCount = 1;

            const group = new THREE.Group();
            group.position.set(position.x || 0, position.y || 0, position.z || 0);
            group.rotation.set(rotation.x || 0, rotation.y || 0, rotation.z || 0);
            parent.add(group);

            const housesGroup = new THREE.Group();
            housesGroup.position.set(options.x || 0, options.y || 0, options.z || 0);
            group.add(housesGroup);

            // Create curved land strip
            const landPoints = [];
            const segmentsCount = 100;
            for (let i = 0; i <= segmentsCount; i++) {
                const t = i / segmentsCount;
                const p = curve.getPointAt(t);
                landPoints.push(p.clone());
            }
            const landCurve = new THREE.CatmullRomCurve3(landPoints);
            // ogx affects the land width
            const finalLandWidth = landWidth * ogx;
            const landGeo = createRoadGeometry(landCurve, finalLandWidth * (separateRows ? 2 : 1), segmentsCount);
            const landMat = new THREE.MeshBasicMaterial({
                color: 0xA9DA3F,
                polygonOffset: true,
                polygonOffsetFactor: -3,
                polygonOffsetUnits: -3
            });
            const landMesh = new THREE.Mesh(landGeo, landMat);
            landMesh.position.y = 0.02;
            group.add(landMesh);

            // Removed curved boundary trees outside plot areas

            // Place houses and trees
            let housesPlaced = 0;
            const targetTotal = totalHouses || (separateRows ? loopCount * 2 : loopCount);

            // For paired placement, stepsCount = number of pairs along the curve
            const stepsCount = separateRows ? Math.ceil(targetTotal / 2) : targetTotal;

            const sampleTs = [];

            // Logic: Isolate the new Fixed-Gap system to Western Link ONLY
            // Proportional system for Zones A, B, C, D
            if (totalHouses !== null && stepsCount > 1) {
                let currentDist = 0;
                sampleTs.push(tStart);
                const unitGap = houseSpacing;

                for (let i = 1; i < stepsCount; i++) {
                    const lastT = sampleTs[sampleTs.length - 1];
                    const tangent = curve.getTangentAt(lastT).normalize();
                    const peekT = Math.min(lastT + 0.05, 1);
                    const tangentNext = curve.getTangentAt(peekT).normalize();

                    const curveAngle = tangent.angleTo(tangentNext);
                    const junctionBuffer = (curveAngle > 0.1) ? (curveAngle * offsetDistance * 1.5) : 0;

                    currentDist += unitGap + junctionBuffer;
                    const nextT = tStart + (currentDist / totalLen);

                    if (nextT > tEnd) break;
                    sampleTs.push(nextT);
                }
            } else {
                // Restore proportional spacing (Auto-spacing for A, B, C, D)
                for (let i = 0; i < stepsCount; i++) {
                    const t = stepsCount > 1 ? tStart + (i / (stepsCount - 1)) * (tEnd - tStart) : 0.5;
                    sampleTs.push(t);
                }
            }

            for (let i = 0; i < sampleTs.length; i++) {
                const t = sampleTs[i];
                const p = curve.getPointAt(t);
                const tangent = curve.getTangentAt(t).normalize();
                const normal = new THREE.Vector3(0, 1, 0);
                const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
                const angle = Math.atan2(tangent.x, tangent.z);

                const hRotRad = houseRotation * (Math.PI / 180);

                if (separateRows) {
                    // Paired Serial System: 1->2, 3->4, 5->6 matching across the road

                    // House A (Side A)
                    if (housesPlaced < targetTotal) {
                        const sideDirA = flipped ? -1 : 1;
                        const housePosA = p.clone().add(binormal.clone().multiplyScalar(offsetDistance * sideDirA));
                        const houseA = createHouse("CH-" + (startId + housesPlaced), plotWidth, plotDepth, null, hasPool, carCount, hasPlayground, hDepth * areaHScale, hWidth * areaHScale, !isTerrace, hFloorH, houseOX, houseOZ, poolOX, poolOZ, carOX, carOZ, playOX, playOZ, carW, carL, innerGapScale, isTerrace, hasCarParking, houseDesign, hScale, houseRotation);

                        houseA.position.copy(housePosA);
                        houseA.position.y = 0.2;
                        houseA.rotation.y = angle + (flipped ? -Math.PI / 2 : Math.PI / 2);

                        housesGroup.add(houseA);
                        housesPlaced++;
                    }

                    // House B (Side B - Matching Pair)
                    if (housesPlaced < targetTotal) {
                        const sideDirB = flipped ? 1 : -1;
                        const housePosB = p.clone().add(binormal.clone().multiplyScalar(offsetDistance * sideDirB));
                        const houseB = createHouse("CH-" + (startId + housesPlaced), plotWidth, plotDepth, null, hasPool, carCount, hasPlayground, hDepth * areaHScale, hWidth * areaHScale, !isTerrace, hFloorH, houseOX, houseOZ, poolOX, poolOZ, carOX, carOZ, playOX, playOZ, carW, carL, innerGapScale, isTerrace, hasCarParking, houseDesign, hScale, houseRotation);

                        houseB.position.copy(housePosB);
                        houseB.position.y = 0.2;
                        houseB.rotation.y = angle + (flipped ? Math.PI / 2 : -Math.PI / 2);

                        housesGroup.add(houseB);
                        housesPlaced++;
                    }
                } else {
                    // Single row placement
                    if (housesPlaced < targetTotal) {
                        const sideDir = flipped ? -1 : 1;
                        const housePos = p.clone().add(binormal.clone().multiplyScalar(offsetDistance * sideDir));
                        const house = createHouse("CH-" + (startId + housesPlaced), plotWidth, plotDepth, null, hasPool, carCount, hasPlayground, hDepth * areaHScale, hWidth * areaHScale, !isTerrace, hFloorH, houseOX, houseOZ, poolOX, poolOZ, carOX, carOZ, playOX, playOZ, carW, carL, innerGapScale, isTerrace, hasCarParking, houseDesign, hScale, houseRotation);

                        house.position.copy(housePos);
                        house.position.y = 0.2;
                        house.rotation.y = angle + (flipped ? -Math.PI / 2 : Math.PI / 2);

                        housesGroup.add(house);
                        housesPlaced++;
                    }
                }
            }
            return group;
        }

        /**
         * Creates a Zone-A House block where have 18 houses with a small pool and car,
         * which will be odd and even separate and this houses group or block 
         * controllable by Carve value (curvature), Position X Y Z and Rotation X Y.
         */
        function createZoneABlock(parent, options) {
            const {
                carve = 0,         // Curvature factor (Bulge amount)
                posX = 0, posY = 0, posZ = 0,
                rotX = 0, rotY = 0,
                serialCount = 18,
                hScale = 0.8,
                unitSpacing = 22,
                rowSpacing = 35
            } = options;

            const group = new THREE.Group();
            group.position.set(posX, posY, posZ);
            group.rotation.set(rotX * (Math.PI / 180), rotY * (Math.PI / 180), 0);
            parent.add(group);

            const totalPerRow = Math.ceil(serialCount / 2);
            const halfLen = ((totalPerRow - 1) * unitSpacing) / 2;

            // Plot sizes for createHouse
            const plotW = 800 * hScale;
            const plotD = 1000 * hScale;

            for (let i = 0; i < serialCount; i++) {
                const isEven = i % 2 === 0;
                const localIdx = Math.floor(i / 2);

                // Position along X (local to group)
                const x = -halfLen + localIdx * unitSpacing;

                // Curvature (Parabolic Offset)
                const t = totalPerRow > 1 ? localIdx / (totalPerRow - 1) : 0.5;
                const curveZ = carve * (1 - Math.pow(2 * t - 1, 2));

                // Row Z offset (separate odd/even)
                const z = (isEven ? rowSpacing / 2 : -rowSpacing / 2) + curveZ;

                const unitGroup = new THREE.Group();
                unitGroup.position.set(x, 0, z);

                // Calculate local rotation to follow the curve tangent
                const L = (totalPerRow - 1) * unitSpacing;
                const slope = L > 0 ? -8 * carve * (x / (L * L)) : 0;
                const angle = Math.atan(slope);

                unitGroup.rotation.y = -angle + (isEven ? 0 : Math.PI);

                const formattedId = "Z-A-" + (i + 1).toString().padStart(2, '0');
                // createHouse signature: id, plotW, plotD, skipWall, hasPool, carCount
                const house = createHouse(formattedId, plotW, plotD, null, true, 1);
                unitGroup.add(house);
                group.add(unitGroup);
            }

            // Create curved land base following the 'carve' curvature
            const landPoints = [];
            const segments = 20;
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const lx = -halfLen - 15 + t * (halfLen * 2 + 30);
                // Re-calculate curve offset for land
                const lCurveZ = carve * (1 - Math.pow(2 * t - 1, 2));
                landPoints.push(new THREE.Vector3(lx, 0, lCurveZ));
            }

            const landCurve = new THREE.CatmullRomCurve3(landPoints);
            const landGeo = createRoadGeometry(landCurve, rowSpacing + 40, 64);
            const landMat = new THREE.MeshBasicMaterial({
                color: 0xA9DA3F,
                polygonOffset: true,
                polygonOffsetFactor: 3,
                polygonOffsetUnits: 3
            });
            const landMesh = new THREE.Mesh(landGeo, landMat);
            landMesh.position.y = -0.05; // Slightly below houses
            group.add(landMesh);

            return group;
        }

                .night-active .icon-moon { opacity: 1; }

                #city-tour-btn { display: none; } /* Removed Drone Tour */

                /* Walking Mode Button */
                #walking-mode-btn {
                    position: fixed;
                    top: 100px;
                    right: 30px;
                    z-index: 10000;
                    background: rgba(255, 255, 255, 0.1);
                    backdrop-filter: blur(15px) saturate(160%);
                    -webkit-backdrop-filter: blur(15px) saturate(160%);
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    padding: 8px 12px;
                    border-radius: 100px;
                    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    cursor: pointer;
                    font-family: 'Outfit', sans-serif;
                    transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
                    user-select: none;
                    color: white;
                }
                #walking-mode-btn:hover {
                    box-shadow: 0 15px 50px rgba(255, 255, 255, 0.2);
                    transform: translateY(-5px);
                    background: rgba(255, 255, 255, 0.2);
                }
                #walking-mode-btn.active {
                    background: rgba(34, 197, 94, 0.3);
                    border-color: rgba(34, 197, 94, 0.5);
                    box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
                }
                #walking-mode-btn .controls-hint {
                    position: absolute;
                    top: 100%;
                    right: 0;
                    font-size: 10px;
                    margin-top: 10px;
                    background: rgba(0,0,0,0.5);
                    padding: 4px 8px;
                    border-radius: 4px;
                    opacity: 0;
                    transition: 0.3s;
                    pointer-events: none;
                    white-space: nowrap;
                }
                #walking-mode-btn.active .controls-hint { opacity: 1; }

                /* Camera button removed */
            `;
            document.head.appendChild(style);

            const toggle = document.createElement('div');
            toggle.id = 'day-night-switch';
            toggle.innerHTML = `
                <span class="mode-text">Day View</span>
                <div class="switch-track">
                    <div class="switch-thumb">
                        <span class="icon-sun">☀️</span>
                        <span class="icon-moon">🌙</span>
                    </div>
                </div>
            `;
            document.body.appendChild(toggle);

            const walkingBtn = document.createElement('div');
            walkingBtn.id = 'walking-mode-btn';
            walkingBtn.innerHTML = `
                <div class="tour-icon">🚶</div>
                <span class="mode-text">Walking Tour</span>
                <div class="controls-hint">USE W, A, S, D TO WALK</div>
            `;
            document.body.appendChild(walkingBtn);

            /* View toggle button removed */

            walkingBtn.addEventListener('click', () => {
                isWalkingMode = !isWalkingMode;
                walkingBtn.classList.toggle('active', isWalkingMode);
                walkingBtn.querySelector('.mode-text').textContent = isWalkingMode ? 'Exit Walking' : 'Walking Tour';
                walkingBtn.querySelector('.controls-hint').textContent = isWalkingMode ? 'USE ARROWS OR WASD TO WALK' : '';

                if (agent) {
                    agent.visible = isWalkingMode;
                }

                if (isWalkingMode) {
                    // Standard Game Mode: Request Pointer Lock for true mouse look if clicked again
                    renderer.domElement.requestPointerLock = renderer.domElement.requestPointerLock || renderer.domElement.mozRequestPointerLock;
                    const requestLock = () => {
                        if (isWalkingMode) renderer.domElement.requestPointerLock();
                    };
                    renderer.domElement.addEventListener('mousedown', requestLock);
                    walkingBtn._lockHandler = requestLock;
                    // Set walk-friendly controls
                    controls.maxDistance = 12; // Standard close 3rd person (was 30)
                    controls.minDistance = 3;  // Prevent clipping into character
                    controls.enablePan = false;
                    controls.maxPolarAngle = Math.PI / 2.05; // Prevent going underground

                    // Teleport agent to current view instantly
                    if (agent && controls.target) {
                        agent.position.set(controls.target.x, 0.5, controls.target.z);
                        // Orient agent to face current camera forward direction
                        const forward = new THREE.Vector3();
                        camera.getWorldDirection(forward);
                        forward.y = 0;
                        forward.normalize();
                        agent.rotation.y = Math.atan2(forward.x, forward.z);

                        // Teleport camera instantly
                        const distance = (walkingCameraMode === 'behind' ? -5.5 : 5.5);
                        const eyePos = agent.position.clone()
                            .add(forward.multiplyScalar(distance))
                            .add(new THREE.Vector3(0, 2.5, 0));
                        camera.position.copy(eyePos);
                        controls.target.copy(agent.position.clone().add(new THREE.Vector3(0, 1.8, 0)));
                        controls.update();
                    }
                } else {
                    agent.visible = false;
                    currentWalkingSpeed = 0;
                    document.exitPointerLock();
                    renderer.domElement.removeEventListener('mousedown', walkingBtn._lockHandler);

                    // Restore original controls
                    controls.maxDistance = 3200;
                    controls.minDistance = 0.1;
                    controls.enablePan = true;
                    controls.maxPolarAngle = Math.PI / 2.05;
                }
            });



            toggle.addEventListener('click', () => {
                isNight = !isNight;
                document.body.classList.toggle('night-active', isNight);
                toggle.querySelector('.mode-text').textContent = isNight ? 'Night View' : 'Day View';

                // --- Scene Updates ---
                const skyColor = isNight ? 0x050816 : 0x87ceeb; // Modern deep midnight navy
                const fogColor = isNight ? 0x050816 : 0x87ceeb;
                const ambientIntensity = isNight ? 0.65 : 0.7; // Significantly brighter night
                const directionalIntensity = isNight ? 0.75 : 0.8; // Stronger moon light

                // Update Sky & Fog
                if (isNight) {
                    // Smooth transition would be better but background.set is instant
                    scene.background.setHex(skyColor);
                } else {
                    scene.background.setHex(0x87ceeb);
                }

                // Fade Sky Elements
                if (stars) {
                    if (stars.material.uniforms) {
                        stars.material.uniforms.uOpacity.value = isNight ? 1 : 0;
                    }
                    if (stars.userData.cloudGroup) {
                        stars.userData.cloudGroup.children.forEach(c => {
                            c.material.opacity = isNight ? 0.3 : 0;
                        });
                    }
                }
                if (moon) {
                    moon.material.opacity = isNight ? 1 : 0;
                    moon.material.emissiveIntensity = isNight ? 1.5 : 0;
                    if (moon.userData.glow) moon.userData.glow.material.opacity = isNight ? 0.8 : 0;
                }
                if (scene.fog) {
                    scene.fog.color.setHex(fogColor);
                    if (scene.fog.isFogExp2) {
                        scene.fog.density = isNight ? 0.0008 : 0.0005;
                    }

                    // Update Lights
                    scene.traverse(child => {
                        if (child.isAmbientLight) {
                            child.intensity = ambientIntensity;
                            if (isNight) child.color.setHex(0xb0c4de); // Light Steel Blue (Moonlight)
                            else child.color.setHex(0xffffff);
                        }
                        if (child.isDirectionalLight) {
                            child.intensity = directionalIntensity;
                            if (isNight) child.color.setHex(0xdcefff); // Cold white/blue moonlight
                            else child.color.setHex(0xffffff);
                        }

                        // Grounds and Plots
                        if (child.isMesh && (child.geometry.type === 'PlaneGeometry' || child.geometry.type === 'BoxGeometry')) {
                            if (child.material && child.material.color) {
                                const hex = child.material.color.getHex();
                                // If it's the green ground/land
                                if (hex === 0x008000 || hex === 0xA9DA3F || hex === 0xc1d86c) {
                                    // Dynamic darkening handled by light intensity, 
                                    // but we can add a subtle tint if needed
                                }
                            }
                        }
                    });

                    // Update Materials
                    if (typeof materialCache !== 'undefined') {
                        const houseWin = materialCache['houseWin'];
                        if (houseWin) {
                            houseWin.emissive.setHex(isNight ? 0xffdd44 : 0x111111);
                            houseWin.emissiveIntensity = isNight ? 8.0 : 1.0; // Brighter windows
                        }

                        const houseBody = materialCache['houseBody'];
                        if (houseBody) {
                            // Dampen body color slightly
                            // houseBody.color.setHex(isNight ? 0x777777 : 0xe8e4d9);
                        }
                    }

                    // Update Metro Glass
                    if (typeof skyGlassMat !== 'undefined') {
                        skyGlassMat.emissive.setHex(isNight ? 0x3388ff : 0x224466);
                        skyGlassMat.emissiveIntensity = isNight ? 5.0 : 0.2;
                    }

                    // Update River
                    if (typeof river !== 'undefined' && river && river.shaderMaterial) {
                        river.shaderMaterial.uniforms.uColor.value.setHex(isNight ? 0x002244 : 0x00ccff);
                    }

                    // Update Cartoon River (if any)
                    scene.traverse(child => {
                        if (child.isMesh && child.material && child.material.type === 'MeshPhongMaterial') {
                            // This usually finds the CartoonRiver meshes
                            if (child.material.color.getHex() === 0x33ccff) {
                                child.material.emissive.setHex(isNight ? 0x001122 : 0x000000);
                            }
                        }

                        // Update Lamp Posts
                        if (child.name === 'lampBulb') {
                            child.material.emissive.setHex(isNight ? 0xffffbb : 0x000000);
                            child.material.emissiveIntensity = isNight ? 10.0 : 0; // Reduced for subtle light
                        }
                        if (child.name === 'lampCone') {
                            child.material.opacity = isNight ? 0.2 : 0; // Requested opacity .2
                        }

                        if (child.name === 'houseBulb') {
                            child.material.emissive.setHex(isNight ? 0xffea55 : 0x000000);
                            child.material.emissiveIntensity = isNight ? 25.0 : 0; // Clear porch light
                        }

                        // Update House Windows (individual traverse in case shared material isn't enough)
                        if (child.name === 'houseWindow' || (child.material && child.material.name && child.material.name.includes('Win'))) {
                            // child.material.emissive.setHex(isNight ? 0xffcc33 : 0x111111);
                        }
                    });

                    // Update Cars
                    // Usually lightMat is used for headlights
                    scene.traverse(child => {
                        if (child.material && child.material.name === 'carHeadlight') {
                            // if we had names...
                        }
                    });

                    // Add a cool stars effect if night?
                    // For now, these basic changes already transform the scene significantly.
                }
            });
        })();

        window.onload = () => {
            init();
        }
    </script>

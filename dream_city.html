/** Plot + tea stall + coffee shop + restaurant in one strip
   spacing: shopGap | gap | spacing, shopDepth | venueDepth, shopPadding | padding,
   per shop (tea/coffee/restaurant): z | offsetZ, d | depth, w | width, signText --- */
function createFoodVenueStrip(transform = {}) {
    const group = new THREE.Group();
    const plotW = transform.width ?? transform.w ?? 11;
    const plotD = transform.depth ?? transform.d ?? 26;
    const plotColor = transform.plotColor ?? transform.color ?? 0xD6D0CD;
    const borderColor = transform.borderColor ?? 0xF75F60;
    const borderWidth = transform.borderWidth ?? 1;
    const scale = transform.scale ?? 1;

    const shopGap = transform.shopGap ?? transform.gap ?? transform.spacing ?? 0.6;
    const edgePad = transform.shopPadding ?? transform.padding ?? 0.5;
    const defaultVenueW = transform.shopWidth ?? transform.venueWidth ?? plotW * 0.92;

    addPlotBase(group, plotW, plotD, plotColor, borderColor, borderWidth);

    const teaCfg = transform.tea || {};
    const coffeeCfg = transform.coffee || {};
    const restCfg = transform.restaurant || {};

    const hasManualZ = [teaCfg, coffeeCfg, restCfg].some(c => c.z != null || c.offsetZ != null);

    let teaZ, coffeeZ, restZ;
    let teaD, coffeeD, restD;

    if (hasManualZ) {
        teaZ = teaCfg.z ?? teaCfg.offsetZ ?? 0;
        coffeeZ = coffeeCfg.z ?? coffeeCfg.offsetZ ?? 0;
        restZ = restCfg.z ?? restCfg.offsetZ ?? 0;
        const fallbackD = transform.shopDepth ?? transform.venueDepth ?? (plotD - edgePad * 2) / 3;
        teaD = teaCfg.d ?? teaCfg.depth ?? fallbackD;
        coffeeD = coffeeCfg.d ?? coffeeCfg.depth ?? fallbackD;
        restD = restCfg.d ?? restCfg.depth ?? fallbackD;
    } else {
        const uniformD = transform.shopDepth ?? transform.venueDepth
            ?? (plotD - edgePad * 2 - shopGap * 2) / 3;
        teaD = teaCfg.d ?? teaCfg.depth ?? uniformD;
        coffeeD = coffeeCfg.d ?? coffeeCfg.depth ?? uniformD;
        restD = restCfg.d ?? restCfg.depth ?? uniformD;

        const totalSpan = teaD + coffeeD + restD + shopGap * 2;
        const startZ = -totalSpan / 2 + teaD / 2;

        teaZ = teaCfg.z ?? teaCfg.offsetZ ?? startZ;
        coffeeZ = coffeeCfg.z ?? coffeeCfg.offsetZ ?? (startZ + teaD / 2 + shopGap + coffeeD / 2);
        restZ = restCfg.z ?? restCfg.offsetZ ?? (coffeeZ + coffeeD / 2 + shopGap + restD / 2);
    }

    const teaW = teaCfg.w ?? teaCfg.width ?? defaultVenueW;
    const coffeeW = coffeeCfg.w ?? coffeeCfg.width ?? defaultVenueW;
    const restW = restCfg.w ?? restCfg.width ?? defaultVenueW;

    const tea = buildTeaStallGroup({ w: teaW, d: teaD, ...teaCfg });
    tea.position.set(teaCfg.x ?? 0, teaCfg.y ?? 0.1, teaZ);
    group.add(tea);

    const coffee = buildCoffeeShopGroup({ w: coffeeW, d: coffeeD, ...coffeeCfg });
    coffee.position.set(coffeeCfg.x ?? 0, coffeeCfg.y ?? 0.1, coffeeZ);
    group.add(coffee);

    const restaurant = buildRestaurantGroup({ w: restW, d: restD, ...restCfg });
    restaurant.position.set(restCfg.x ?? 0, restCfg.y ?? 0.1, restZ);
    group.add(restaurant);

    if (scale !== 1) group.scale.multiplyScalar(scale);
    return addToScene(group, 'createFoodVenueStrip', transform);
}

function createStylishApartment(transform = {}) {
    const group = new THREE.Group();

    // Configuration
    const w = transform.width ?? 14;
    const d = transform.depth ?? 9;
    const wallCol = transform.wallColor ?? 0xf5f5f7; // Off-white/slate-white
    const accentCol = transform.accentColor ?? 0x2d3748; // Sleek modern dark charcoal
    const woodCol = transform.woodColor ?? 0x8d6e63; // Warm wood color for facade panels
    const balconyCol = transform.balconyColor ?? 0x88ccff; // Transparent glass balcony blue
    const scale = transform.scale ?? 1;

    // Dynamic Floor Count (floor: 4 means 4 residential floors + 1 lobby)
    const floorCount = transform.floor ?? transform.floorCount ?? transform.floors ?? 5;

    // Custom base/land and window colors
    const landCol = transform.landColor ?? transform.baseColor ?? transform.landCol ?? transform.baseCol ?? 0xcccccc;
    const winCol = transform.windowColor ?? transform.winColor ?? transform.windowCol ?? transform.winCol ?? 0xe0f7fa;

    // Border configuration
    const borderWidth = transform.borderWidth ?? 0.25;
    const borderColor = transform.borderColor ?? transform.curbColor ?? 0x333333;

    // Materials
    const baseMat = new THREE.MeshStandardMaterial({ color: landCol, roughness: 0.9 });
    const wallMat = new THREE.MeshStandardMaterial({ color: wallCol, roughness: 0.8 });
    const darkAccentMat = new THREE.MeshStandardMaterial({ color: accentCol, roughness: 0.5 });
    const woodMat = new THREE.MeshStandardMaterial({ color: woodCol, roughness: 0.7 });
    const glassMat = new THREE.MeshStandardMaterial({ color: balconyCol, transparent: true, opacity: 0.45, roughness: 0.1 });
    const windowGlassMat = new THREE.MeshStandardMaterial({ color: winCol, transparent: true, opacity: 0.6, metalness: 0.8 });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
    const lightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffcc, emissiveIntensity: 0.8 });

    // Helper to position local mesh relative to the building group
    const addMesh = (mesh, config) => {
        const { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0 } = config;
        mesh.position.set(x, y, z);
        mesh.rotation.set(rx, ry, rz);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
        return mesh;
    };

    // 1. BASE PLOT / FOUNDATION COMPOUND
    const baseW = w + 6; // 20 units
    const baseD = d + 5; // 14 units
    const baseH = 0.2;
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(baseW, baseH, baseD), baseMat), { y: baseH / 2 });

    // Base curb fence (low borders)
    if (borderWidth > 0) {
        const curbH = 0.4;
        const curbT = borderWidth;
        const curbMat = new THREE.MeshStandardMaterial({ color: borderColor });
        // Back fence
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(baseW, curbH, curbT), curbMat), { y: curbH/2, z: -baseD/2 + curbT/2 });
        // Left fence
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(curbT, curbH, baseD - curbT * 2), curbMat), { y: curbH/2, x: -baseW/2 + curbT/2 });
        // Right fence
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(curbT, curbH, baseD - curbT * 2), curbMat), { y: curbH/2, x: baseW/2 - curbT/2 });
        // Front fence (left side and right side of entrance)
        const gateOpenW = 4.0;
        const frontWallW = (baseW - gateOpenW) / 2;
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(frontWallW, curbH, curbT), curbMat), { y: curbH/2, x: -baseW/2 + frontWallW/2, z: baseD/2 - curbT/2 });
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(frontWallW, curbH, curbT), curbMat), { y: curbH/2, x: baseW/2 - frontWallW/2, z: baseD/2 - curbT/2 });
    }

    // 2. MAIN BUILDING BLOCK
    // Ground floor: lobby (4m tall)
    const groundH = 4.0;
    // Main structural block for Ground Floor
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(w, groundH, d), wallMat), { y: groundH / 2 });

    // Glass storefront panels for lobby (front facade)
    const lobbyGlassW = w - 4;
    const lobbyGlassH = 2.8;
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(lobbyGlassW, lobbyGlassH, 0.1), windowGlassMat), { x: 0, y: lobbyGlassH / 2 + 0.2, z: d / 2 + 0.05 });
    // Lobby entrance frames
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.12, lobbyGlassH, 0.2), frameMat), { x: -lobbyGlassW/2, y: lobbyGlassH / 2 + 0.2, z: d / 2 + 0.07 });
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.12, lobbyGlassH, 0.2), frameMat), { x: lobbyGlassW/2, y: lobbyGlassH / 2 + 0.2, z: d / 2 + 0.07 });
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.12, lobbyGlassH, 0.2), frameMat), { x: 0, y: lobbyGlassH / 2 + 0.2, z: d / 2 + 0.07 });
    // Entrance portico/canopy (overhead ceiling)
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(lobbyGlassW + 1, 0.25, 2.5), darkAccentMat), { x: 0, y: lobbyGlassH + 0.35, z: d / 2 + 1.25 });

    // UPPER RESIDENTIAL FLOORS (3.5m each)
    const resFloorH = 3.5;
    for (let f = 0; f < floorCount; f++) {
        const yBase = groundH + f * resFloorH;
        const yMid = yBase + resFloorH / 2;

        // Structural residential block
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(w, resFloorH - 0.05, d), wallMat), { y: yMid });

        // FACADE STYLING
        // Wood accent panels on the left/right front corners
        const panelW = 1.2;
        const panelD = 0.15;
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(panelW, resFloorH - 0.05, panelD), woodMat), { x: -w/2 + panelW/2, y: yMid, z: d/2 + panelD/2 });
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(panelW, resFloorH - 0.05, panelD), woodMat), { x: w/2 - panelW/2, y: yMid, z: d/2 + panelD/2 });

        // GLASS BALCONIES
        // Balcony concrete slab
        const balW = w - 3.2; // 10.8 units wide
        const balD = 1.4;
        const balSlabH = 0.15;
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(balW, balSlabH, balD), baseMat), { x: 0, y: yBase + balSlabH/2, z: d/2 + balD/2 });

        // Balcony safety glass railings
        const glassH = 0.9;
        const glassT = 0.06;
        // Front glass panel
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(balW, glassH, glassT), glassMat), { x: 0, y: yBase + balSlabH + glassH/2, z: d/2 + balD - glassT/2 });
        // Left side glass panel
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(glassT, glassH, balD - glassT * 2), glassMat), { x: -balW/2 + glassT/2, y: yBase + balSlabH + glassH/2, z: d/2 + balD/2 });
        // Right side glass panel
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(glassT, glassH, balD - glassT * 2), glassMat), { x: balW/2 - glassT/2, y: yBase + balSlabH + glassH/2, z: d/2 + balD/2 });

        // Metallic top handrails
        const railT = 0.04;
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(balW + railT*2, railT, railT), frameMat), { x: 0, y: yBase + balSlabH + glassH + railT/2, z: d/2 + balD - glassT/2 });
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(railT, railT, balD), frameMat), { x: -balW/2 - railT/2, y: yBase + balSlabH + glassH + railT/2, z: d/2 + balD/2 });
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(railT, railT, balD), frameMat), { x: balW/2 + railT/2, y: yBase + balSlabH + glassH + railT/2, z: d/2 + balD/2 });

        // Large French sliding doors behind the balcony
        const doorW = 5.0;
        const doorH = 2.4;
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(doorW, doorH, 0.08), windowGlassMat), { x: 0, y: yBase + balSlabH + doorH/2, z: d/2 - 0.05 });
        // Sliding door frames
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(doorW + 0.15, 0.08, 0.15), frameMat), { x: 0, y: yBase + balSlabH + doorH, z: d/2 });
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(doorW + 0.15, 0.08, 0.15), frameMat), { x: 0, y: yBase + balSlabH, z: d/2 });
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.08, doorH, 0.15), frameMat), { x: -doorW/2, y: yBase + balSlabH + doorH/2, z: d/2 });
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.08, doorH, 0.15), frameMat), { x: doorW/2, y: yBase + balSlabH + doorH/2, z: d/2 });
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.08, doorH, 0.15), frameMat), { x: 0, y: yBase + balSlabH + doorH/2, z: d/2 }); // center mullion

        // WINDOWS ON BACK FACADE (z = -d/2)
        const backWinW = 2.0;
        const backWinH = 1.6;
        const backWinY = yMid + 0.2;
        // Two windows on back wall
        [-3.0, 3.0].forEach(bx => {
            addMesh(new THREE.Mesh(new THREE.BoxGeometry(backWinW, backWinH, 0.08), windowGlassMat), { x: bx, y: backWinY, z: -d/2 - 0.02 });
            addMesh(new THREE.Mesh(new THREE.BoxGeometry(backWinW + 0.12, 0.08, 0.14), frameMat), { x: bx, y: backWinY + backWinH/2, z: -d/2 - 0.03 });
            addMesh(new THREE.Mesh(new THREE.BoxGeometry(backWinW + 0.12, 0.08, 0.14), frameMat), { x: bx, y: backWinY - backWinH/2, z: -d/2 - 0.03 });
            addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.08, backWinH, 0.14), frameMat), { x: bx - backWinW/2, y: backWinY, z: -d/2 - 0.03 });
            addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.08, backWinH, 0.14), frameMat), { x: bx + backWinW/2, y: backWinY, z: -d/2 - 0.03 });
        });

        // WINDOWS ON SIDE FACADE (x = w/2, staircase tower is on the left x = -w/2, so right side is free)
        const sideWinW = 1.4;
        const sideWinH = 1.6;
        const sideWinY = yMid + 0.2;
        [-1.8, 1.8].forEach(sz => {
            addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.08, sideWinH, sideWinW), windowGlassMat), { x: w/2 + 0.02, y: sideWinY, z: sz });
            addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.08, sideWinW + 0.12), frameMat), { x: w/2 + 0.03, y: sideWinY + sideWinH/2, z: sz });
            addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.08, sideWinW + 0.12), frameMat), { x: w/2 + 0.03, y: sideWinY - sideWinH/2, z: sz });
            addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.14, sideWinH, 0.08), frameMat), { x: w/2 + 0.03, y: sideWinY, z: sz - sideWinW/2 });
            addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.14, sideWinH, 0.08), frameMat), { x: w/2 + 0.03, y: sideWinY, z: sz + sideWinW/2 });
        });
    }

    // 3. SLEEK GLASS ELEVATOR SHAFT / STAIR tower (on the left side)
    const towerW = 3.5;
    const towerD = 3.5;
    const towerH = groundH + floorCount * resFloorH + 1.2; // 22.7m tall
    const towerX = -w/2 - towerW/2;
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(towerW, towerH, towerD), darkAccentMat), { x: towerX, y: towerH/2, z: 0 });

    // Tall vertical glass window strip running down the tower front
    const stripWinW = 1.2;
    const stripWinH = towerH - 2.5;
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(stripWinW, stripWinH, 0.08), windowGlassMat), { x: towerX, y: towerH/2 + 0.5, z: towerD/2 + 0.02 });
    // Steel vertical frames around the strip window
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.08, stripWinH, 0.15), frameMat), { x: towerX - stripWinW/2, y: towerH/2 + 0.5, z: towerD/2 + 0.05 });
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.08, stripWinH, 0.15), frameMat), { x: towerX + stripWinW/2, y: towerH/2 + 0.5, z: towerD/2 + 0.05 });
    // Horizontal window divisions (floors indicators)
    for (let f = 0; f <= floorCount; f++) {
        const dividerY = groundH + f * resFloorH;
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(stripWinW, 0.1, 0.15), frameMat), { x: towerX, y: dividerY, z: towerD/2 + 0.06 });
    }

    // 4. ROOFTOP TERRACE GARDEN
    const roofY = groundH + floorCount * resFloorH; // 21.5m
    
    // Safety glass railings around the main building roof
    const rGlassH = 1.0;
    const rGlassT = 0.06;
    // Front railing
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(w, rGlassH, rGlassT), glassMat), { x: 0, y: roofY + rGlassH/2, z: d/2 - rGlassT/2 });
    // Back railing
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(w, rGlassH, rGlassT), glassMat), { x: 0, y: roofY + rGlassH/2, z: -d/2 + rGlassT/2 });
    // Right side railing
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(rGlassT, rGlassH, d - rGlassT * 2), glassMat), { x: w/2 - rGlassT/2, y: roofY + rGlassH/2, z: 0 });
    // Handrail top caps
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(w + rGlassT*2, 0.05, 0.05), frameMat), { x: 0, y: roofY + rGlassH + 0.025, z: d/2 - rGlassT/2 });
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(w + rGlassT*2, 0.05, 0.05), frameMat), { x: 0, y: roofY + rGlassH + 0.025, z: -d/2 + rGlassT/2 });
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, d), frameMat), { x: w/2 - rGlassT/2, y: roofY + rGlassH + 0.025, z: 0 });

    // Green Hedge planter boxes on the roof
    const plantBoxMat = new THREE.MeshStandardMaterial({ color: 0x5d4037 });
    const leafPlanterMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.9 });
    const boxW = 4.0;
    const boxD = 0.8;
    const boxH = 0.5;
    // Planter box 1 (Front edge)
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(boxW, boxH, boxD), plantBoxMat), { x: 2.5, y: roofY + boxH/2, z: d/2 - 0.8 });
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(boxW - 0.1, 0.3, boxD - 0.1), leafPlanterMat), { x: 2.5, y: roofY + boxH, z: d/2 - 0.8 });
    // Planter box 2 (Back edge)
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(boxW, boxH, boxD), plantBoxMat), { x: 2.5, y: roofY + boxH/2, z: -d/2 + 0.8 });
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(boxW - 0.1, 0.3, boxD - 0.1), leafPlanterMat), { x: 2.5, y: roofY + boxH, z: -d/2 + 0.8 });

    // Wooden Pergola on the Roof
    const pergSize = 3.5;
    const pergH = 2.4;
    const pergWoodMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.7 });
    // Pillars
    [-pergSize/2, pergSize/2].forEach(px => {
        [-pergSize/2, pergSize/2].forEach(pz => {
            addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.12, pergH, 0.12), pergWoodMat), { x: -2.5 + px, y: roofY + pergH/2, z: pz });
        });
    });
    // Top frame
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(pergSize + 0.2, 0.1, 0.12), pergWoodMat), { x: -2.5, y: roofY + pergH - 0.05, z: -pergSize/2 });
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(pergSize + 0.2, 0.1, 0.12), pergWoodMat), { x: -2.5, y: roofY + pergH - 0.05, z: pergSize/2 });
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, pergSize + 0.2), pergWoodMat), { x: -2.5 - pergSize/2, y: roofY + pergH - 0.05, z: 0 });
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, pergSize + 0.2), pergWoodMat), { x: -2.5 + pergSize/2, y: roofY + pergH - 0.05, z: 0 });
    // Slats
    for (let i = 0; i <= 6; i++) {
        const slatZ = -pergSize/2 + i * (pergSize / 6);
        addMesh(new THREE.Mesh(new THREE.BoxGeometry(pergSize + 0.4, 0.05, 0.08), pergWoodMat), { x: -2.5, y: roofY + pergH + 0.05, z: slatZ });
    }

    // Pergola seating table and chairs
    const seatingMat = new THREE.MeshStandardMaterial({ color: 0x3e2723 });
    // Table
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.6, 0.8), seatingMat), { x: -2.5, y: roofY + 0.3, z: 0 });
    // Chairs
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), seatingMat), { x: -3.5, y: roofY + 0.2, z: 0 });
    addMesh(new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), seatingMat), { x: -1.5, y: roofY + 0.2, z: 0 });

    // Apply scale
    if (scale !== 1) group.scale.multiplyScalar(scale);

    return addToScene(group, 'createStylishApartment', transform);
}

/* --- index shop market style (single unit) --- */
function buildShopUnit(text, signColor, accent) {
    const shop = new THREE.Group();
    const w = 4, h = 4;

    const frameMat = getMat('shopFrame', () => new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 }));
    const glassMat = getMat('shopGlass', () => new THREE.MeshStandardMaterial({ color: INDEX.glass, transparent: true, opacity: 0.35, metalness: 0.9 }));
    const wallMat = getMat('shopWall', () => new THREE.MeshStandardMaterial({ color: 0xdddddd }));

    part(shop, new THREE.Mesh(new THREE.BoxGeometry(w + 1, h + 1, 6), wallMat), { y: h / 2 });
    part(shop, new THREE.Mesh(new THREE.BoxGeometry(w + 1.2, 0.3, 6.2), getMat('shopRoof', () => new THREE.MeshStandardMaterial({ color: 0x222222 }))), { y: h + 0.5 });

    const frameParts = [];
    const addF = (fw, fh, fd, px, py, pz) => {
        const g = new THREE.BoxGeometry(fw, fh, fd); g.translate(px, py, pz); frameParts.push(g);
    };
    addF(w, 0.12, 0.3, 0, h - 0.06, 3.05);
    addF(w, 0.12, 0.3, 0, 0.06, 3.05);
    addF(0.12, h, 0.3, -w / 2 + 0.06, h / 2, 3.05);
    addF(0.12, h, 0.3, w / 2 - 0.06, h / 2, 3.05);
    part(shop, new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(frameParts), frameMat));
    const glassG = new THREE.BoxGeometry(w - 0.24, h - 0.24, 0.05); glassG.translate(0, h / 2, 3.08);
    part(shop, new THREE.Mesh(glassG, glassMat));

    // Signboard (index sm_createSignboard style)
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#' + new THREE.Color(signColor).getHexString();
    ctx.fillRect(0, 0, 512, 128);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 8;
    ctx.strokeRect(5, 5, 502, 118);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 52px Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 256, 64);
    const tex = new THREE.CanvasTexture(canvas);
    const signMat = new THREE.MeshStandardMaterial({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.8 });
    part(shop, new THREE.Mesh(new THREE.PlaneGeometry(w * 0.9, 0.75), signMat), { y: h + 0.85, z: 3.15 });

    // Awning stripes
    for (let i = 0; i < 8; i++) {
        const c = i % 2 === 0 ? accent : 0xffffff;
        part(shop, new THREE.Mesh(new THREE.BoxGeometry(w / 8, 0.04, 1.2), new THREE.MeshStandardMaterial({ color: c })), {
            x: -w / 2 + (i + 0.5) * (w / 8), y: h + 0.35, z: 3.6, rx: -0.25
        });
    }
    return shop;
}

function createShop(transform) {
    const g = buildShopUnit(
        transform.shopText || 'GROCERY',
        transform.signColor || 0xef4444,
        transform.accent || 0xdc2626
    );
    const s = transform.scale || 1;
    if (s !== 1) g.scale.multiplyScalar(s);
    return addToScene(g, 'createShop', transform);
}

/* --- School — 3 tala, dorja, janla, siri, balcony --- */
function createSchool(transform) {
    const group = new THREE.Group();
    const FLOORS = 3;
    const w = 14, d = 9, floorH = 4;
    const totalH = FLOORS * floorH;

    /* ---- Materials ---- */
    const wallMat  = getMat('schoolWall',  () => new THREE.MeshStandardMaterial({ color: 0xfdf6e3, roughness: 0.8 }));
    const accentMat= getMat('schoolAccent',() => new THREE.MeshStandardMaterial({ color: 0x2980b9, roughness: 0.6 }));
    const roofMat  = getMat('schoolRoof',  () => new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.7 }));
    const glassMat = getMat('schoolGlass', () => new THREE.MeshStandardMaterial({ color: 0x85c1e9, transparent: true, opacity: 0.55, metalness: 0.3 }));
    const frameMat = getMat('schoolWFrame',() => new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.5 }));
    const doorMat  = getMat('schoolDoor',  () => new THREE.MeshStandardMaterial({ color: 0x784212, roughness: 0.6 }));
    const doorGlassMat = getMat('schoolDoorGlass', () => new THREE.MeshStandardMaterial({ color: 0x85c1e9, transparent: true, opacity: 0.5 }));
    const stepMat  = getMat('schoolStep',  () => new THREE.MeshStandardMaterial({ color: 0xbdc3c7, roughness: 0.9 }));
    const railMat  = getMat('schoolRail',  () => new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.7 }));
    const signMat2 = getMat('schoolSignBg',() => new THREE.MeshStandardMaterial({ color: 0x1a5276 }));

    /* ======= FLOORS ======= */
    for (let f = 0; f < FLOORS; f++) {
        const yBase = f * floorH;
        const yMid  = yBase + floorH / 2;

        /* Main body */
        part(group, new THREE.Mesh(new THREE.BoxGeometry(w, floorH - 0.15, d), wallMat), { y: yMid });

        /* Floor ledge / balcony slab on front */
        if (f > 0) {
            part(group, new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.2, 1.4), accentMat), { y: yBase + 0.1, z: d / 2 + 0.5 });
        }

        /* Accent band at top of each floor */
        part(group, new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.25, d + 0.1), accentMat), { y: yBase + floorH - 0.13 });

        /* ---- FRONT FACE WINDOWS (z = +d/2) ---- */
        // 2 windows left & right of centre, skip door area on ground floor
        const winPositionsX = f === 0 ? [-4.5, -2.5, 2.5, 4.5] : [-4.5, -2.5, 0, 2.5, 4.5];
        for (const wx of winPositionsX) {
            // frame
            part(group, new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.9, 0.12), frameMat), { x: wx, y: yMid + 0.3, z: d / 2 + 0.01 });
            // glass
            part(group, new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.08), glassMat), { x: wx, y: yMid + 0.3, z: d / 2 + 0.07 });
            // cross bar
            part(group, new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.06), frameMat), { x: wx, y: yMid + 0.3, z: d / 2 + 0.1 });
        }

        /* ---- BACK FACE WINDOWS (z = -d/2) ---- */
        for (const wx of [-4, -1.5, 1.5, 4]) {
            part(group, new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.9, 0.12), frameMat), { x: wx, y: yMid + 0.3, z: -d / 2 - 0.01 });
            part(group, new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.08), glassMat), { x: wx, y: yMid + 0.3, z: -d / 2 - 0.07 });
        }

        /* ---- SIDE WINDOWS (x = ±w/2) ---- */
        for (const side of [-1, 1]) {
            for (const wz of [-2.5, 0, 2.5]) {
                part(group, new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.6, 1.4), frameMat), { x: side * (w / 2 + 0.01), y: yMid + 0.3, z: wz });
                part(group, new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.3, 1.1), glassMat),  { x: side * (w / 2 + 0.07), y: yMid + 0.3, z: wz });
            }
        }

        /* ---- BALCONY RAILINGS on upper floors front ---- */
        if (f > 0) {
            // horizontal bar top & bottom
            part(group, new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.1, 0.1), railMat), { y: yBase + 1.1, z: d / 2 + 1.15 });
            part(group, new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.1, 0.1), railMat), { y: yBase + 0.25, z: d / 2 + 1.15 });
            // vertical balusters
            for (let b = -6; b <= 6; b++) {
                part(group, new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.85, 6), railMat), { x: b * 1.05, y: yBase + 0.68, z: d / 2 + 1.15 });
            }
        }
    }

    /* ======= MAIN DOOR (Ground floor, front) ======= */
    const doorW = 1.6, doorH = 2.8;
    // door frame
    part(group, new THREE.Mesh(new THREE.BoxGeometry(doorW + 0.25, doorH + 0.2, 0.18), frameMat), { y: doorH / 2, z: d / 2 + 0.01 });
    // left panel
    part(group, new THREE.Mesh(new THREE.BoxGeometry(doorW / 2 - 0.05, doorH - 0.15, 0.12), doorMat), { x: -(doorW / 4), y: doorH / 2, z: d / 2 + 0.06 });
    // right panel
    part(group, new THREE.Mesh(new THREE.BoxGeometry(doorW / 2 - 0.05, doorH - 0.15, 0.12), doorMat), { x:  (doorW / 4), y: doorH / 2, z: d / 2 + 0.06 });
    // glass pane in door
    part(group, new THREE.Mesh(new THREE.BoxGeometry(doorW - 0.3, 0.9, 0.08), doorGlassMat), { y: doorH - 0.8, z: d / 2 + 0.1 });
    // door knobs
    part(group, new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), frameMat), { x: -0.12, y: doorH * 0.45, z: d / 2 + 0.15 });
    part(group, new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), frameMat), {  x: 0.12, y: doorH * 0.45, z: d / 2 + 0.15 });

    /* ======= ROOF ======= */
    // Flat roof slab
    part(group, new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.35, d + 0.6), roofMat), { y: totalH + 0.17 });
    // Parapet walls
    part(group, new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.8, 0.2), accentMat), { y: totalH + 0.57, z:  d / 2 + 0.3 });
    part(group, new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.8, 0.2), accentMat), { y: totalH + 0.57, z: -d / 2 - 0.3 });
    part(group, new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, d + 0.6), accentMat), { y: totalH + 0.57, x:  w / 2 + 0.3 });
    part(group, new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, d + 0.6), accentMat), { y: totalH + 0.57, x: -w / 2 - 0.3 });

    /* ======= FLAG POLE ======= */
    part(group, new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 5.5, 8),
        getMat('schoolPole', () => new THREE.MeshStandardMaterial({ color: 0xbdc3c7, metalness: 0.9 }))),
        { x: -w / 2 + 0.8, y: totalH + 0.35 + 2.75 });
    // Flag
    part(group, new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.1, 0.05),
        getMat('schoolFlag', () => new THREE.MeshStandardMaterial({ color: 0x27ae60 }))),
        { x: -w / 2 + 0.8 + 1.1, y: totalH + 0.35 + 5.1, z: 0.07 });

    /* ======= SIGNBOARD ======= */
    const signCanvas = document.createElement('canvas');
    signCanvas.width = 640; signCanvas.height = 140;
    const sctx = signCanvas.getContext('2d');
    const grad = sctx.createLinearGradient(0, 0, 640, 0);
    grad.addColorStop(0, '#1a5276'); grad.addColorStop(1, '#2980b9');
    sctx.fillStyle = grad; sctx.fillRect(0, 0, 640, 140);
    sctx.strokeStyle = '#f1c40f'; sctx.lineWidth = 6; sctx.strokeRect(6, 6, 628, 128);
    sctx.fillStyle = '#fff'; sctx.font = 'bold 52px Segoe UI, sans-serif';
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🏫 DREAM SCHOOL', 320, 70);
    const signTex = new THREE.CanvasTexture(signCanvas);
    const signMesh = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 1.2),
        new THREE.MeshStandardMaterial({ map: signTex, emissive: 0xffffff, emissiveMap: signTex, emissiveIntensity: 0.6 }));
    part(group, signMesh, { y: totalH + 0.35 + 0.7, z: d / 2 + 0.22 });
    // sign backing board
    part(group, new THREE.Mesh(new THREE.BoxGeometry(5.8, 1.4, 0.12), signMat2), { y: totalH + 0.35 + 0.7, z: d / 2 + 0.12 });

    /* ======= COMPOUND WALL ======= */
    const cwH = 0.65, cwT = 0.2;
    const compW = w / 2 + 1;          // = 8  (half-width of compound)
    const compFz = d / 2 + 3;         // = 7.5 (front wall z)
    const compBz = -(d / 2 + 3);      // = -7.5 (back wall z)
    const gHW = 1.8;                   // gate half-width → gate opening = 3.6 units

    const cWallMat = getMat('cWall', () => new THREE.MeshStandardMaterial({ color: 0x95a5a6, roughness: 0.9 }));
    const gBarMat  = getMat('gateBar', () => new THREE.MeshStandardMaterial({ color: 0x1a252f, metalness: 0.85, roughness: 0.2 }));

    // BACK wall — full width, no gate needed
    part(group, new THREE.Mesh(new THREE.BoxGeometry(compW * 2, cwH, cwT), cWallMat),
        { y: cwH / 2, z: compBz });

    // LEFT side wall — exactly from back wall centre to front wall centre
    part(group, new THREE.Mesh(new THREE.BoxGeometry(cwT, cwH, compFz - compBz), cWallMat),
        { y: cwH / 2, x: -compW, z: (compFz + compBz) / 2 });

    // RIGHT side wall
    part(group, new THREE.Mesh(new THREE.BoxGeometry(cwT, cwH, compFz - compBz), cWallMat),
        { y: cwH / 2, x:  compW, z: (compFz + compBz) / 2 });

    // FRONT wall — LEFT section (solid, from left edge to gate left post)
    const frontSecW = compW - gHW;    // = 6.2
    part(group, new THREE.Mesh(new THREE.BoxGeometry(frontSecW, cwH, cwT), cWallMat),
        { y: cwH / 2, x: -(compW + gHW) / 2, z: compFz });   // center x = -4.9

    // FRONT wall — RIGHT section
    part(group, new THREE.Mesh(new THREE.BoxGeometry(frontSecW, cwH, cwT), cWallMat),
        { y: cwH / 2, x:  (compW + gHW) / 2, z: compFz });   // center x = +4.9

    /* --- GATE design --- */
    const gatePostH = 1.7;
    // Left gate post (pillar)
    part(group, new THREE.Mesh(new THREE.BoxGeometry(0.38, gatePostH, 0.38), accentMat),
        { x: -gHW, y: gatePostH / 2, z: compFz });
    // Right gate post
    part(group, new THREE.Mesh(new THREE.BoxGeometry(0.38, gatePostH, 0.38), accentMat),
        { x:  gHW, y: gatePostH / 2, z: compFz });
    // Post caps (ball on top)
    part(group, new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), accentMat),
        { x: -gHW, y: gatePostH + 0.22, z: compFz });
    part(group, new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), accentMat),
        { x:  gHW, y: gatePostH + 0.22, z: compFz });

    // Horizontal gate bars (3 rails across the opening)
    const gateOpenW = gHW * 2 - 0.42;   // gap between inner faces of posts
    for (let bar = 0; bar < 3; bar++) {
        const by = 0.25 + bar * (gatePostH - 0.25) / 2.5;
        part(group, new THREE.Mesh(new THREE.BoxGeometry(gateOpenW, 0.07, 0.07), gBarMat),
            { x: 0, y: by, z: compFz });
    }
    // Vertical gate rods (5 rods between the posts)
    const rodH = gatePostH - 0.15;
    for (let rod = 0; rod < 5; rod++) {
        const rx = -gHW + 0.42 + rod * ((gHW * 2 - 0.84) / 4);
        part(group, new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, rodH, 8), gBarMat),
            { x: rx, y: rodH / 2 + 0.08, z: compFz });
        // decorative spear tip on each rod
        part(group, new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.22, 8), gBarMat),
            { x: rx, y: rodH + 0.08 + 0.11, z: compFz });
    }

    /* ======= GROUND PLOT ======= */
    part(group, new THREE.Mesh(new THREE.BoxGeometry(w + 7, 0.15, d + 6),
        getMat('schoolGround', () => new THREE.MeshStandardMaterial({ color: 0x7dba5a, roughness: 1 }))),
        { y: -0.075 });

    const sc = transform.scale || 1;
    if (sc !== 1) group.scale.multiplyScalar(sc);
    return addToScene(group, 'createSchool', transform);
}



/* --- Playground (index park.html srv2 style) --- */
function buildParkSwing(parent, cfg) {
    const { x = 0, y = 0, z = 0, ry = 0 } = cfg;
    const g = new THREE.Group();
    g.position.set(x, y, z); g.rotation.y = ry;
    const frameMat = getMat('swingFrame', () => new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.7 }));
    const seatMat = getMat('swingSeat', () => new THREE.MeshStandardMaterial({ color: 0xef4444 }));
    const ropeMat = getMat('swingRope', () => new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9 }));
    const postGeo = new THREE.CylinderGeometry(0.08, 0.12, 3.5, 10);
    part(g, new THREE.Mesh(postGeo, frameMat), { x: -1.5, y: 1.75, z: 0.6, rx: 0.2 });
    part(g, new THREE.Mesh(postGeo, frameMat), { x: -1.5, y: 1.75, z: -0.6, rx: -0.2 });
    part(g, new THREE.Mesh(postGeo, frameMat), { x: 1.5, y: 1.75, z: 0.6, rx: 0.2 });
    part(g, new THREE.Mesh(postGeo, frameMat), { x: 1.5, y: 1.75, z: -0.6, rx: -0.2 });
    const topBar = new THREE.CylinderGeometry(0.1, 0.1, 3.2, 10);
    part(g, new THREE.Mesh(topBar, frameMat), { y: 3.5, rz: Math.PI / 2 });
    part(g, new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.4), seatMat), { y: 1.2 });
    part(g, new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 2.2, 6), ropeMat), { x: -0.3, y: 2.4 });
    part(g, new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 2.2, 6), ropeMat), { x: 0.3, y: 2.4 });
    parent.add(g);
}

function buildParkSlide(parent, cfg) {
    const { x = 0, y = 0, z = 0, ry = 0 } = cfg;
    const g = new THREE.Group();
    g.position.set(x, y, z); g.rotation.y = ry;
    const slideMat = getMat('slideBlue', () => new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.2, metalness: 0.4 }));
    const frameMat = getMat('slideFrame', () => new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.8 }));
    part(g, new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 1.2), frameMat), { y: 2.2 });
    const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, 2.2, 0.6), new THREE.Vector3(0, 1.8, 2.5), new THREE.Vector3(0, 0.1, 4.5));
    const slideGeo = new THREE.TubeGeometry(curve, 24, 0.45, 10, false);
    const slide = new THREE.Mesh(slideGeo, slideMat);
    slide.scale.set(1.5, 0.4, 1);
    g.add(slide);
    const postGeo = new THREE.CylinderGeometry(0.06, 0.06, 2.2, 8);
    part(g, new THREE.Mesh(postGeo, frameMat), { x: -0.5, y: 1.1, z: -0.8 });
    part(g, new THREE.Mesh(postGeo, frameMat), { x: 0.5, y: 1.1, z: -0.8 });
    parent.add(g);
}

function createPlayground(transform) {

function createFootballField(transform) {
    const group = new THREE.Group();

    // 1. Generate Crisp Canvas Texture for Football Field markings
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 768;
    const ctx = canvas.getContext('2d');

    // Alternating green stripes
    const stripes = 15;
    const stripeWidth = canvas.width / stripes;
    for (let i = 0; i < stripes; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#2e7d32' : '#388e3c'; // dark vs lighter green
        ctx.fillRect(i * stripeWidth, 0, stripeWidth, canvas.height);
    }

    // White field lines
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 8;

    const marginX = 40;
    const marginY = 40;
    const fieldW = canvas.width - marginX * 2;
    const fieldH = canvas.height - marginY * 2;

    // Boundary line
    ctx.strokeRect(marginX, marginY, fieldW, fieldH);

    // Midfield line
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, marginY);
    ctx.lineTo(canvas.width / 2, canvas.height - marginY);
    ctx.stroke();

    // Center circle
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const centerRadius = 85;
    ctx.beginPath();
    ctx.arc(centerX, centerY, centerRadius, 0, Math.PI * 2);
    ctx.stroke();

    // Center spot
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
    ctx.fill();

    // Penalty Areas (both sides)
    const penaltyW = 130;
    const penaltyH = 320;
    // Left Penalty Box
    ctx.strokeRect(marginX, centerY - penaltyH / 2, penaltyW, penaltyH);
    // Right Penalty Box
    ctx.strokeRect(canvas.width - marginX - penaltyW, centerY - penaltyH / 2, penaltyW, penaltyH);

    // Goal Areas
    const goalAreaW = 45;
    const goalAreaH = 160;
    // Left Goal Area
    ctx.strokeRect(marginX, centerY - goalAreaH / 2, goalAreaW, goalAreaH);
    // Right Goal Area
    ctx.strokeRect(canvas.width - marginX - goalAreaW, centerY - goalAreaH / 2, goalAreaW, goalAreaH);

    // Penalty Spots
    const spotDist = 95;
    // Left spot
    ctx.beginPath();
    ctx.arc(marginX + spotDist, centerY, 6, 0, Math.PI * 2);
    ctx.fill();
    // Right spot
    ctx.beginPath();
    ctx.arc(canvas.width - marginX - spotDist, centerY, 6, 0, Math.PI * 2);
    ctx.fill();

    // Penalty Arcs
    // Left Arc
    ctx.beginPath();
    ctx.arc(marginX + spotDist, centerY, 75, -0.6, 0.6);
    ctx.stroke();
    // Right Arc
    ctx.beginPath();
    ctx.arc(canvas.width - marginX - spotDist, centerY, 75, Math.PI - 0.6, Math.PI + 0.6);
    ctx.stroke();

    // Corner Arcs
    const cornerRadius = 25;
    // Top-Left Corner
    ctx.beginPath();
    ctx.arc(marginX, marginY, cornerRadius, 0, Math.PI / 2);
    ctx.stroke();
    // Bottom-Left Corner
    ctx.beginPath();
    ctx.arc(marginX, canvas.height - marginY, cornerRadius, 3 * Math.PI / 2, 2 * Math.PI);
    ctx.stroke();
    // Top-Right Corner
    ctx.beginPath();
    ctx.arc(canvas.width - marginX, marginY, cornerRadius, Math.PI / 2, Math.PI);
    ctx.stroke();
    // Bottom-Right Corner
    ctx.beginPath();
    ctx.arc(canvas.width - marginX, canvas.height - marginY, cornerRadius, Math.PI, 3 * Math.PI / 2);
    ctx.stroke();

    const groundTex = new THREE.CanvasTexture(canvas);
    const fieldMat = new THREE.MeshBasicMaterial({
        map: groundTex,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2
    });

    const fieldWidth = 24;
    const fieldDepth = 16;
    const fieldHeight = 0.2;

    // Grass Field Mesh
    part(group, new THREE.Mesh(new THREE.BoxGeometry(fieldWidth, fieldHeight, fieldDepth), fieldMat), { y: fieldHeight / 2 });

    // Curb / Border around the field (Slate Grey)
    const borderMat = getMat('footballBorder', () => new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 }));
    part(group, new THREE.Mesh(new THREE.BoxGeometry(fieldWidth + 0.5, fieldHeight - 0.05, fieldDepth + 0.5), borderMat), { y: (fieldHeight - 0.05) / 2 });

    // 2. Build 3D Goals
    function buildGoal3D(isLeft) {
        const goalGroup = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const netMat = new THREE.MeshBasicMaterial({ color: 0xcccccc, wireframe: true, transparent: true, opacity: 0.15 });

        const postRadius = 0.06;
        const goalH = 1.6;
        const goalW = 3.6;
        const goalD = 1.0;

        // Vertical posts
        const postGeo = new THREE.CylinderGeometry(postRadius, postRadius, goalH, 8);
        const leftPost = new THREE.Mesh(postGeo, postMat);
        leftPost.position.set(0, goalH / 2, -goalW / 2);
        leftPost.castShadow = true;
        goalGroup.add(leftPost);

        const rightPost = new THREE.Mesh(postGeo, postMat);
        rightPost.position.set(0, goalH / 2, goalW / 2);
        rightPost.castShadow = true;
        goalGroup.add(rightPost);

        // Crossbar
        const barGeo = new THREE.CylinderGeometry(postRadius, postRadius, goalW, 8);
        const crossbar = new THREE.Mesh(barGeo, postMat);
        crossbar.rotation.x = Math.PI / 2;
        crossbar.position.set(0, goalH, 0);
        crossbar.castShadow = true;
        goalGroup.add(crossbar);

        // Support tubes running back
        const backDir = isLeft ? -1 : 1;
        const sideBarGeo = new THREE.CylinderGeometry(postRadius * 0.8, postRadius * 0.8, goalD, 8);

        const leftSideBar = new THREE.Mesh(sideBarGeo, postMat);
        leftSideBar.rotation.z = Math.PI / 2;
        leftSideBar.position.set(backDir * goalD / 2, 0.03, -goalW / 2);
        goalGroup.add(leftSideBar);

        const rightSideBar = leftSideBar.clone();
        rightSideBar.position.set(backDir * goalD / 2, 0.03, goalW / 2);
        goalGroup.add(rightSideBar);

        const topSideBarL = new THREE.Mesh(sideBarGeo, postMat);
        topSideBarL.rotation.z = Math.PI / 2;
        topSideBarL.position.set(backDir * goalD / 2, goalH, -goalW / 2);
        goalGroup.add(topSideBarL);

        const topSideBarR = topSideBarL.clone();
        topSideBarR.position.set(backDir * goalD / 2, goalH, goalW / 2);
        goalGroup.add(topSideBarR);

        // Back bars
        const backBarGeo = new THREE.CylinderGeometry(postRadius * 0.8, postRadius * 0.8, goalW, 8);
        const backBar = new THREE.Mesh(backBarGeo, postMat);
        backBar.rotation.x = Math.PI / 2;
        backBar.position.set(backDir * goalD, 0.03, 0);
        goalGroup.add(backBar);

        const backTopBar = backBar.clone();
        backTopBar.position.set(backDir * goalD, goalH, 0);
        goalGroup.add(backTopBar);

        // Net wireframe
        const netGeo = new THREE.BoxGeometry(goalD, goalH, goalW);
        const net = new THREE.Mesh(netGeo, netMat);
        net.position.set(backDir * goalD / 2, goalH / 2, 0);
        goalGroup.add(net);

        return goalGroup;
    }

    // Place left goal just inside boundary
    const leftGoal = buildGoal3D(true);
    leftGoal.position.set(-11.0, fieldHeight, 0);
    group.add(leftGoal);

    // Place right goal
    const rightGoal = buildGoal3D(false);
    rightGoal.position.set(11.0, fieldHeight, 0);
    group.add(rightGoal);

    // 3. Build Corner Flags
    function buildCornerFlag() {
        const flagGroup = new THREE.Group();
        const poleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const bannerMat = new THREE.MeshBasicMaterial({ color: 0xe74c3c }); // red

        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.2, 6), poleMat);
        pole.position.y = 0.6;
        flagGroup.add(pole);

        const flagGeo = new THREE.ConeGeometry(0.15, 0.35, 3);
        flagGeo.rotateZ(-Math.PI / 2);
        const flag = new THREE.Mesh(flagGeo, bannerMat);
        flag.position.set(0.1, 1.0, 0);
        flagGroup.add(flag);

        return flagGroup;
    }

    const boundX = 11.0;
    const boundZ = 7.1;

    const cf1 = buildCornerFlag(); cf1.position.set(-boundX, fieldHeight, -boundZ); group.add(cf1);
    const cf2 = buildCornerFlag(); cf2.position.set(-boundX, fieldHeight, boundZ); group.add(cf2);
    const cf3 = buildCornerFlag(); cf3.position.set(boundX, fieldHeight, -boundZ); group.add(cf3);
    const cf4 = buildCornerFlag(); cf4.position.set(boundX, fieldHeight, boundZ); group.add(cf4);

    // 4. Build soccer ball at center spot
    const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
    const ballGeo = new THREE.SphereGeometry(0.15, 12, 12);
    const ball = new THREE.Mesh(ballGeo, ballMat);
    ball.position.set(0, fieldHeight + 0.075, 0);
    const ballWire = new THREE.LineSegments(
        new THREE.WireframeGeometry(ballGeo),
        new THREE.LineBasicMaterial({ color: 0x111111 })
    );
    ball.add(ballWire);
    group.add(ball);

    // Scale and transform
    const s = transform.scale || 1;
    if (s !== 1) group.scale.multiplyScalar(s);

    return addToScene(group, 'createFootballField', transform);
}

/* ── UI: loader, camera presets, controls ── */
const DC_VIEWS = {
    overview:    { label: 'Overview',    pos: [35, 28, 35],  target: [0, 1, 0] },
    school:      { label: 'School',      pos: [-48, 22, -18], target: [-50, 2, -32] },
    park:        { label: 'Park',        pos: [42, 20, -32],  target: [52, 1, -45] },
    residential: { label: 'Houses',      pos: [-32, 18, -12], target: [-24, 2, -24] },
    commercial:  { label: 'Apartments',  pos: [38, 26, 52],   target: [38, 4, 58] }
};

let dcCamAnim = null;
let dcActiveView = 'overview';

function dcEase(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

function dcFlyToView(name) {
    const v = DC_VIEWS[name];
    if (!v || !camera) return;
    dcActiveView = name;
    dcCamAnim = {
        start: performance.now(),
        duration: 1100,
        fromPos: camera.position.clone(),
        fromTarget: controls.target.clone(),
        toPos: new THREE.Vector3(...v.pos),
        toTarget: new THREE.Vector3(...v.target)
    };
    document.querySelectorAll('.dc-nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === name);
    });
    dcShowStatus(v.label);
}

function dcShowStatus(text) {
    const el = document.getElementById('dc-status');
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(dcShowStatus._t);
    dcShowStatus._t = setTimeout(() => el.classList.remove('show'), 1800);
}

function dcSetLoader(pct, msg) {
    const bar = document.getElementById('dc-loader-bar');
    const txt = document.getElementById('dc-loader-text');
    if (bar) bar.style.width = pct + '%';
    if (txt && msg) txt.textContent = msg;
}

function dcHideLoader() {
    const el = document.getElementById('dc-loader');
    if (el) el.classList.add('hidden');
}

function dcInitUI() {
    document.querySelectorAll('.dc-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => dcFlyToView(btn.dataset.view));
    });

    document.getElementById('dc-btn-reset')?.addEventListener('click', () => dcFlyToView('overview'));

    document.getElementById('dc-btn-help')?.addEventListener('click', () => {
        const help = document.getElementById('dc-help');
        const btn = document.getElementById('dc-btn-help');
        help?.classList.toggle('collapsed');
        btn?.classList.toggle('active', !help?.classList.contains('collapsed'));
    });

    document.getElementById('dc-btn-fs')?.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.();
        } else {
            document.exitFullscreen?.();
        }
    });
}

function dcUpdateCamAnim() {
    if (!dcCamAnim) return;
    const t = Math.min(1, (performance.now() - dcCamAnim.start) / dcCamAnim.duration);
    const e = dcEase(t);
    camera.position.lerpVectors(dcCamAnim.fromPos, dcCamAnim.toPos, e);
    controls.target.lerpVectors(dcCamAnim.fromTarget, dcCamAnim.toTarget, e);
    if (t >= 1) dcCamAnim = null;
}


function init() {
    dcInitUI();
    dcSetLoader(15, 'Scene তৈরি হচ্ছে...');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

    dcSetLoader(35, 'Camera setup...');

    camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 300);
    camera.position.set(35, 28, 35);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
    renderer.sortObjects = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.72));
    const sun = new THREE.DirectionalLight(0xffffff, 0.82);
    sun.position.set(30, 45, 20);
    scene.add(sun);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.08;
    controls.target.set(0, 1, 0);

    dcSetLoader(55, 'City build হচ্ছে...');
    buildDreamCity();
    dcSetLoader(90, 'Almost ready...');

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    dcSetLoader(100, 'Done!');
    setTimeout(dcHideLoader, 400);

    (function loop() {
        requestAnimationFrame(loop);
        const dt = parkClock.getDelta();
        const time = parkClock.getElapsedTime();
        updateCartoonParkAnimations(dt, time);
        dcUpdateCamAnim();
        controls.update();
        renderer.render(scene, camera);
    })();
}

init();
</script>

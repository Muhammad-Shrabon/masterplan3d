<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colony City — Bangla Bosoti Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #f8fafc;
        }

        canvas {
            display: block;
        }

        /* ── Loader ── */
        #dc-loader {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #0f172a 0%, #1e3a5f 55%, #158f5c 100%);
            transition: opacity 0.55s ease, visibility 0.55s ease;
        }

        #dc-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .dc-loader-box {
            text-align: center;
            padding: 2rem;
        }

        .dc-loader-ring {
            width: 52px;
            height: 52px;
            margin: 0 auto 1.25rem;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: dc-spin 0.85s linear infinite;
        }

        @keyframes dc-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .dc-loader-box h2 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 0.35rem;
        }

        .dc-loader-box p {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.65);
        }

        .dc-loader-bar-wrap {
            width: 220px;
            height: 4px;
            margin: 1rem auto 0;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 99px;
            overflow: hidden;
        }

        .dc-loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fbbf24, #34d399);
            border-radius: 99px;
            transition: width 0.3s ease;
        }

        /* ── Header ── */
        #dc-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.92) 0%, rgba(15, 23, 42, 0.55) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            pointer-events: none;
        }

        #dc-header>* {
            pointer-events: auto;
        }

        .dc-brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .dc-brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #158f5c, #fbbf24);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 14px rgba(21, 143, 92, 0.35);
        }

        .dc-brand h1 {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .dc-brand span {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 400;
        }

        .dc-header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .dc-icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
        }

        .dc-icon-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }

        .dc-icon-btn.active {
            background: rgba(251, 191, 36, 0.2);
            border-color: #fbbf24;
            color: #fbbf24;
        }

        /* ── Camera nav ── */
        #dc-nav {
            position: fixed;
            bottom: 28px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(15, 23, 42, 0.82);
            padding: 10px 12px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            max-width: calc(100vw - 48px);
        }

        .dc-nav-label {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            padding: 0 8px 2px;
        }

        .dc-nav-btn {
            color: #fff;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.82rem;
            padding: 9px 16px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s, transform 0.15s;
        }

        .dc-nav-btn svg {
            flex-shrink: 0;
            opacity: 0.85;
        }

        .dc-nav-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .dc-nav-btn.active {
            background: #fbbf24 !important;
            color: #158f5c !important;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.35);
        }

        /* ── Help panel ── */
        #dc-help {
            position: fixed;
            bottom: 28px;
            left: 24px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 0.85rem 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 240px;
            transition: opacity 0.3s, transform 0.3s;
        }

        #dc-help.collapsed {
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }

        #dc-help h3 {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #fbbf24;
            margin-bottom: 0.55rem;
        }

        #dc-help ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        #dc-help li {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.72);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #dc-help kbd {
            display: inline-block;
            min-width: 22px;
            text-align: center;
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.68rem;
            font-family: inherit;
            color: #fff;
        }

        /* ── Status chip ── */
        #dc-status {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(251, 191, 36, 0.35);
            color: #fbbf24;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.4rem 1rem;
            border-radius: 99px;
            opacity: 0;
            transition: opacity 0.35s;
            backdrop-filter: blur(8px);
        }

        #dc-status.show {
            opacity: 1;
        }

        @media (max-width: 640px) {
            #dc-header {
                padding: 0.6rem 0.85rem;
            }

            .dc-brand h1 {
                font-size: 0.92rem;
            }

            #dc-help {
                bottom: auto;
                top: 64px;
                left: 12px;
                max-width: 200px;
                padding: 0.65rem 0.8rem;
            }

            #dc-nav {
                bottom: 16px;
                right: 12px;
                left: 12px;
                flex-direction: row;
                flex-wrap: wrap;
                border-radius: 14px;
            }

            .dc-nav-label {
                width: 100%;
            }

            .dc-nav-btn {
                flex: 1 1 auto;
                justify-content: center;
                font-size: 0.75rem;
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
    <script src="cartoon-park.js"></script>
    <script>
        /* ================================================================
           DREAM CITY — index.html style + modular architecture
           addToScene() → createRoad / Tree / Shop / School / Playground /
                          Park / Helipad / PumpStation / FoodVenues / Building / DuplexHouse → buildDreamCity()
        ================================================================ */

        const HS = 0.015; // same house scale as index.html
        let scene, camera, renderer, controls;
        const parkClock = new THREE.Clock();
        function updateCartoonParkAnimations() { /* no park in scene */ }

        const geoCache = {};
        const matCache = {};
        function getGeo(key, fn) { if (!geoCache[key]) geoCache[key] = fn(); return geoCache[key]; }
        function getMat(key, fn) { if (!matCache[key]) matCache[key] = fn(); return matCache[key]; }
        function ch_colorMat(color, roughness = 0.5, metalness = 0) {
            const key = `ch_c_${color}_${roughness}_${metalness}`;
            return getMat(key, () => new THREE.MeshStandardMaterial({ color, roughness, metalness }));
        }
        function ch_borderMat(color) {
            return getMat(`ch_b_${color}`, () => new THREE.MeshStandardMaterial({ color }));
        }

        const customHouseTemplateCache = new Map();
        const customHouseBakedCache = new Map();
        const customHouseBunchQueue = [];

        function getCustomHouseTemplate(style) {
            const key = JSON.stringify(style);
            if (!customHouseTemplateCache.has(key)) {
                const group = style.twin
                    ? buildCustomTwinHouseGroup(style)
                    : buildCustomHouseGroup(style);
                customHouseTemplateCache.set(key, group);
            }
            return customHouseTemplateCache.get(key);
        }
        function getCustomHouseBakedParts(style) {
            const key = JSON.stringify(style);
            if (!customHouseBakedCache.has(key)) {
                const template = getCustomHouseTemplate(style);
                const plotNode = template.getObjectByName('ch_plot');
                const buildingNode = template.getObjectByName('ch_buildings');
                const plotParts = [];
                const buildingParts = [];
                template.updateMatrixWorld(true);
                const inv = new THREE.Matrix4().copy(template.matrixWorld).invert();
                template.traverse(obj => {
                    if (!obj.isMesh) return;
                    let isPlot = false;
                    let node = obj;
                    while (node && node !== template) {
                        if (node === plotNode) { isPlot = true; break; }
                        if (node === buildingNode) break;
                        node = node.parent;
                    }
                    const geo = obj.geometry.clone();
                    geo.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, obj.matrixWorld));
                    const part = { geometry: geo, material: obj.material };
                    if (isPlot) plotParts.push(part);
                    else buildingParts.push(part);
                });
                customHouseBakedCache.set(key, { plot: plotParts, building: buildingParts });
            }
            return customHouseBakedCache.get(key);
        }
        function ch_bakeMeshesFromGroup(root) {
            root.updateMatrixWorld(true);
            const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
            const parts = [];
            root.traverse(obj => {
                if (!obj.isMesh) return;
                const geo = obj.geometry.clone();
                geo.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, obj.matrixWorld));
                parts.push({ geometry: geo, material: obj.material });
            });
            return parts;
        }
        function ch_placeInstancedHouses(bakedParts, placements, scale, parent, applyHouseOffset = false) {
            if (!placements.length || !bakedParts.length) return;
            const dummy = new THREE.Object3D();
            const _box = new THREE.Box3();
            const _partBox = new THREE.Box3();
            const _sphere = new THREE.Sphere();

            bakedParts.forEach(({ geometry, material }) => {
                const inst = new THREE.InstancedMesh(geometry, material, placements.length);
                if (!geometry.boundingBox) geometry.computeBoundingBox();

                _box.makeEmpty();
                placements.forEach((p, i) => {
                    const instanceScale = p.scale ?? scale;
                    dummy.position.set(p.x, p.y, p.z);
                    dummy.rotation.set(0, p.rotateY, 0);
                    dummy.scale.setScalar(instanceScale);
                    if (applyHouseOffset) {
                        dummy.translateX(p.houseOffsetX ?? 0);
                        dummy.translateZ(p.houseOffsetZ ?? 0);
                    }
                    dummy.updateMatrix();
                    inst.setMatrixAt(i, dummy.matrix);
                    _partBox.copy(geometry.boundingBox).applyMatrix4(dummy.matrix);
                    _box.union(_partBox);
                });
                inst.instanceMatrix.needsUpdate = true;

                _box.getBoundingSphere(_sphere);
                _sphere.radius *= 1.05;
                inst.boundingSphere = _sphere.clone();
                inst.frustumCulled = false;
                parent.add(inst);
            });
        }
        function ch_placeInstancedBunchLayers(baked, placements, scale, parent) {
            if (Array.isArray(baked)) {
                ch_placeInstancedHouses(baked, placements, scale, parent, false);
                return;
            }
            ch_placeInstancedHouses(baked.plot, placements, scale, parent, false);
            ch_placeInstancedHouses(baked.building, placements, scale, parent, true);
        }
        function flushCustomHouseBunchQueue() {
            if (!customHouseBunchQueue.length || !scene) return;

            customHouseBunchQueue.forEach(item => {
                const bakedParts = getCustomHouseBakedParts(item.templateStyle);
                const root = new THREE.Group();
                root.name = item.label;
                ch_placeInstancedBunchLayers(bakedParts, item.placements, item.scale, root);
                ch_placeHouseDoorNumbers(item.placements, root, {
                    twin: !!item.templateStyle.twin
                });
                scene.add(root);
            });
            customHouseBunchQueue.length = 0;
        }

        /* --- index.html shared look --- */
        const INDEX = {
            grass: 0x86eeaa,
            plotLand: 0x101010,
            asphalt: 0x222222,
            body: 0xe8e4d9,
            roof: 0x4a5058,
            wall: 0xeeeeee,
            win: 0xadd8e6,
            gate: 0x111111,
            glass: 0x88ccff,
            beam: 0xFAF9F6,
            floorYellow: 0xE8E6E1,
            wallCream: 0xD8D2C4,
            trunk: 0x8D6E63,
            leaf: 0x388E3C,
            // Custom architectural house palette
            houseLand: 0x86eeaa,
            houseLandBorder: 0x374951,
            houseRoof: 0x4a5058,
            houseWall: 0xD8D2C4,
            houseFloor: 0xE8E6E1,
            houseBeam: 0xFAF9F6,
            houseGable: 0xD8D2C4,
            houseDoor: 0x4d2a1a,
            houseDoorBorder: 0x4d2a1a,
            houseDoorHandle: 0xffd700,
            houseWindow: 0xadd8e6,
            houseWindowBorder: 0x1e293b,
            houseGlass: 0x88ccff,
            houseStair: 0xeeeeee,
            houseWood: 0x5d4037,
        };

        function part(parent, mesh, cfg = {}) {
            const { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0 } = cfg;
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);
            if (parent) parent.add(mesh);
            return mesh;
        }

        function createStoneTexture() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#6a737b';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 300; i++) {
                const g = 90 + Math.random() * 40;
                ctx.fillStyle = `rgb(${g},${g},${g})`;
                ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
            }
            return new THREE.CanvasTexture(c);
        }

        function createMarkingsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 512, 1024);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 12;
            ctx.setLineDash([60, 60]);
            ctx.beginPath(); ctx.moveTo(256, 0); ctx.lineTo(256, 1024); ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 8;
            ctx.strokeRect(15, -10, 2, 1044);
            ctx.strokeRect(495, -10, 2, 1044);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createRoadGeometry(curve, width, segments) {
            const points = curve.getSpacedPoints(segments);
            const vertices = [], uvs = [], indices = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const p = points[i];
                const tangent = curve.getTangentAt(t).normalize();
                const binormal = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 1, 0)).normalize();
                const pL = p.clone().add(binormal.clone().multiplyScalar(width / 2));
                const pR = p.clone().add(binormal.clone().multiplyScalar(-width / 2));
                vertices.push(pL.x, 0, pL.z, pR.x, 0, pR.z);
                const dist = t * curve.getLength();
                uvs.push(0, dist / 20, 1, dist / 20);
                if (i < segments) {
                    const idx = i * 2;
                    indices.push(idx, idx + 2, idx + 1, idx + 1, idx + 2, idx + 3);
                }
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        /** Map face/facing/direction to Y rotation (building front faces +Z by default) */
        function resolveFaceRotation(transform = {}) {
            const face = transform.face ?? transform.facing ?? transform.direction ?? transform.orient;
            if (face == null) return transform;

            const faceMap = {
                front: 0,
                back: Math.PI,
                left: Math.PI / 2,
                right: -Math.PI / 2,
                north: 0,
                south: Math.PI,
                west: Math.PI / 2,
                east: -Math.PI / 2
            };
            const key = String(face).toLowerCase();
            if (!Object.prototype.hasOwnProperty.call(faceMap, key)) return transform;

            const offset = transform.rotateOffset ?? transform.faceOffset ?? transform.rotOffset ?? 0;
            const rotY = faceMap[key] + offset;
            return { ...transform, rotateY: rotY, rotY };
        }

        /** BASE FUNCTION — position + rotation (rotX/rotY/rotZ or rotateX/rotateY/rotateZ, face: front|back|left|right) */
        function addToScene(object, creatorName, transform = {}) {
            const resolved = resolveFaceRotation(transform);
            const { x = 0, y = 0, z = 0 } = resolved;
            const rotX = resolved.rotX ?? resolved.rotateX ?? 0;
            const rotY = resolved.rotY ?? resolved.rotateY ?? 0;
            const rotZ = resolved.rotZ ?? resolved.rotateZ ?? 0;
            object.position.set(x, y, z);
            object.rotation.set(rotX, rotY, rotZ);
            scene.add(object);
            return object;
        }

        /* --- index.html createTree --- */
        function buildStdTree() {

        /* --- index.html road (asphalt + dashed markings)
           transform: x, y, z, length, width, segments, points, scale,

        function createRoad(transform) {

        /* --- index.html standard house core (simplified createHouse) --- */
        function buildHouseCore(options = {}) {
            const plotW = options.plotW || 500;
            const plotD = options.plotD || 600;
            const houseWidth = options.houseWidth || 220;
            const houseDepth = options.houseDepth || 280;
            const floorH = options.floorH || 100;
            const hasWing = options.hasWing !== false;
            const wingLen = Math.max(260, houseWidth * 0.8);
            const wingW = Math.max(100, houseWidth * 0.45);

            const house = new THREE.Group();
            house.scale.set(HS, HS, HS);

            const bodyMat = getMat('houseBody', () => new THREE.MeshStandardMaterial({ color: INDEX.body, roughness: 0.8 }));
            const roofMat = getMat('houseRoof', () => new THREE.MeshStandardMaterial({ color: INDEX.roof, roughness: 0.7 }));
            const winMat = getMat('houseWin', () => new THREE.MeshStandardMaterial({ color: INDEX.win, emissive: 0x111111 }));
            const beamMat = getMat('houseBeam', () => new THREE.MeshStandardMaterial({ color: INDEX.beam, roughness: 0.5 }));
            const porchMat = getMat('housePorch', () => new THREE.MeshStandardMaterial({ color: INDEX.beam }));


            const building = new THREE.Group();
            house.add(building);

            // Body + wing
            const bodyGeos = [];
            const mbG = new THREE.BoxGeometry(houseWidth, floorH * 2, houseDepth); mbG.translate(0, floorH, 0); bodyGeos.push(mbG);
            if (hasWing) {
                const wbG = new THREE.BoxGeometry(wingLen, floorH * 2, wingW);
                wbG.translate(-(houseWidth / 2 + wingLen / 2), floorH, houseDepth / 2 - wingW / 2);
                bodyGeos.push(wbG);
            }
            building.add(new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(bodyGeos), bodyMat));

            // Stone base
            const stoneMat = getMat('houseStone', () => {
                const m = new THREE.MeshStandardMaterial({ roughness: 1.0 });
                m.map = createStoneTexture();
                return m;
            });
            const stoneGeo = new THREE.BoxGeometry(houseWidth + 60, 4, houseDepth + 60);
            part(building, new THREE.Mesh(stoneGeo, stoneMat), { y: 2 });

            // Roof
            const roofGeo = new THREE.BoxGeometry(houseWidth + 20, 20, houseDepth + 20);
            part(building, new THREE.Mesh(roofGeo, roofMat), { y: floorH * 2 + 10 });

            // Porch
            const porchGeo = new THREE.BoxGeometry(houseWidth - 20, 10, 80);
            const p1 = porchGeo.clone(); p1.translate(0, 5, -(houseDepth / 2 + 40));
            const p2 = porchGeo.clone(); p2.translate(0, floorH + 5, -(houseDepth / 2 + 40));
            building.add(new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries([p1, p2]), porchMat));

            // Door
            const doorMat = getMat('doorWood', () => new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
            part(building, new THREE.Mesh(new THREE.BoxGeometry(45, 75, 5), doorMat), { y: 37.5, z: -(houseDepth / 2 + 2) });

            // Windows
            const w1 = new THREE.PlaneGeometry(40, 50); w1.translate(-houseWidth / 4, floorH + 45, houseDepth / 2 + 1);
            const w2 = new THREE.PlaneGeometry(40, 50); w2.translate(houseWidth / 4, floorH + 45, houseDepth / 2 + 1);
            building.add(new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries([w1, w2]), winMat));

            // Plot land — বড় করা হলো, wall নেই তাই land দিয়েই plot বোঝা যাবে
            const landGeo = new THREE.BoxGeometry(plotW * 1.05, 4, plotD * 1.05);
            const landMat = getMat('plotLand', () => new THREE.MeshStandardMaterial({
                color: INDEX.plotLand, roughness: 0.9,
                polygonOffset: true, polygonOffsetFactor: 3, polygonOffsetUnits: 3
            }));
            part(house, new THREE.Mesh(landGeo, landMat), { y: -2 });

            return house;
        }

        function createBuilding(transform) {
            const g = buildHouseCore({
                plotW: transform.plotW || 500,

        function buildDuplexType1Group(transform = {}) {

        /* --- Custom Architectural House (imported and refactored from customeHouse.html) --- */

        function ch_finalizeMesh(mesh, parent, config) {
            const { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0 } = config;
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);

        function ch_createWindow(parent, config, borderColor, borderWidth) {
            const { w = 1.5, h = 1.5 } = config;

            createPart(w + borderT * 2, borderT, 0, -h / 2 - borderT / 2);

        function ch_createDoor(parent, config, borderColor, borderWidth) {
            const { w = 1.2, h = 2.2, isOpen = false } = config;
            const borderT = borderWidth ?? config.borderT ?? 0.15;
            const borderCol = borderColor ?? config.borderColor ?? 0x222222;
            const group = new THREE.Group();

            const doorGroup = new THREE.Group();
            const doorMat = ch_colorMat(INDEX.houseDoor);
            const doorBody = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.1), doorMat);
            doorBody.position.set(w / 2, h / 2, 0);
            doorGroup.add(doorBody);

            const handle = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), handleMat);
            handle.position.set(w - 0.2, h / 2, 0.1);
            doorGroup.add(handle);

            const handleBack = handle.clone();
            handleBack.position.z = -0.1;
            doorGroup.add(handleBack);

            doorGroup.position.x = -w / 2;

            };
            createFrame(w + borderT * 2, borderT, 0, h + borderT / 2);
            createFrame(borderT, h + borderT, -w / 2 - borderT / 2, h / 2);

        function ch_createBeamSet(parent, config) {
            const { w = 0.3, h = 4, dist = 5, isCircle = false, count = 4 } = config;
            const group = new THREE.Group();
            const mat = ch_colorMat(INDEX.houseBeam);

            let positions = [];
            if (count === 4) {
                positions = [{ px: -dist / 2, pz: -dist / 2 }, { px: dist / 2, pz: -dist / 2 }, { px: -dist / 2, pz: dist / 2 }, { px: dist / 2, pz: dist / 2 }];
            } else {
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    positions.push({
                        px: Math.cos(angle) * (dist / 2),
                        pz: Math.sin(angle) * (dist / 2)
                    });
                }
            }

            positions.forEach(pos => {
                const geo = isCircle ? new THREE.CylinderGeometry(w / 2, w / 2, h, 16) : new THREE.BoxGeometry(w, h, w);
                const beam = new THREE.Mesh(geo, mat);
                beam.position.set(pos.px, h / 2, pos.pz);
                beam.castShadow = true;
                group.add(beam);
            });

            return ch_finalizeMesh(group, parent, config);
        }

        function ch_createBalcony(parent, config) {
            const { w = 4, d = 1.5, hasLeftRail = true, hasRightRail = true, simple = false } = config;
            const group = new THREE.Group();
            const woodMat = ch_colorMat(0x5d4037);
            const base = new THREE.Mesh(new THREE.BoxGeometry(w, 0.15, d), woodMat);

            if (simple) {
                const rail = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, 0.08), woodMat);
                rail.position.set(0, 0.6, d / 2);
                group.add(rail);
                return ch_finalizeMesh(group, parent, config);
            }

            const frontBarCount = Math.ceil(w * 3);
            for (let i = 0; i <= frontBarCount; i++) {
                const bar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.05), woodMat);
                bar.position.set((-w / 2) + (i * w / frontBarCount), 0.5, d / 2);
                group.add(bar);
            }
            const rail = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, 0.08), woodMat);
            rail.position.set(0, 1, d / 2);
            group.add(rail);

            if (hasLeftRail) {
                const sideBarCount = Math.ceil(d * 3);
                for (let i = 0; i <= sideBarCount; i++) {
                    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.05), woodMat);
                    bar.position.set(-w / 2, 0.5, (-d / 2) + (i * d / sideBarCount));
                    group.add(bar);
                }
                const sideRail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, d), woodMat);
                sideRail.position.set(-w / 2, 1, 0);
                group.add(sideRail);
            }

            if (hasRightRail) {
                const sideBarCount = Math.ceil(d * 3);
                for (let i = 0; i <= sideBarCount; i++) {
                    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.05), woodMat);
                    bar.position.set(w / 2, 0.5, (-d / 2) + (i * d / sideBarCount));
                    group.add(bar);
                }
                const sideRail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, d), woodMat);
                sideRail.position.set(w / 2, 1, 0);
                group.add(sideRail);
            }

            return ch_finalizeMesh(group, parent, config);

        function ch_createRoof(parent, config) {
            const { w = 6, d = 8, style = 'pitched', color = INDEX.houseRoof, simple = false } = config;
            const group = new THREE.Group();
            const roofMat = ch_colorMat(color, 0.5, 0.3);
            if (style === 'pitched') {
                const createS = (rz, ox) => {

                    const b = new THREE.Mesh(new THREE.BoxGeometry(w / 2 + 0.5, 0.1, d), roofMat);
                    s.add(b);
                    if (!simple) {
                        for (let i = 0; i < 20; i++) {
                            const r = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, d), roofMat);
                            r.position.set((-w / 4) + (i * w / 38), 0.05, 0);
                            s.add(r);
                        }
                    }
                    s.rotation.z = rz;
                    s.position.x = ox;
                    return s;
                };

                group.add(createS(-Math.PI / 6, w / 4));

        function ch_createGable(parent, config) {

        function ch_createStairs(parent, config) {
            const { steps = 3, w = 1.5, stepH = 0.17, stepD = 0.4, color = INDEX.houseStair, simple = false } = config;
            const group = new THREE.Group();
            const mat = ch_colorMat(color);
            const railMat = getMat('ch_rail', () => new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.1 }));

            for (let i = 0; i < steps; i++) {
                const step = new THREE.Mesh(new THREE.BoxGeometry(w, stepH, stepD), mat);
                step.position.set(0, (i * stepH) + stepH / 2, i * stepD);
                step.castShadow = true;
                step.receiveShadow = true;
                group.add(step);
            }

            if (simple) return ch_finalizeMesh(group, parent, config);

            const railHeight = 0.8;
            const railT = 0.03;

            [-1, 1].forEach(side => {
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3((w / 2 - 0.05) * side, railHeight, -stepD / 2),
                    new THREE.Vector3((w / 2 - 0.05) * side, (steps - 1) * stepH + railHeight, (steps - 1) * stepD + stepD / 2)
                ]);
                const railGeo = new THREE.TubeGeometry(curve, 20, railT, 8, false);
                const rail = new THREE.Mesh(railGeo, railMat);
                group.add(rail);

                for (let i = 0; i < steps; i += 2) {
                    const h = railHeight + (i * stepH);
                    const post = new THREE.Mesh(new THREE.CylinderGeometry(railT, railT, h), railMat);
                    post.position.set((w / 2 - 0.05) * side, h / 2, i * stepD);
                    group.add(post);
                }
            });

            return ch_finalizeMesh(group, parent, config);
        }

        function ch_createWallVine(parent, config) {
            const { h = 2, w = 1.5, depth = 0.3, leafColor = 0x2d5a27, stemColor = 0x4d2a1a } = config;
            const group = new THREE.Group();

            const leafMat = ch_colorMat(leafColor, 0.8);
            const stemMat = ch_colorMat(stemColor, 0.9);

            const vineCount = 6;
            for (let i = 0; i < vineCount; i++) {
                const startX = (Math.random() - 0.5) * w;
                const startZ = (Math.random() - 0.5) * depth;

                const points = [];
                const segments = 8;
                for (let j = 0; j <= segments; j++) {
                    const ratio = j / segments;
                    points.push(new THREE.Vector3(
                        startX + Math.sin(ratio * Math.PI * 2 + i) * 0.2,
                        -(ratio * h),
                        startZ + Math.cos(ratio * Math.PI * 2 + i) * 0.2
                    ));
                }

                const curve = new THREE.CatmullRomCurve3(points);
                const stemGeo = new THREE.TubeGeometry(curve, 20, 0.02, 8, false);
                const stem = new THREE.Mesh(stemGeo, stemMat);
                group.add(stem);

                const leafDensity = 15;
                for (let k = 0; k < leafDensity; k++) {
                    const t = k / (leafDensity - 1);
                    const pos = curve.getPoint(t);
                    const tangent = curve.getTangent(t);

                    const leafSize = 0.15 + Math.random() * 0.1;
                    const leafThickness = 0.02;
                    const leafGeo = new THREE.CylinderGeometry(leafSize, leafSize, leafThickness, 3);
                    const leaf = new THREE.Mesh(leafGeo, leafMat);

                    leaf.position.copy(pos);
                    leaf.lookAt(pos.clone().add(tangent));
                    leaf.rotateX(Math.PI / 2);
                    leaf.rotateZ(Math.random() * Math.PI);

                    group.add(leaf);
                }
            }

            return ch_finalizeMesh(group, parent, config);
        }

        function ch_createWoodGril(parent, config) {
            const {
                w = 4, h = 1.1, spacing = 0.15, thickness = 0.04, slatW = 0.04, color = 0x5d4037,
                startPost = true, midPost = false, endPost = false
            } = config;
            const group = new THREE.Group();
            const mat = ch_colorMat(color, 0.6, 0.3);

            const railH = 0.05;
            const postW = 0.18;

            const railGeo = new THREE.BoxGeometry(w, railH, thickness * 1.5);
            const topRail = new THREE.Mesh(railGeo, mat);
            topRail.position.y = h - railH / 2;
            group.add(topRail);

            const bottomRail = new THREE.Mesh(railGeo, mat);
            bottomRail.position.y = railH / 2 + 0.05;
            group.add(bottomRail);

            const picketH = h - railH * 2 - 0.05;
            const count = Math.floor(w / (slatW + spacing));
            const startX = -w / 2 + (w - (count * (slatW + spacing))) / 2 + slatW / 2;

            for (let i = 0; i < count; i++) {
                const px = startX + i * (slatW + spacing);
                if (midPost && Math.abs(px) < postW / 2) continue;

                const picket = new THREE.Mesh(new THREE.BoxGeometry(slatW, picketH, thickness), mat);
                picket.position.set(px, h / 2 + 0.025, 0);
                group.add(picket);
            }

            const addPost = (px) => {
                const postH = h + 0.1;
                const postRect = new THREE.Mesh(new THREE.BoxGeometry(postW, postH, postW), mat);
                postRect.position.set(px, postH / 2, 0);
                group.add(postRect);

                const cap = new THREE.Mesh(new THREE.BoxGeometry(postW * 1.3, 0.05, postW * 1.3), mat);
                cap.position.set(px, postH + 0.02, 0);
                group.add(cap);

                const base = new THREE.Mesh(new THREE.BoxGeometry(postW * 1.3, 0.08, postW * 1.3), mat);
                base.position.set(px, 0.04, 0);
                group.add(base);
            };

            if (startPost) addPost(-w / 2 - postW / 2);
            if (midPost) addPost(0);
            if (endPost) addPost(w / 2 + postW / 2);

            return ch_finalizeMesh(group, parent, config);
        }

        function ch_createBed(parent, config) {
            const { w = 2, d = 2.5, h = 0.6 } = config;
            const group = new THREE.Group();
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, d), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
            frame.position.y = 0.2;
            group.add(frame);
            const mattress = new THREE.Mesh(new THREE.BoxGeometry(w - 0.1, 0.3, d - 0.1), new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
            mattress.position.y = 0.45;
            group.add(mattress);
            const pillowGeo = new THREE.BoxGeometry(w / 2.5, 0.1, 0.6);
            const pillowMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const p1 = new THREE.Mesh(pillowGeo, pillowMat);
            p1.position.set(-w / 4, 0.6, -d / 2 + 0.5);
            group.add(p1);
            const p2 = p1.clone();
            p2.position.x = w / 4;
            group.add(p2);

            return ch_finalizeMesh(group, parent, config);
        }

        function ch_createTable(parent, config) {
            const { w = 1.2, d = 0.8, h = 0.75 } = config;
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x4d2a1a });
            const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, d), mat);
            top.position.y = h;
            group.add(top);
            const legGeo = new THREE.BoxGeometry(0.08, h, 0.08);
            const createLeg = (lx, lz) => {
                const leg = new THREE.Mesh(legGeo, mat);
                leg.position.set(lx, h / 2, lz);
                group.add(leg);
            };
            createLeg(-w / 2 + 0.1, -d / 2 + 0.1);
            createLeg(w / 2 - 0.1, -d / 2 + 0.1);
            createLeg(-w / 2 + 0.1, d / 2 - 0.1);
            createLeg(w / 2 - 0.1, d / 2 - 0.1);

            return ch_finalizeMesh(group, parent, config);
        }

        function ch_createChair(parent, config) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x4d2a1a });
            const seat = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.5), mat);
            seat.position.y = 0.45;
            group.add(seat);
            const back = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.05), mat);
            back.position.set(0, 0.75, -0.22);
            group.add(back);
            const legGeo = new THREE.BoxGeometry(0.05, 0.45, 0.05);
            for (let x = -1; x <= 1; x += 2) {
                for (let z = -1; z <= 1; z += 2) {
                    const leg = new THREE.Mesh(legGeo, mat);
                    leg.position.set(x * 0.2, 0.225, z * 0.2);
                    group.add(leg);
                }
            }
            return ch_finalizeMesh(group, parent, config);
        }

        function ch_createTV(parent, config) {
            const { w = 1.2, h = 0.7 } = config;
            const group = new THREE.Group();
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            group.add(frame);
            const screen = new THREE.Mesh(new THREE.BoxGeometry(w * 0.95, h * 0.9, 0.01), new THREE.MeshStandardMaterial({
                color: 0x333333,
                emissive: 0x112233,
                roughness: 0
            }));
            screen.position.z = 0.03;
            group.add(screen);
            const stand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.3), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            stand.position.y = -h / 2 - 0.05;
            group.add(stand);

            return ch_finalizeMesh(group, parent, config);
        }

        function ch_createLight(parent, config) {
            const group = new THREE.Group();
            const bulbGeo = new THREE.SphereGeometry(0.1, 16, 16);
            const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffaa });
            const bulb = new THREE.Mesh(bulbGeo, bulbMat);
            group.add(bulb);

            const pLight = new THREE.PointLight(0xffffaa, 1, 10);
            pLight.position.set(0, -0.2, 0);
            pLight.castShadow = true;
            group.add(pLight);

            return ch_finalizeMesh(group, parent, config);
        }

        function ch_createPergola(parent, config) {
            const { w = 4, d = 4, spacing = 0.25, slatW = 0.08, thickness = 0.04, color = 0x5d4037 } = config;
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color });

            const count = Math.floor(d / (slatW + spacing));
            for (let i = 0; i <= count; i++) {
                const slat = new THREE.Mesh(new THREE.BoxGeometry(w, thickness, slatW), mat);
                slat.position.z = -d / 2 + i * (slatW + spacing);
                group.add(slat);
            }

            const beamCount = 3;
            for (let i = 0; i < beamCount; i++) {
                const beam = new THREE.Mesh(new THREE.BoxGeometry(slatW * 1.5, thickness * 2, d), mat);
                beam.position.x = -w / 2 + (i * w / (beamCount - 1));
                beam.position.y = -thickness;
                group.add(beam);
            }

            return ch_finalizeMesh(group, parent, config);
        }

        function ch_zFlip(cfg) {
            const c = { ...cfg };
            if (c.z != null) c.z = -c.z;
            return c;
        }

        function ch_resolveHouseStyle(style = {}) {
            const baseBorderColor = style.borderColor ?? INDEX.houseLandBorder;
            const baseBorderWidth = style.borderWidth ?? 0.15;
            return {
                lite: style.lite === true,
                skipHeavy: style.lite === true && !style.fullDetail,
                landBorderColor: style.landBorderColor ?? baseBorderColor,
                landBorderWidth: style.landBorderWidth ?? baseBorderWidth,
                windowBorderColor: style.windowBorderColor ?? INDEX.houseWindowBorder,
                windowBorderWidth: style.windowBorderWidth ?? baseBorderWidth,
                doorBorderColor: style.doorBorderColor ?? INDEX.houseDoorBorder,
                doorBorderWidth: style.doorBorderWidth ?? baseBorderWidth,
                plotW: style.plotW ?? 12,
                plotD: style.plotD ?? 15,
                plotColor: style.plotColor ?? INDEX.houseLand,
                wallColor: style.wallColor ?? INDEX.houseWall,
                floorColor: style.floorColor ?? INDEX.houseFloor,
                roofColor: style.roofColor ?? INDEX.houseRoof,
                gableColor: style.gableColor ?? INDEX.houseGable
            };
        }

        function buildCustomHousePlot(parent, style = {}) {
            const s = ch_resolveHouseStyle(style);
            const landGeo = getGeo(`ch_plot_${s.plotW}_${s.plotD}`, () => new THREE.BoxGeometry(s.plotW, 0.1, s.plotD));
            const landMesh = new THREE.Mesh(landGeo, ch_colorMat(s.plotColor, 0.9));
            landMesh.position.set(0, 0, -2);
            parent.add(landMesh);

            const borderMat = ch_borderMat(s.landBorderColor);
            const borderH = 0.25;
            const fw = s.plotW + s.landBorderWidth * 2;
            part(parent, new THREE.Mesh(new THREE.BoxGeometry(fw, borderH, s.landBorderWidth), borderMat), {
                y: borderH / 2, z: -2 + s.plotD / 2 + s.landBorderWidth / 2
            });
            part(parent, new THREE.Mesh(new THREE.BoxGeometry(fw, borderH, s.landBorderWidth), borderMat), {
                y: borderH / 2, z: -2 - s.plotD / 2 - s.landBorderWidth / 2
            });
            part(parent, new THREE.Mesh(new THREE.BoxGeometry(s.landBorderWidth, borderH, s.plotD), borderMat), {
                y: borderH / 2, x: -s.plotW / 2 - s.landBorderWidth / 2, z: -2
            });
            part(parent, new THREE.Mesh(new THREE.BoxGeometry(s.landBorderWidth, borderH, s.plotD), borderMat), {
                y: borderH / 2, x: s.plotW / 2 + s.landBorderWidth / 2, z: -2
            });
        }

        /** Core house body — customeHouseTwins buildMainHouse equivalent */
        function buildCustomMainHouse(parent, style = {}) {
            const s = ch_resolveHouseStyle(style);
            const { skipHeavy, doorBorderColor, doorBorderWidth, windowBorderColor, windowBorderWidth, wallColor, floorColor, roofColor, gableColor } = s;

            ch_createWall(parent, { x: 0, y: 0, z: -3, w: 6, h: 4, color: wallColor });
            ch_createWall(parent, { x: -3, z: 0, w: 6, h: 4, ry: Math.PI / 2, color: wallColor });
            ch_createWall(parent, { x: 0, z: 3, w: 6, h: 4, color: wallColor });
            ch_createDoor(parent, { x: 3.2, y: 0.5, z: 0, w: 1.2, h: 2.2, ry: Math.PI / 2, isOpen: false }, doorBorderColor, doorBorderWidth);

            ch_createWall(parent, { x: 0, y: 4, z: -3, w: 6, h: 4, color: wallColor });
            ch_createWall(parent, { x: 0, z: 3, y: 4, w: 6, h: 4, color: wallColor });
            ch_createFloor(parent, { x: 0, y: 4, z: -2, w: 11, d: 6.5, color: floorColor, ry: Math.PI / 2 });

            if (!skipHeavy) {

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cartoon Park Model</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for cute UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Loading Overlay */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #8ce2f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ff5e7e;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-100">

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner mb-4"></div>
        <h1 class="text-3xl font-bold text-white tracking-wide">Building Cartoon Park...</h1>
        <p class="text-white opacity-80 mt-2">Loading interactive 3D elements</p>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Interactive UI Overlays -->
    <div class="absolute top-4 left-4 z-10 flex flex-col gap-3 max-w-sm">
        <!-- Main Title Card -->
        <div class="bg-white/90 backdrop-blur-md p-4 rounded-2xl shadow-xl border border-white/20">
            <h1 class="text-2xl font-black text-slate-800 flex items-center gap-2">
                <span class="text-amber-500"><i class="fa-solid fa-cloud-sun"></i></span>
                Cartoon Park 3D
            </h1>
            <p class="text-xs text-slate-500 mt-1 font-medium">Explore the low-poly children's park modeled with Three.js. Left click to rotate, right click to pan, scroll to zoom.</p>
        </div>

        <!-- Camera Views Selector -->
        <div class="bg-white/90 backdrop-blur-md p-3 rounded-2xl shadow-xl border border-white/20">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Camera Presets</span>
            <div class="grid grid-cols-3 gap-1">
                <button onclick="setCameraView('bird')" class="px-2 py-1.5 bg-sky-100 hover:bg-sky-200 text-sky-800 text-xs font-bold rounded-lg transition-colors flex flex-col items-center gap-1">
                    <i class="fa-solid fa-eye"></i> Bird's Eye
                </button>
                <button onclick="setCameraView('entrance')" class="px-2 py-1.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-xs font-bold rounded-lg transition-colors flex flex-col items-center gap-1">
                    <i class="fa-solid fa-door-open"></i> Entrance
                </button>
                <button onclick="setCameraView('ferris')" class="px-2 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold rounded-lg transition-colors flex flex-col items-center gap-1">
                    <i class="fa-solid fa-circle-notch"></i> Wheel
                </button>
            </div>
        </div>
    </div>

    <!-- Right Controls Panel -->
    <div class="absolute top-4 right-4 z-10 flex flex-col gap-3">
        <!-- Quick Actions & Day/Night Toggle -->
        <div class="bg-white/90 backdrop-blur-md p-4 rounded-2xl shadow-xl border border-white/20 flex flex-col gap-3 w-56">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Atmosphere</span>
            
            <button id="dayNightBtn" onclick="toggleDayNight()" class="w-full py-2.5 px-4 bg-slate-800 text-white font-bold rounded-xl shadow-md hover:bg-slate-700 transition-all flex items-center justify-between">
                <span id="dayNightText">Switch to Night</span>
                <i id="dayNightIcon" class="fa-solid fa-moon text-yellow-400"></i>
            </button>

            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-1">Animations</span>

            <div class="flex items-center justify-between">
                <span class="text-sm font-semibold text-slate-700">Motion Speed</span>
                <span id="speedValue" class="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">1.0x</span>
            </div>
            <input id="speedSlider" type="range" min="0" max="3" step="0.1" value="1" oninput="updateSpeed(this.value)" class="w-full accent-indigo-600 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">

            <button onclick="toggleAutorotate()" id="autorotateBtn" class="py-1.5 px-3 border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold rounded-lg transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrows-spin"></i> Toggle Auto-Rotation
            </button>
        </div>
    </div>

    <!-- Bottom Legend/Stats -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-md px-6 py-3 rounded-full shadow-xl border border-white/20 flex items-center gap-6 z-10">
        <div class="flex items-center gap-2 text-xs text-slate-600 font-semibold">
            <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
            Carousel
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-600 font-semibold">
            <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
            Ferris Wheel
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-600 font-semibold">
            <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
            Swings & Slides
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-600 font-semibold">
            <span class="w-3 h-3 rounded-full bg-emerald-600 inline-block"></span>
            Pine Forest
        </div>
    </div>

    <!-- Import Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Globals & Scene Setup ---
        let scene, camera, renderer, controls;
        let ambientLight, sunLight;
        const streetLampLights = [];
        const streetLampBulbs = [];

        // Animation handles
        const animatedWindmills = [];
        const animatedSwings = [];
        const animatedSeesaws = [];
        const animatedCarousels = [];
        const animatedSpinners = [];
        let ferrisWheelMesh = null;
        const ferrisWheelCabins = [];
        let hotAirBalloon = null;

        // Settings / State
        let globalSpeedMultiplier = 1.0;
        let isNightMode = false;
        let atmosphereTransition = 0.0; // 0 = Day, 1 = Night
        const clock = new THREE.Clock();

        // Colors
        const COLORS = {
            grass: 0x62c370,
            path: 0xaa7c5c,
            red: 0xf04d4d,
            blue: 0x48a1ed,
            yellow: 0xffd043,
            white: 0xfbfcfc,
            wood: 0x8a5a36,
            darkWood: 0x5c3d24,
            metal: 0x4a4a4a,
            skyDay: 0x8ce2f0,
            skyNight: 0x0c0d21,
            sunDay: 0xfffcf0,
            moonNight: 0x8899cc
        };

        // --- Init Function ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(COLORS.skyDay);
            scene.fog = new THREE.FogExp2(COLORS.skyDay, 0.0035);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            setCameraPreset('bird');

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.05;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02; // Prevent going below ground
            controls.minDistance = 15;
            controls.maxDistance = 210;
            controls.target.set(0, 0, 0);

            // Lighting Setup
            setupLighting();

            // Build Ground and Map
            createGround();

            // Populate Park Assets
            populatePark();

            // Hide Loader
            setTimeout(() => {
                document.getElementById('loader').style.opacity = 0;
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                }, 500);
            }, 800);

            // Window resize handler
            window.addEventListener('resize', onWindowResize);

            // Start loop
            animate();
        }

        // --- Lighting ---
        function setupLighting() {
            // Ambient light (Cool skylight fill)
            ambientLight = new THREE.AmbientLight(0xd0e6ff, 0.85);
            scene.add(ambientLight);

            // Sun light (Warm sunlight)
            sunLight = new THREE.DirectionalLight(COLORS.sunDay, 1.4);
            sunLight.position.set(60, 90, 40);
            sunLight.castShadow = true;
            
            // Shadows optimization
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 300;
            const d = 110;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);
        }

        // --- Ground & Path Dynamic Canvas Texture ---
        function createGround() {
            // We use a high resolution canvas to draw custom winding pathways exactly like the cartoon reference map.
            // This prevents standard Z-fighting and models the dynamic winding layout flawlessly.
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            // Clean bright grass fill
            ctx.fillStyle = '#62c370';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw some cartoon grass variations/flower patches
            ctx.fillStyle = '#59b666';
            for (let i = 0; i < 600; i++) {
                const rx = Math.random() * canvas.width;
                const ry = Math.random() * canvas.height;
                const size = 6 + Math.random() * 12;
                ctx.beginPath();
                ctx.arc(rx, ry, size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Path styling
            ctx.strokeStyle = '#9c6c4c'; // Rich brown dirt
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const drawPathLine = (points, width) => {
                ctx.lineWidth = width;
                ctx.beginPath();
                // Map logical world coordinate [-100, 100] to Canvas [0, 2048]
                const mapPt = p => ({
                    x: ((p.x + 100) / 200) * canvas.width,
                    y: ((p.z + 100) / 200) * canvas.height
                });

                const start = mapPt(points[0]);
                ctx.moveTo(start.x, start.y);

                for (let i = 1; i < points.length; i++) {
                    const next = mapPt(points[i]);
                    ctx.lineTo(next.x, next.y);
                }
                ctx.stroke();
            };

            // Outer border path ring (thick paths)
            const outerPath = [
                {x: 0, z: 45},
                {x: -45, z: 35},
                {x: -70, z: 15},
                {x: -75, z: -15},
                {x: -60, z: -45},
                {x: -25, z: -60},
                {x: 25, z: -60},
                {x: 60, z: -45},
                {x: 75, z: -15},
                {x: 70, z: 15},
                {x: 45, z: 35},
                {x: 0, z: 45}
            ];
            drawPathLine(outerPath, 75);

            // Center cross-section pathways
            const crossPath1 = [
                {x: 0, z: 45},
                {x: 0, z: -60}
            ];
            drawPathLine(crossPath1, 65);

            const horizontalPath = [
                {x: -70, z: 5},
                {x: 70, z: 5}
            ];
            drawPathLine(horizontalPath, 65);

            // Loop enclosing the Ferris Wheel on the left
            const leftLoop = [
                {x: -40, z: 5},
                {x: -50, z: -15},
                {x: -30, z: -35},
                {x: -15, z: -15},
                {x: -40, z: 5}
            ];
            drawPathLine(leftLoop, 55);

            // Right secondary looping pathway
            const rightLoop = [
                {x: 40, z: 5},
                {x: 55, z: -20},
                {x: 35, z: -35},
                {x: 15, z: -15},
                {x: 40, z: 5}
            ];
            drawPathLine(rightLoop, 55);

            // Main southern entrance leading path
            const entrancePath = [
                {x: 0, z: 95},
                {x: 0, z: 45}
            ];
            drawPathLine(entrancePath, 90);

            // Dynamic texture creation
            const groundTex = new THREE.CanvasTexture(canvas);
            groundTex.wrapS = THREE.ClampToEdgeWrapping;
            groundTex.wrapT = THREE.ClampToEdgeWrapping;

            // Generate circular ground geometry
            const groundGeom = new THREE.CylinderGeometry(100, 102, 5, 64);
            const groundMat = new THREE.MeshStandardMaterial({
                map: groundTex,
                roughness: 0.9,
                metalness: 0.05
            });

            // Create materials array (top gets path map, sides get solid brown wood-like or green)
            const sideMat = new THREE.MeshStandardMaterial({ color: 0x422d1b, roughness: 0.95 });
            const groundMesh = new THREE.Mesh(groundGeom, [sideMat, groundMat, sideMat]);
            groundMesh.position.y = -2.5; // Offset cylinder height to make top surface rest at y = 0
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);
        }

        // --- Low Poly Asset Generators ---

        // Helpers to apply basic cartoon materials easily
        function getMat(color, roughness = 0.8) {
            return new THREE.MeshStandardMaterial({ color, roughness, metalness: 0.1, flatShading: true });
        }

        // 1. Pine Tree
        function createPineTree() {
            const group = new THREE.Group();

            // Trunk
            const trunkGeom = new THREE.CylinderGeometry(0.3, 0.45, 3, 5);
            const trunkMat = getMat(COLORS.darkWood);
            const trunk = new THREE.Mesh(trunkGeom, trunkMat);
            trunk.position.y = 1.5;
            trunk.castShadow = true;
            group.add(trunk);

            // Conical pine segments
            const leavesMat = getMat(0x277240 + (Math.random() - 0.5) * 0x051105);
            
            const bottomCone = new THREE.Mesh(new THREE.ConeGeometry(2.4, 3.2, 5), leavesMat);
            bottomCone.position.y = 4;
            bottomCone.castShadow = true;
            group.add(bottomCone);

            const midCone = new THREE.Mesh(new THREE.ConeGeometry(1.8, 2.6, 5), leavesMat);
            midCone.position.y = 5.8;
            midCone.castShadow = true;
            group.add(midCone);

            const topCone = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.0, 5), leavesMat);
            topCone.position.y = 7.4;
            topCone.castShadow = true;
            group.add(topCone);

            // Scaling randomness to avoid uniform clones
            const scale = 0.85 + Math.random() * 0.4;
            group.scale.set(scale, scale, scale);

            return group;
        }

        // 2. Windmill
        function createWindmill() {
            const group = new THREE.Group();

            // Pyramidal Base Tower (Dark Red / Brown)
            const baseGeom = new THREE.CylinderGeometry(0.6, 2.0, 9, 4);
            baseGeom.rotateY(Math.PI/4); // Turn box structure
            const baseMat = getMat(0xaf4343); // Cartoon Brick Red
            const base = new THREE.Mesh(baseGeom, baseMat);
            base.position.y = 4.5;
            base.castShadow = true;
            base.receiveShadow = true;
            group.add(base);

            // Top Cap/Head (White)
            const headGeom = new THREE.SphereGeometry(1.0, 6, 6);
            const headMat = getMat(COLORS.white);
            const head = new THREE.Mesh(headGeom, headMat);
            head.position.y = 9.2;
            head.castShadow = true;
            group.add(head);

            // Hub for spinning sails
            const hubGroup = new THREE.Group();
            hubGroup.position.set(0, 9.2, 1.1);

            const centerHubGeom = new THREE.CylinderGeometry(0.3, 0.3, 0.6, 6);
            centerHubGeom.rotateX(Math.PI/2);
            const hubMesh = new THREE.Mesh(centerHubGeom, getMat(COLORS.wood));
            hubMesh.castShadow = true;
            hubGroup.add(hubMesh);

            // 4 Blades
            for (let i = 0; i < 4; i++) {
                const bladePivot = new THREE.Group();
                bladePivot.rotation.z = (Math.PI / 2) * i;

                // Rod
                const rodGeom = new THREE.CylinderGeometry(0.08, 0.08, 4.2, 4);
                rodGeom.translate(0, 2.1, 0);
                const rod = new THREE.Mesh(rodGeom, getMat(COLORS.darkWood));
                rod.castShadow = true;
                bladePivot.add(rod);

                // Blade Sail Fabric (Offset Box)
                const sailGeom = new THREE.BoxGeometry(0.8, 2.8, 0.05);
                sailGeom.translate(0.35, 2.4, 0.05);
                const sail = new THREE.Mesh(sailGeom, getMat(COLORS.white));
                sail.castShadow = true;
                bladePivot.add(sail);

                hubGroup.add(bladePivot);
            }

            group.add(hubGroup);

            // Save for rotation loop
            animatedWindmills.push(hubGroup);

            return group;
        }

        // 3. Ferris Wheel (Masterpiece Element)
        function createFerrisWheel() {
            const group = new THREE.Group();

            // Blue A-frame supports
            const supportMat = getMat(COLORS.blue);

            const supportL1 = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 15, 6), supportMat);
            supportL1.position.set(-1.8, 7.3, 2.8);
            supportL1.rotation.set(0.18, 0, -0.12);
            supportL1.castShadow = true;
            group.add(supportL1);

            const supportL2 = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 15, 6), supportMat);
            supportL2.position.set(-1.8, 7.3, -2.8);
            supportL2.rotation.set(-0.18, 0, -0.12);
            supportL2.castShadow = true;
            group.add(supportL2);

            const supportR1 = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 15, 6), supportMat);
            supportR1.position.set(1.8, 7.3, 2.8);
            supportR1.rotation.set(0.18, 0, 0.12);
            supportR1.castShadow = true;
            group.add(supportR1);

            const supportR2 = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 15, 6), supportMat);
            supportR2.position.set(1.8, 7.3, -2.8);
            supportR2.rotation.set(-0.18, 0, 0.12);
            supportR2.castShadow = true;
            group.add(supportR2);

            // Central rotating wheel hub assembly
            ferrisWheelMesh = new THREE.Group();
            ferrisWheelMesh.position.set(0, 14.5, 0);

            // Axis Hub
            const mainAxleGeom = new THREE.CylinderGeometry(0.5, 0.5, 6.2, 8);
            mainAxleGeom.rotateX(Math.PI / 2);
            const axle = new THREE.Mesh(mainAxleGeom, getMat(COLORS.metal));
            axle.castShadow = true;
            ferrisWheelMesh.add(axle);

            // Double Rings (Front and Back)
            const ringGeom = new THREE.TorusGeometry(10.5, 0.22, 6, 32);
            
            const ringF = new THREE.Mesh(ringGeom, getMat(COLORS.blue));
            ringF.position.z = 1.6;
            ringF.castShadow = true;
            ferrisWheelMesh.add(ringF);

            const ringB = new THREE.Mesh(ringGeom, getMat(COLORS.blue));
            ringB.position.z = -1.6;
            ringB.castShadow = true;
            ferrisWheelMesh.add(ringB);

            // Inner connecting structural spokes
            const spokeCount = 8;
            const colorsList = [COLORS.red, COLORS.yellow, COLORS.blue, 0xe072cf];

            for (let i = 0; i < spokeCount; i++) {
                const angle = (Math.PI * 2 / spokeCount) * i;

                // Cross spokes
                const spokeGroup = new THREE.Group();
                spokeGroup.rotation.z = angle;

                const spokeF = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 21, 4), getMat(COLORS.yellow));
                spokeF.position.z = 1.6;
                spokeF.castShadow = true;
                spokeGroup.add(spokeF);

                const spokeB = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 21, 4), getMat(COLORS.yellow));
                spokeB.position.z = -1.6;
                spokeB.castShadow = true;
                spokeGroup.add(spokeB);

                // Inner crossbar connecting rings
                const crossTie = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.2, 4), getMat(COLORS.white));
                crossTie.rotateX(Math.PI / 2);
                crossTie.position.y = 10.5;
                crossTie.castShadow = true;
                spokeGroup.add(crossTie);

                ferrisWheelMesh.add(spokeGroup);

                // Build Self-Leveling Cabin Hangs
                const cabinPivot = new THREE.Group();
                // Calculate actual position of cabin at edge of wheel
                cabinPivot.position.set(Math.cos(angle) * 10.5, Math.sin(angle) * 10.5, 0);

                // The Hanging Pole
                const poleGeom = new THREE.CylinderGeometry(0.08, 0.08, 1.8, 4);
                poleGeom.translate(0, -0.9, 0);
                const pole = new THREE.Mesh(poleGeom, getMat(COLORS.metal));
                pole.castShadow = true;
                cabinPivot.add(pole);

                // Cabin Base
                const cabinColor = colorsList[i % colorsList.length];
                const baseGeom = new THREE.BoxGeometry(1.6, 1.2, 1.8);
                const cabinBase = new THREE.Mesh(baseGeom, getMat(cabinColor));
                cabinBase.position.y = -1.8;
                cabinBase.castShadow = true;
                cabinPivot.add(cabinBase);

                // Cabin Roof (Striped/Rounded look using open cylinders)
                const roofGeom = new THREE.CylinderGeometry(0.9, 0.9, 1.8, 8, 1, false, 0, Math.PI);
                roofGeom.rotateZ(Math.PI / 2);
                const roof = new THREE.Mesh(roofGeom, getMat(COLORS.white));
                roof.position.set(0, -1.0, 0);
                roof.castShadow = true;
                cabinPivot.add(roof);

                ferrisWheelMesh.add(cabinPivot);

                // Save references to cabins to level them dynamically during rotation
                ferrisWheelCabins.push({
                    pivot: cabinPivot,
                    angle: angle
                });
            }

            group.add(ferrisWheelMesh);

            // Ground safety/boarding platform structure
            const platGeom = new THREE.BoxGeometry(6, 1.5, 7);
            const plat = new THREE.Mesh(platGeom, getMat(COLORS.wood));
            plat.position.set(0, 0.75, 0);
            plat.receiveShadow = true;
            group.add(plat);

            // Platform handrails
            const fenceL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.5, 7), getMat(COLORS.yellow));
            fenceL.position.set(-2.8, 2.2, 0);
            fenceL.castShadow = true;
            group.add(fenceL);

            const fenceR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.5, 7), getMat(COLORS.yellow));
            fenceR.position.set(2.8, 2.2, 0);
            fenceR.castShadow = true;
            group.add(fenceR);

            return group;
        }

        // 4. Striped Carousel
        function createCarousel(sizeMultiplier = 1.0) {
            const group = new THREE.Group();

            // Circular Platform
            const radius = 5.5 * sizeMultiplier;
            const base = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius + 0.3, 0.8, 16), getMat(COLORS.yellow));
            base.position.y = 0.4;
            base.receiveShadow = true;
            base.castShadow = true;
            group.add(base);

            // Center Column
            const centerCol = new THREE.Mesh(new THREE.CylinderGeometry(0.6 * sizeMultiplier, 0.6 * sizeMultiplier, 5.5 * sizeMultiplier, 8), getMat(COLORS.red));
            centerCol.position.y = 3.25 * sizeMultiplier;
            centerCol.castShadow = true;
            group.add(centerCol);

            // Rotating Carousel Section
            const rotatingMesh = new THREE.Group();
            rotatingMesh.position.y = 0.8;

            // Carousel Supporting Columns
            const supportCount = 6;
            for (let i = 0; i < supportCount; i++) {
                const angle = (Math.PI * 2 / supportCount) * i;
                const dist = radius - 1.2 * sizeMultiplier;

                // Support thin golden rod
                const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4.5 * sizeMultiplier, 6), getMat(0xffd700)); // Gold
                rod.position.set(Math.cos(angle) * dist, 2.25 * sizeMultiplier, Math.sin(angle) * dist);
                rod.castShadow = true;
                rotatingMesh.add(rod);

                // Reusable abstract mini carousel animal placeholders (box horses!)
                const horseGeom = new THREE.BoxGeometry(0.8 * sizeMultiplier, 0.6 * sizeMultiplier, 0.3 * sizeMultiplier);
                const horseMat = getMat(i % 2 === 0 ? COLORS.blue : COLORS.red);
                const horse = new THREE.Mesh(horseGeom, horseMat);
                horse.position.set(Math.cos(angle) * dist, 1.8 * sizeMultiplier, Math.sin(angle) * dist);
                horse.rotation.y = -angle + Math.PI/2;
                horse.castShadow = true;
                rotatingMesh.add(horse);

                // Tiny legs/head
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.3 * sizeMultiplier, 0.4 * sizeMultiplier, 0.3 * sizeMultiplier), horseMat);
                head.position.set(Math.cos(angle) * dist + Math.sin(angle)*0.4, 2.2 * sizeMultiplier, Math.sin(angle) * dist - Math.cos(angle)*0.4);
                head.rotation.y = -angle + Math.PI/2;
                rotatingMesh.add(head);
            }

            // Alternating striped red/white roof dome
            const roofWedges = 12;
            const roofGroup = new THREE.Group();
            roofGroup.position.y = 5.2 * sizeMultiplier;

            for (let i = 0; i < roofWedges; i++) {
                const wedgeAngle = (Math.PI * 2) / roofWedges;
                const startAngle = wedgeAngle * i;

                // Procedural roof slices with alternating red and white
                const coneGeom = new THREE.ConeGeometry(radius + 0.1, 2.4 * sizeMultiplier, 12, 1, false, startAngle, wedgeAngle);
                const matColor = i % 2 === 0 ? COLORS.red : COLORS.white;
                const wedge = new THREE.Mesh(coneGeom, getMat(matColor));
                wedge.position.y = 1.2 * sizeMultiplier;
                wedge.castShadow = true;
                roofGroup.add(wedge);
            }
            rotatingMesh.add(roofGroup);
            group.add(rotatingMesh);

            // Save animated group
            animatedCarousels.push({
                mesh: rotatingMesh,
                speed: 0.8
            });

            return group;
        }

            group.add(w3);

            const w4 = w1.clone();
            w4.position.set(1.1, 0.5, -1.15);
            group.add(w4);

            return group;
        }

        // 13. Hot Air Balloon
        function createHotAirBalloon() {
            const group = new THREE.Group();

            // Large colorful striped balloon sphere
            const balloonGroup = new THREE.Group();
            const sliceCount = 12;
            const radius = 5.0;

            for (let i = 0; i < sliceCount; i++) {
                const phiLength = (Math.PI * 2) / sliceCount;
                const phiStart = phiLength * i;

                // Wedge shape
                const sphereWedge = new THREE.SphereGeometry(radius, 12, 12, phiStart, phiLength);
                const matColor = i % 2 === 0 ? COLORS.red : COLORS.yellow;
                const slice = new THREE.Mesh(sphereWedge, getMat(matColor));
                slice.castShadow = true;
                balloonGroup.add(slice);
            }
            // Squeeze balloon on vertical axis to give classic egg drop shape
            balloonGroup.scale.set(1.0, 1.35, 1.0);
            balloonGroup.position.y = 8;
            group.add(balloonGroup);

            // Connective suspension cords (thin cylinders)
            const cordMat = getMat(COLORS.metal);
            for (let i = 0; i < 4; i++) {
                const angle = (Math.PI / 2) * i + Math.PI/4;
                const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 4.0, 4), cordMat);
                cord.position.set(Math.cos(angle) * 1.5, 2.0, Math.sin(angle) * 1.5);
                cord.rotation.z = Math.cos(angle) * -0.15;
                cord.rotation.x = Math.sin(angle) * 0.15;
                cord.castShadow = true;
                group.add(cord);
            }

            // Passenger Basket (Brown wicker-like box)
            const basket = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.1, 1.6), getMat(COLORS.wood));
            basket.position.y = 0;
            basket.castShadow = true;
            group.add(basket);

            // Scale balloon down slightly to make it look great
            group.scale.set(0.7, 0.7, 0.7);

            return group;
        }


        // --- Scene Composition Builder ---
        function populatePark() {
            
            // --- 1. Background forest boundaries of Pine Trees ---
            // Rings around the circular platform borders to form natural cartoon background
            for (let i = 0; i < 110; i++) {
                const angle = (Math.PI * 2 / 110) * i;
                const r = 82 + Math.random() * 12;
                // Leave the front entrance area tree-free to show the beautiful sign
                if (angle > 1.25 && angle < 1.9) continue;

                const tree = createPineTree();
                tree.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
                scene.add(tree);
            }

            // Scattered internal tree clusters
            const treePositions = [
                {x: -45, z: 45}, {x: -35, z: 52}, {x: -55, z: 35},
                {x: 45, z: 45}, {x: 35, z: 52}, {x: 55, z: 35},
                {x: -65, z: -15}, {x: -55, z: -35}, {x: 55, z: -35},
                {x: 65, z: -15}, {x: -15, z: -62}, {x: 15, z: -62}
            ];
            treePositions.forEach(pos => {
                const tree = createPineTree();
                tree.position.set(pos.x + (Math.random()-0.5)*4, 0, pos.z + (Math.random()-0.5)*4);
                scene.add(tree);
            });

            // --- 2. Windmills ---
            const windmillPositions = [
                {x: -55, z: 50, rot: 0.5},
                {x: 55, z: 50, rot: -0.5},
                {x: -55, z: -55, rot: 2.1},
                {x: 55, z: -55, rot: -2.1}
            ];
            windmillPositions.forEach(pos => {
                const wm = createWindmill();
                wm.position.set(pos.x, 0, pos.z);
                wm.rotation.y = pos.rot;
                scene.add(wm);
            });

            // --- 3. Ferris Wheel ---
            const fw = createFerrisWheel();
            fw.position.set(-42, 0, -15);
            fw.rotation.y = Math.PI / 2; // Face inner paths
            scene.add(fw);

            // --- 4. Carousels ---
            // Large center carousel
            const carousel1 = createCarousel(1.0);
            carousel1.position.set(28, 0, -8);
            scene.add(carousel1);

            // Small carousel closer to back
            const carousel2 = createCarousel(0.65);
            carousel2.position.set(0, 0, -32);
            scene.add(carousel2);

            // --- 5. Slides ---
            const slide1 = createSlide();
            slide1.position.set(-25, 0, 20);
            slide1.rotation.y = -0.5;
            scene.add(slide1);

            const slide2 = createSlide();
            slide2.position.set(22, 0, 22);
            slide2.rotation.y = 0.5;
            scene.add(slide2);

            // --- 6. Swings ---
            const swing1 = createSwingSet();
            swing1.position.set(-36, 0, -42);
            swing1.rotation.y = 0.3;
            scene.add(swing1);

            const swing2 = createSwingSet();
            swing2.position.set(36, 0, -42);
            swing2.rotation.y = -0.3;
            scene.add(swing2);

            // --- 7. Seesaws ---
            const seesawPositions = [
                {x: -24, z: -5, rot: 0.8},
                {x: 24, z: -25, rot: -0.8},
                {x: 0, z: -50, rot: 1.5}
            ];
            seesawPositions.forEach(pos => {
                const ss = createSeesaw();
                ss.position.set(pos.x, 0, pos.z);
                ss.rotation.y = pos.rot;
                scene.add(ss);
            });

            // --- 8. Spinners ---
            const spinner1 = createSpinner();
            spinner1.position.set(-30, 0, -30);
            scene.add(spinner1);

            const spinner2 = createSpinner();
            spinner2.position.set(30, 0, -30);
            scene.add(spinner2);

            // --- 9. Street Lamps (Lined along winding paths) ---
            const lampPositions = [
                // Inner center paths
                {x: -12, z: 20, rot: 1.5},
                {x: 12, z: 20, rot: -1.5},
                {x: -12, z: -10, rot: 1.5},
                {x: 12, z: -10, rot: -1.5},
                // Front boundary
                {x: -8, z: 36, rot: 0.5},
                {x: 8, z: 36, rot: -0.5},
                // Lateral path spots
                {x: -45, z: 10, rot: 1.0},
                {x: 45, z: 10, rot: -1.0}
            ];
            lampPositions.forEach(pos => {
                const lamp = createStreetLamp();
                lamp.position.set(pos.x, 0, pos.z);
                lamp.rotation.y = pos.rot;
                scene.add(lamp);
            });

            // --- 10. Park Benches ---
            const benchPositions = [
                {x: -15, z: 28, rot: 0.2},
                {x: 15, z: 28, rot: -0.2},
                {x: -15, z: 5, rot: 3.14},
                {x: 15, z: 5, rot: 3.14},
                {x: -46, z: -5, rot: 1.5},
                {x: 46, z: -5, rot: -1.5}
            ];
            benchPositions.forEach(pos => {
                const bench = createBench();
                bench.position.set(pos.x, 0, pos.z);
                bench.rotation.y = pos.rot;
                scene.add(bench);
            });

            // --- 11. Entrance Sign Archway ---
            const arch = createEntranceArch();
            arch.position.set(0, 0, 48);
            scene.add(arch);

            // --- 12. Striped Food Booths & Carts ---
            const booth1 = createBooth(false); // Red
            booth1.position.set(-18, 0, 36);
            booth1.rotation.y = 0.4;
            scene.add(booth1);

            const booth2 = createBooth(true); // Blue
            booth2.position.set(18, 0, 36);
            booth2.rotation.y = -0.4;
            scene.add(booth2);

            // --- 13. Hot Air Balloon ---
            hotAirBalloon = createHotAirBalloon();
            hotAirBalloon.position.set(40, 24, -15);
            scene.add(hotAirBalloon);
        }


        // --- Frame Update & Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            const time = clock.getElapsedTime();

            // Smooth Day/Night atmospheric transitions
            updateAtmosphere(dt);

            // Apply animated speeds
            const speed = globalSpeedMultiplier;

            // 1. Windmill blades rotation
            animatedWindmills.forEach(hub => {
                hub.rotation.y += 1.8 * dt * speed;
            });

            // 2. Swings pendulum swaying physics simulation
            animatedSwings.forEach(swing => {
                const angle = Math.sin((time * 2.8 * speed) + swing.phase) * swing.maxAngle;
                swing.mesh.rotation.x = angle;
            });

            // 3. Seesaws up/down oscillating animation
            animatedSeesaws.forEach(seesaw => {
                const angle = Math.sin((time * 2.2 * speed) + seesaw.phase) * seesaw.maxAngle;
                seesaw.mesh.rotation.z = angle;
            });

            // 4. Circular Carousel spinning
            animatedCarousels.forEach(car => {
                car.mesh.rotation.y += car.speed * dt * speed;
            });

            // 5. Spinners spinning
            animatedSpinners.forEach(spinner => {
                spinner.rotation.y += 2.0 * dt * speed;
            });

            // 6. Ferris Wheel complex self-leveling cabin mechanics
            if (ferrisWheelMesh) {
                // Main wheel rotation
                const wheelRotSpeed = 0.22 * speed;
                ferrisWheelMesh.rotation.z += wheelRotSpeed * dt;

                // Make sure hanging cabins level out straight down relative to world gravity!
                const currentWheelAngle = ferrisWheelMesh.rotation.z;
                ferrisWheelCabins.forEach(cabin => {
                    // Setting rotation to counter-act parent wheel rotation
                    cabin.pivot.rotation.z = -currentWheelAngle;
                });
            }

            // 7. Hot Air Balloon gentle bobbing & floating movement
            if (hotAirBalloon) {
                hotAirBalloon.position.y = 24 + Math.sin(time * 0.8 * speed) * 1.5;
                hotAirBalloon.rotation.y += 0.05 * dt * speed;
            }

            // Update Controls
            if (controls) {
                controls.update();
            }

            // Render Frame
            renderer.render(scene, camera);
        }

        // --- Handle Atmosphere transition (Day & Night) ---
        function updateAtmosphere(dt) {
            const targetTransition = isNightMode ? 1.0 : 0.0;
            
            // Fast smooth step lerping
            if (Math.abs(atmosphereTransition - targetTransition) > 0.005) {
                atmosphereTransition += (targetTransition - atmosphereTransition) * 4.0 * dt;

                // 1. Interpolate Sky / Horizon Color
                const skyColor = new THREE.Color(COLORS.skyDay).lerp(new THREE.Color(COLORS.skyNight), atmosphereTransition);
                scene.background = skyColor;
                scene.fog.color = skyColor;

                // 2. Interpolate Lights intensities
                ambientLight.intensity = THREE.MathUtils.lerp(0.85, 0.25, atmosphereTransition);
                // Shift ambient color to cool blue moonlight
                ambientLight.color.lerpColors(new THREE.Color(0xd0e6ff), new THREE.Color(0x222a55), atmosphereTransition);

                sunLight.intensity = THREE.MathUtils.lerp(1.4, 0.0, atmosphereTransition);
                sunLight.color.lerpColors(new THREE.Color(COLORS.sunDay), new THREE.Color(COLORS.moonNight), atmosphereTransition);

                // 3. Interpolate street lamps emissive glow textures
                streetLampBulbs.forEach(bulbMat => {
                    bulbMat.emissive.setRGB(
                        0.85 * atmosphereTransition,
                        0.75 * atmosphereTransition,
                        0.25 * atmosphereTransition
                    );
                });

                // 4. Fade in street lamp point lights (smooth fade)
                streetLampLights.forEach(light => {
                    light.intensity = THREE.MathUtils.lerp(0.0, 1.8, atmosphereTransition);
                });
            }
        }


        // --- UI Operations & Callbacks ---

        function toggleDayNight() {
            isNightMode = !isNightMode;
            const btn = document.getElementById('dayNightBtn');
            const txt = document.getElementById('dayNightText');
            const icon = document.getElementById('dayNightIcon');

            if (isNightMode) {
                txt.innerText = "Switch to Day";
                icon.className = "fa-solid fa-sun text-amber-400 animate-pulse";
                btn.classList.replace("bg-slate-800", "bg-indigo-950");
            } else {
                txt.innerText = "Switch to Night";
                icon.className = "fa-solid fa-moon text-yellow-400";
                btn.classList.replace("bg-indigo-950", "bg-slate-800");
            }
        }

        function updateSpeed(val) {
            globalSpeedMultiplier = parseFloat(val);
            document.getElementById('speedValue').innerText = val + "x";
        }

        function toggleAutorotate() {
            controls.autoRotate = !controls.autoRotate;
            controls.autoRotateSpeed = 1.2;
            const btn = document.getElementById('autorotateBtn');
            if (controls.autoRotate) {
                btn.classList.add("bg-indigo-50", "border-indigo-300", "text-indigo-700");
            } else {
                btn.classList.remove("bg-indigo-50", "border-indigo-300", "text-indigo-700");
            }
        }

        function setCameraPreset(view) {
            if (view === 'bird') {
                camera.position.set(0, 110, 110);
            } else if (view === 'entrance') {
                camera.position.set(0, 14, 85);
            } else if (view === 'ferris') {
                camera.position.set(-65, 20, 22);
            }
        }

        function setCameraView(view) {
            // Smoothly animate camera position using presets
            const targets = {
                bird: { pos: new THREE.Vector3(0, 105, 115), look: new THREE.Vector3(0, 5, 0) },
                entrance: { pos: new THREE.Vector3(0, 8, 70), look: new THREE.Vector3(0, 6, 25) },
                ferris: { pos: new THREE.Vector3(-65, 18, 12), look: new THREE.Vector3(-42, 14, -15) }
            };

            const selected = targets[view];

            // Trigger lerping motion
            const startPos = camera.position.clone();
            const startLook = controls.target.clone();
            
            let progress = 0;
            const animCamera = () => {
                progress += 0.04;
                if (progress <= 1.0) {
                    camera.position.lerpVectors(startPos, selected.pos, progress);
                    controls.target.lerpVectors(startLook, selected.look, progress);
                    requestAnimationFrame(animCamera);
                } else {
                    camera.position.copy(selected.pos);
                    controls.target.copy(selected.look);
                }
            };
            animCamera();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Start System on Window Load ---
        window.onload = init;

    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Quality Interactive River with Trees</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">
        High Quality River Simulation with Forested Banks<br/>
        Left Click: Rotate | Right Click: Pan | Scroll: Zoom
    </div>

    <script>
        let scene, camera, renderer, controls, clock;
        let riverMesh, bankMesh, waterTexture, treeGroup;

        // Constants
        const SOIL_COLOR = 0x3d2b1f;
        const WATER_COLOR = 0x00aaff;
        const LEAF_COLORS = [0x2d4c1e, 0x3a5a2a, 0x4b6f3a];
        const TRUNK_COLOR = 0x3d2b1f;

        // Create a procedural texture for water movement
        function createWaterTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#0077be';
            ctx.fillRect(0, 0, 256, 256);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            for(let i = 0; i < 30; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * 256, Math.random() * 256);
                ctx.lineTo(Math.random() * 256, Math.random() * 256);
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 6); 
            return texture;
        }

        // Helper to create a simple tree
        function createTree() {
            const group = new THREE.Group();
            
            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.5, 0.7, 4, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: TRUNK_COLOR });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            group.add(trunk);

            // Foliage
            const leafColor = LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)];
            const leafMat = new THREE.MeshStandardMaterial({ color: leafColor });
            
            for(let i = 0; i < 3; i++) {
                const leafGeo = new THREE.ConeGeometry(2.5 - (i * 0.5), 4, 8);
                const leaves = new THREE.Mesh(leafGeo, leafMat);
                leaves.position.y = 4 + (i * 2);
                group.add(leaves);
            }

            const scale = 0.5 + Math.random() * 1.5;
            group.scale.set(scale, scale, scale);
            return group;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            clock = new THREE.Clock();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(120, 100, 150);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(100, 150, 50);
            sunLight.castShadow = true;
            scene.add(sunLight);

            waterTexture = createWaterTexture();

            // Initial river and tree creation
            createRiverAndBanks(15, 400, {x:0, y:0, z:0}, {x:0, y:0, z:0}, 45);

            const groundGeo = new THREE.PlaneGeometry(2000, 2000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -2;
            scene.add(ground);

            animate();
        }

        function createRiverAndBanks(w, l, pos, rot, curveIntensity) {
            if (riverMesh) scene.remove(riverMesh);
            if (bankMesh) scene.remove(bankMesh);
            if (treeGroup) scene.remove(treeGroup);

            treeGroup = new THREE.Group();

            const points = [];
            const segments = 300; 
            for (let i = 0; i <= 10; i++) {
                const t = i / 10;
                points.push(new THREE.Vector3(
                    Math.sin(t * Math.PI * 2) * curveIntensity,
                    0,
                    (t - 0.5) * l
                ));
            }
            const curve = new THREE.CatmullRomCurve3(points);

            const riverGeo = new THREE.PlaneBufferGeometry(w, l, 40, segments);
            const bankGeo = new THREE.PlaneBufferGeometry(w + 12, l, 40, segments);

            const transformGeo = (geo, yOffset) => {
                const posAttr = geo.attributes.position;
                const tmpVec = new THREE.Vector3();
                
                for (let i = 0; i < posAttr.count; i++) {
                    const x = posAttr.getX(i);
                    const y = posAttr.getY(i);
                    const t = (y / l) + 0.5;
                    const point = curve.getPointAt(t);
                    const tangent = curve.getTangentAt(t);
                    const up = new THREE.Vector3(0, 1, 0);
                    const side = new THREE.Vector3().crossVectors(tangent, up).normalize();
                    
                    tmpVec.copy(point).addScaledVector(side, x);
                    posAttr.setXYZ(i, tmpVec.x, tmpVec.y + yOffset, tmpVec.z);
                }
                posAttr.needsUpdate = true;
                geo.computeVertexNormals();
            };

            transformGeo(riverGeo, 0.2); 
            transformGeo(bankGeo, 0);    

            const riverMat = new THREE.MeshStandardMaterial({
                color: WATER_COLOR,
                map: waterTexture,
                roughness: 0.1,
                metalness: 0.5,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide
            });

            const bankMat = new THREE.MeshStandardMaterial({
                color: SOIL_COLOR,
                roughness: 1.0,
                side: THREE.DoubleSide
            });

            riverMesh = new THREE.Mesh(riverGeo, riverMat);
            bankMesh = new THREE.Mesh(bankGeo, bankMat);

            // TREE PLACEMENT ALONG BANK
            const treeCount = 60;
            for(let i = 0; i < treeCount; i++) {
                const t = Math.random();
                const point = curve.getPointAt(t);
                const tangent = curve.getTangentAt(t);
                const side = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0,1,0)).normalize();
                
                const tree = createTree();
                
                // Position trees randomly on left or right bank
                const sideOffset = (Math.random() > 0.5 ? 1 : -1) * (w / 2 + 4 + Math.random() * 4);
                tree.position.copy(point).addScaledVector(side, sideOffset);
                
                // Random rotation
                tree.rotation.y = Math.random() * Math.PI * 2;
                
                treeGroup.add(tree);
            }

            const group = new THREE.Group();
            group.add(riverMesh);
            group.add(bankMesh);
            group.add(treeGroup);

            group.position.set(pos.x, pos.y, pos.z);
            group.rotation.set(rot.x, rot.y, rot.z);
            
            scene.add(group);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (waterTexture) {
                waterTexture.offset.y -= delta * 0.2; 
            }

            // Water ripple
            if (riverMesh) {
                riverMesh.position.y = Math.sin(time * 0.5) * 0.05;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>

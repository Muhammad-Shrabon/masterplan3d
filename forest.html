<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Three.js Forest</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050a05; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #e0e0e0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            user-select: none;
        }
        .controls {
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Deep Forest</h1>
        <div class="controls">
            W, A, S, D / Arrows: Move View<br>
            Mouse Drag: Rotate Camera<br>
            Scroll: Zoom In/Out
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        const clock = new THREE.Clock();

        function init() {
            // 1. Scene & Atmosphere
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a150a); 
            scene.fog = new THREE.FogExp2(0x1a251a, 0.04); // Slightly thinner mist for light visibility

            // 2. Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 12);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 4. Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2; 
            controls.target.set(0, 2, 0);

            // 5. ENHANCED Lighting
            // Ambient light for general visibility
            const ambientLight = new THREE.AmbientLight(0x607060, 0.6); 
            scene.add(ambientLight);

            // Hemispheric light to simulate light bouncing off the grass
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1a2b0a, 0.4);
            scene.add(hemiLight);

            // Powerful Sun Light
            const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.8);
            sunLight.position.set(40, 60, 20);
            sunLight.castShadow = true;
            
            // Optimize shadow resolution
            sunLight.shadow.mapSize.width = 4096;
            sunLight.shadow.mapSize.height = 4096;
            sunLight.shadow.camera.left = -60;
            sunLight.shadow.camera.right = 60;
            sunLight.shadow.camera.top = 60;
            sunLight.shadow.camera.bottom = -60;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            // Visual Sun (The glow in the sky)
            const sunGeo = new THREE.SphereGeometry(4, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.position.copy(sunLight.position).multiplyScalar(10); // Far away
            scene.add(sunMesh);

            // 6. Forest Floor
            const floorGeo = new THREE.PlaneGeometry(250, 250, 64, 64);
            const pos = floorGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                pos.setZ(i, Math.sin(x * 0.15) * Math.cos(y * 0.15) * 0.8);
            }
            floorGeo.computeVertexNormals();
            
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x243b10, 
                roughness: 0.8,
                metalness: 0.05
            });
            const ground = new THREE.Mesh(floorGeo, floorMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 7. Tree Generation
            function createTree(type, x, z) {
                const group = new THREE.Group();
                
                const trunkHeight = type === 'pine' ? 6 + Math.random() * 4 : 4 + Math.random() * 3;
                const trunkGeo = new THREE.CylinderGeometry(0.2, 0.45, trunkHeight, 10);
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2b1d14, roughness: 0.9 });
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = trunkHeight / 2;
                trunk.castShadow = true;
                trunk.receiveShadow = true;
                group.add(trunk);

                if (type === 'pine') {
                    const layers = 5 + Math.floor(Math.random() * 3);
                    for (let i = 0; i < layers; i++) {
                        const levelGeo = new THREE.ConeGeometry(2.2 - (i * 0.35), 3, 12);
                        const levelMat = new THREE.MeshStandardMaterial({ 
                            color: new THREE.Color(0x0a1a0a).multiplyScalar(1 + Math.random() * 0.2), 
                            roughness: 0.8 
                        });
                        const level = new THREE.Mesh(levelGeo, levelMat);
                        level.position.y = trunkHeight - 1.5 + (i * 1.4);
                        level.castShadow = true;
                        level.receiveShadow = true;
                        group.add(level);
                    }
                } else {
                    const canopyGeo = new THREE.SphereGeometry(2.5 + Math.random(), 12, 10);
                    const canopyMat = new THREE.MeshStandardMaterial({ 
                        color: new THREE.Color(0x1a3300).multiplyScalar(1 + Math.random() * 0.3),
                        roughness: 0.8
                    });
                    const canopy = new THREE.Mesh(canopyGeo, canopyMat);
                    canopy.position.y = trunkHeight + 0.8;
                    canopy.castShadow = true;
                    canopy.receiveShadow = true;
                    group.add(canopy);
                }

                group.position.set(x, 0, z);
                group.position.y = Math.sin(x * 0.15) * Math.cos(z * 0.15) * 0.8;
                scene.add(group);
            }

            // Populate
            for (let i = 0; i < 120; i++) {
                const type = Math.random() > 0.4 ? 'pine' : 'broadleaf';
                const rx = (Math.random() - 0.5) * 120;
                const rz = (Math.random() - 0.5) * 120;
                if (Math.abs(rx) > 6 || Math.abs(rz) > 6) {
                    createTree(type, rx, rz);
                }
            }

            // Rocks
            for (let i = 0; i < 60; i++) {
                const stoneGeo = new THREE.DodecahedronGeometry(0.2 + Math.random() * 0.4, 1);
                const stoneMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.9 });
                const stone = new THREE.Mesh(stoneGeo, stoneMat);
                const rx = (Math.random() - 0.5) * 60;
                const rz = (Math.random() - 0.5) * 60;
                stone.position.set(rx, 0, rz);
                stone.position.y = Math.sin(rx * 0.15) * Math.cos(rz * 0.15) * 0.8 - 0.1;
                stone.rotation.set(Math.random(), Math.random(), Math.random());
                stone.castShadow = true;
                stone.receiveShadow = true;
                scene.add(stone);
            }

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
